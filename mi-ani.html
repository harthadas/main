<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מי אני?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;600&display=swap">
<style>
/* Layout: one calm column. The speaking color sits on top, its riddle in a bubble under it, the three answers at the bottom.
   Everything is grey-blue and white until the color is found; then the color fills the speaker and the drawings. */
:root {
  --paper: #f3f5f8;
  --surface: #ffffff;
  --ink: #1d2431;
  --ink-soft: #5a6476;
  --line: #d8dee7;
  --glass: #97a3b6;
  --mystery: #e6eaf0;
  --good: #2f8a55;
  --display: "Rubik", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --body: "Noto Sans Hebrew", "Rubik", "Arial Hebrew", Arial, sans-serif;
  --radius: 22px;
  --answer: var(--mystery);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 680px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 16px 32px;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
h1, h2, p { margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 700; text-wrap: balance; line-height: 1.5; }
svg { display: block; }

/* drawings: areas still to be colored show a faint dot pattern */
.c { fill: url(#todo); }
.cs { stroke: url(#todo); }
.colored .c { fill: var(--answer); }
.colored .cs { stroke: var(--answer); }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.icon-btn {
  width: 52px; height: 52px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; flex: none; padding: 0;
}
.icon-btn svg { width: 26px; height: 26px; }
.icon-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.spacer { width: 52px; flex: none; }
.dots { flex: 1; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
.dots span { width: 16px; height: 16px; border-radius: 50%; background: var(--line); }
.dots .now { background: var(--surface); box-shadow: 0 0 0 3px var(--ink); }
.dots .got { box-shadow: inset 0 0 0 2px rgba(29,36,49,.16); }

/* ---------- home ---------- */
.home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-block: 24px; text-align: center; }
.home h1 { font-size: clamp(2.3rem, 9vw, 3.2rem); line-height: 1.3; }
.home .lead { font-family: var(--display); font-size: 1.25rem; color: var(--ink-soft); max-width: 30ch; text-wrap: balance; }
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; width: 100%; max-width: 520px; margin-top: 10px; }
.level {
  border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 22px 16px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px;
  font-family: var(--display); font-size: 1.4rem; font-weight: 500; line-height: 1.5;
  transition: border-color .15s, transform .15s;
}
.level:hover { border-color: var(--glass); }
.level:active { transform: scale(.98); }
.level svg { width: 84px; height: 84px; }

/* ---------- the speaking color ---------- */
.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 10px; }
.speaker { width: 132px; }
.speaker svg { width: 100%; height: auto; overflow: visible; }
.speaker.no { animation: no .5s ease-in-out; }
.speaker.yes { animation: yes .7s ease-out; }
@keyframes no { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes yes { 0% { transform: scale(1); } 35% { transform: scale(1.14) translateY(-8px); } 100% { transform: scale(1); } }

.bubble {
  position: relative; width: 100%;
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 16px 16px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.bubble::before { /* tail pointing up at the speaker */
  content: ""; position: absolute; top: -12px; left: 50%;
  width: 22px; height: 22px; background: var(--surface);
  border-top: 2px solid var(--line); border-left: 2px solid var(--line);
  transform: translateX(-50%) rotate(45deg); border-top-left-radius: 4px;
}
.say-row { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }
.say { font-family: var(--display); font-size: clamp(1.4rem, 5.4vw, 1.75rem); font-weight: 500; line-height: 1.75; text-align: center; text-wrap: balance; min-width: 0; }
.listen {
  width: 46px; height: 46px; border-radius: 50%; flex: none; padding: 0;
  border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center;
}
.listen svg { width: 22px; height: 22px; }

.pics { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
.pic { position: relative; width: 118px; aspect-ratio: 1; max-width: 100%; border-radius: 18px; background: var(--paper); }
.pic .layer { position: absolute; inset: 0; display: grid; place-items: center; }
.pic svg { width: 78%; height: 78%; }
.paint-in { animation: paint-in 1s ease-out both; }
@keyframes paint-in { from { clip-path: circle(0% at 50% 55%); } to { clip-path: circle(80% at 50% 55%); } }

/* ---------- hints ---------- */
.hints { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.hint {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 2px dashed var(--line); border-radius: 18px;
  padding: 10px 14px;
  font-family: var(--display); font-size: 1.25rem; font-weight: 500; line-height: 1.7;
}
.hint p { flex: 1; min-width: 0; }
.hint .pic { width: 72px; border-radius: 14px; flex: none; }
.hint .chip { width: 40px; height: 40px; border-radius: 50%; flex: none; margin-inline: 6px; box-shadow: inset 0 0 0 2px rgba(29,36,49,.14); position: relative; }
.hint .chip::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top right, transparent calc(50% - 2px), var(--ink) calc(50% - 2px), var(--ink) calc(50% + 2px), transparent calc(50% + 2px)); border-radius: 50%; }
.fresh { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.hint-btn {
  display: inline-flex; align-items: center; gap: 10px; align-self: center;
  border: 2px dashed var(--glass); background: var(--surface); border-radius: 999px;
  padding: 8px 20px 8px 16px; min-height: 52px;
  font-family: var(--display); font-size: 1.2rem; font-weight: 500;
}
.hint-btn svg { width: 26px; height: 26px; }
.hint-btn .left { display: inline-flex; gap: 4px; }
.hint-btn .left i { width: 9px; height: 9px; border-radius: 50%; background: var(--glass); }

/* ---------- answers ---------- */
.ask { font-family: var(--display); font-size: 1.35rem; font-weight: 700; text-align: center; margin-top: 8px; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.opt {
  position: relative;
  border: 2px solid var(--line); background: var(--surface); border-radius: 20px;
  padding: 16px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-family: var(--display); font-size: 1.35rem; font-weight: 500; line-height: 1.6;
  transition: border-color .15s, transform .15s, opacity .2s;
}
.opt:not(:disabled):hover { border-color: var(--glass); }
.opt:not(:disabled):active { transform: scale(.97); }
.opt .sw { width: 70px; height: 70px; max-width: 100%; border-radius: 50%; box-shadow: inset 0 -6px 0 rgba(0,0,0,.07), inset 0 0 0 2px rgba(29,36,49,.14); }
.opt .mark { position: absolute; top: 8px; inset-inline-start: 8px; width: 28px; height: 28px; }
.opt.wrong, .opt.gone { opacity: .35; }
.opt.gone .sw { box-shadow: inset 0 0 0 2px rgba(29,36,49,.14); }
.opt.right { border-color: var(--good); box-shadow: 0 0 0 2px var(--good); }
.opt.right .mark { color: var(--good); }
.opt.idle { opacity: .55; }

.fb {
  min-height: 3.4rem; display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--display); font-size: 1.4rem; font-weight: 700; text-align: center; text-wrap: balance;
}
.fb.yes { color: var(--good); }
.fb svg { width: 32px; height: 32px; flex: none; }

.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.act {
  border: 2px solid var(--line); background: var(--surface); border-radius: 999px;
  font-family: var(--display); font-weight: 500; font-size: 1.25rem;
  padding: 10px 26px; min-height: 60px;
  display: inline-flex; align-items: center; gap: 10px;
}
.act svg { width: 24px; height: 24px; }
.act.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }

.play { display: flex; flex-direction: column; gap: 16px; flex: 1; }

/* ---------- end ---------- */
.end { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 22px; padding-block: 16px; text-align: center; }
.end h1 { font-size: clamp(2rem, 8vw, 2.6rem); }
.end .lead { font-family: var(--display); font-size: 1.25rem; color: var(--ink-soft); }
.found { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; width: 100%; max-width: 520px; }
.found div { display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--display); font-size: 1.1rem; font-weight: 500; position: relative; }
.found svg { width: 76px; max-width: 100%; height: auto; }
.found .star { position: absolute; top: -4px; inset-inline-start: 2px; width: 24px; height: 24px; color: #e2a417; }
.legend { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 1rem; }
.legend svg { width: 20px; height: 20px; color: #e2a417; }

@media (max-width: 420px) {
  body { font-size: 17px; }
  .speaker { width: 112px; }
  .pic { width: 104px; }
  .hint .pic { width: 64px; }
  .opts { gap: 8px; }
  .opt { font-size: 1.2rem; }
  .opt .sw { width: 58px; height: 58px; }
  .found { grid-template-columns: repeat(4, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="todo" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#ffffff"/>
      <circle cx="3.5" cy="3.5" r="1" fill="#c3cbd7"/>
    </pattern>
  </defs>
</svg>
<div id="app" lang="he" dir="rtl"></div>

<script>
(() => {
/* ================= the colors and what they say =================
   clues: the two things in the riddle ("אֲנִי הַצֶּבַע שֶׁל … וְשֶׁל …").
   more:  two more things, opened one at a time as hints.
   Each thing is [drawing id, its name with the definite article]. */
const COLORS = [
  { id: 'yellow', name: 'צָהֹב',  hex: '#f7c531',
    clues: [['sun', 'הַשֶּׁמֶשׁ'], ['banana', 'הַבָּנָנָה']], more: [['lemon', 'הַלִּימוֹן'], ['chick', 'הָאֶפְרוֹחַ']] },
  { id: 'blue',   name: 'כָּחֹל',  hex: '#2e6bd1', dark: true,
    clues: [['sea', 'הַיָּם'], ['sky', 'הַשָּׁמַיִם']], more: [['whale', 'הַלִּוְיָתָן'], ['jeans', 'מִכְנְסֵי הַגִּ׳ינְס']] },
  { id: 'red',    name: 'אָדֹם',  hex: '#e03a2f',
    clues: [['strawberry', 'הַתּוּת'], ['tomato', 'הָעַגְבָנִיָּה']], more: [['firetruck', 'הַכַּבָּאִית'], ['cherries', 'הַדֻּבְדְּבָנִים']] },
  { id: 'green',  name: 'יָרֹק',  hex: '#3da35d',
    clues: [['grass', 'הַדֶּשֶׁא'], ['leaf', 'הֶעָלִים']], more: [['frog', 'הַצְּפַרְדֵּעַ'], ['cucumber', 'הַמְּלָפְפוֹן']] },
  { id: 'orange', name: 'כָּתֹם',  hex: '#f58a24',
    clues: [['orange', 'הַתַּפּוּז'], ['carrot', 'הַגֶּזֶר']], more: [['pumpkin', 'הַדְּלַעַת'], ['fox', 'הַשּׁוּעָל']] },
  { id: 'purple', name: 'סָגֹל',  hex: '#8b4fc0', dark: true,
    clues: [['eggplant', 'הֶחָצִיל'], ['plum', 'הַשְּׁזִיף']], more: [['lavender', 'הַלַּוֶנְדֶּר'], ['violet', 'הַסִּיגָלִית']] },
  { id: 'pink',   name: 'וָרֹד',  hex: '#f59ac0',
    clues: [['flamingo', 'הַפְלָמִינְגוֹ'], ['cottoncandy', 'שַׂעֲרוֹת סָבְתָא']], more: [['bubblegum', 'בּוּעַת הַמַּסְטִיק'], ['rose', 'הַוֶּרֶד']] },
  { id: 'brown',  name: 'חוּם',   hex: '#8a5a33', dark: true,
    clues: [['chocolate', 'הַשּׁוֹקוֹלָד'], ['trunk', 'גֶּזַע הָעֵץ']], more: [['bear', 'הַדֹּב'], ['cookie', 'הָעוּגִיָּה']] },
  { id: 'black',  name: 'שָׁחֹר', hex: '#22252b', dark: true,
    clues: [['night', 'הַלַּיְלָה'], ['crow', 'הָעוֹרֵב']], more: [['ant', 'הַנְּמָלָה'], ['wheels', 'הַגַּלְגַּלִּים שֶׁל הַמְּכוֹנִית']] },
  { id: 'white',  name: 'לָבָן',  hex: '#ffffff',
    clues: [['snow', 'הַשֶּׁלֶג'], ['milk', 'הֶחָלָב']], more: [['tooth', 'הַשִּׁנַּיִם'], ['sheep', 'הַכִּבְשָׂה']] },
  { id: 'gray',   name: 'אָפֹר',  hex: '#9da3ab',
    clues: [['elephant', 'הַפִּיל'], ['mouse', 'הָעַכְבָּר']], more: [['raincloud', 'עֲנַן הַגֶּשֶׁם'], ['koala', 'הַקּוֹאָלָה']] },
];
const COLOR = Object.fromEntries(COLORS.map(c => [c.id, c]));

// Never offered side by side: a child could fairly argue for either one
// (a sun drawn orange, a pink rose, a grey night).
const NEAR = {
  red: ['pink', 'orange'], pink: ['red', 'purple'], purple: ['pink'],
  orange: ['yellow', 'red', 'brown'], yellow: ['orange'], brown: ['orange', 'black'],
  black: ['gray', 'brown'], gray: ['black', 'white'], white: ['gray'],
};
const ROUND = 8;

const riddle = c => `אֲנִי הַצֶּבַע שֶׁל ${c.clues[0][1]} וְשֶׁל ${c.clues[1][1]}.`;
const moreLine = t => `גַּם ${t[1]} בַּצֶּבַע שֶׁלִּי.`;
const notMe = c => `אֲנִי לֹא ${c.name}.`;
const wrongLine = c => `לֹא, אֲנִי לֹא ${c.name}. נַסּוּ שׁוּב!`;
const rightLine = c => `נָכוֹן! אֲנִי ${c.name}!`;

/* ================= drawings =================
   Coloring-book line art, 64×64. Parts with class "c" are the parts that
   carry the color: dotted until the answer is found, then filled. */
const K = 'fill="#1d2431" stroke="none"';
const spark = (x, y, s) => `<path d="M${x} ${y - s}L${x + s * .3} ${y - s * .3} ${x + s} ${y} ${x + s * .3} ${y + s * .3} ${x} ${y + s} ${x - s * .3} ${y + s * .3} ${x - s} ${y} ${x - s * .3} ${y - s * .3}Z" stroke-width="1.6"/>`;
const drop = (x, y) => `<path d="M${x} ${y}c-2 4-3.5 6-3.5 8a3.5 3.5 0 0 0 7 0c0-2-1.5-4-3.5-8z"/>`;
const dots = (pts, r = 1.4) => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}" ${K}/>`).join('');

function lavender() {
  let s = '<path fill="none" d="M32 60V10M21 60L13 18M43 60L51 18"/>';
  [[32, 10], [13, 18], [51, 18]].forEach(([xt, yt]) => {
    const xb = xt === 32 ? 32 : xt < 32 ? 21 : 43;
    for (let k = 0; k < 4; k++) {
      const y = yt + 3 + k * 6, x = xt + (xb - xt) * (y - yt) / (60 - yt);
      s += `<ellipse class="c" cx="${x - 3.2}" cy="${y}" rx="3" ry="3.6" stroke-width="2"/><ellipse class="c" cx="${x + 3.2}" cy="${y}" rx="3" ry="3.6" stroke-width="2"/>`;
    }
    s += `<ellipse class="c" cx="${xt}" cy="${yt - 1}" rx="3" ry="3.8" stroke-width="2"/>`;
  });
  return s;
}
function violet() {
  let s = '<path fill="none" d="M32 34v26"/><path d="M32 52c-7-8-17-7-20-1 8 5 15 5 20 1z"/>';
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
    s += `<circle class="c" cx="${(32 + Math.cos(a) * 11).toFixed(1)}" cy="${(24 + Math.sin(a) * 11).toFixed(1)}" r="9"/>`;
  }
  return s + '<circle cx="32" cy="24" r="5"/>';
}

const PICS = {
  sun: `<circle class="c" cx="32" cy="32" r="13"/><path fill="none" d="M32 5v9M32 50v9M5 32h9M50 32h9M12.9 12.9l6.4 6.4M44.7 44.7l6.4 6.4M12.9 51.1l6.4-6.4M44.7 19.3l6.4-6.4"/>`,
  banana: `<path d="M15 16l1-7h6l1 7"/><path class="c" d="M15 15Q11 51 54 50Q56 45 50 43Q25 41 23 15Z"/><path fill="none" d="M50 43l4 7"/>`,
  lemon: `<path class="c" d="M5 32Q8 29 11 28C14 18 24 14 32 14S50 18 53 28Q56 29 59 32Q56 35 53 36C50 46 40 50 32 50S14 46 11 36Q8 35 5 32Z"/><path fill="none" d="M19 27q4-6 11-7"/>`,
  chick: `<path fill="none" d="M31 53v6M42 53v6M27 59h8M38 59h8"/><ellipse class="c" cx="37" cy="40" rx="19" ry="14"/><circle class="c" cx="22" cy="24" r="11"/><path d="M11 22l-7 3 7 3z"/><circle cx="19" cy="21" r="2" ${K}/><path fill="none" d="M32 40q8 8 16 0M21 13q1-5 6-5"/>`,
  sea: `<path class="c" d="M4 32c5-5 9-5 14 0s9 5 14 0 9-5 14 0 9 5 14 0V58H4z"/><path fill="none" d="M4 45c5-5 9-5 14 0s9 5 14 0 9-5 14 0 9 5 14 0"/><path fill="none" d="M32 6v20"/><path d="M30 8L30 24 19 24Z"/><path d="M34 10L44 24H34Z"/><path d="M17 26h30l-5 6H22z"/>`,
  sky: `<rect class="c" x="5" y="8" width="54" height="48" rx="10"/><path d="M20 46h22a7 7 0 0 0 1-14 10 10 0 0 0-19-2 8 8 0 0 0-4 16z"/><path fill="none" d="M14 21q3-3 6 0q3-3 6 0M36 16q2.5-2.5 5 0q2.5-2.5 5 0"/>`,
  whale: `<path fill="none" d="M22 19v-8M22 13q-3-4-7-4M22 13q3-4 7-4"/><path class="c" d="M6 38c0-11 10-18 24-18 11 0 19 6 22 14l5-7c2-1 4 0 3 2l-3 9 4 7c1 2-1 3-3 2l-6-5c-4 8-12 12-23 12C14 54 6 48 6 38z"/><circle cx="16" cy="34" r="2" ${K}/><path fill="none" d="M10 43q7 5 16 3"/>`,

  if (!q.justSolved) return `<div class="pic"><div class="layer colored">${draw(id)}</div></div>`;
  return `<div class="pic"><div class="layer">${draw(id)}</div><div class="layer colored paint-in">${draw(id)}</div></div>`;

/* ================= reading aloud =================
   Uses a Hebrew voice if the device has one; otherwise the buttons stay hidden. */
const synth = window.speechSynthesis;
let voice = null;
function findVoice() {
  if (!synth) return;
  try { voice = synth.getVoices().find(v => /^(he|iw)\b/i.test(v.lang)) || null; } catch (e) { voice = null; }
}
function say(text) {
  if (!voice) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[֑-ׇ]/g, ''));  // voices read plain spelling more reliably than pointed text
  u.voice = voice; u.lang = voice.lang; u.rate = .9;
  synth.speak(u);
}

/* ================= state ================= */
const VOICE_KEY = 'mi-ani-voice';
const state = { view: 'home', level: 1, queue: [], qi: 0, q: null, results: [], voiceOn: false, anim: null, focus: null };
try { state.voiceOn = localStorage.getItem(VOICE_KEY) === '1'; } catch (e) {}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function makeQuestion(id) {
  const avoid = NEAR[id] || [];
  const others = shuffle(COLORS.filter(c => c.id !== id && !avoid.includes(c.id))).slice(0, 2).map(c => c.id);
  return { id, opts: shuffle([id, ...others]), wrong: new Set(), gone: null, hints: 0, solved: false, justSolved: false, msg: null };
}

// what the next hint would be: the two extra things, then crossing out one wrong answer
function nextHint(q) {
  if (q.solved) return null;
  if (q.hints < 2) return 'more';
  if (q.hints === 2 && q.opts.some(o => o !== q.id && !q.wrong.has(o))) return 'cross';
  return null;
}
function hintsLeft(q) {
  if (q.solved) return 0;
  const canCross = q.opts.some(o => o !== q.id && !q.wrong.has(o) && o !== q.gone);
  return Math.max(0, 2 - q.hints) + (q.hints < 3 && canCross ? 1 : 0);
}

/* ================= rendering ================= */
const app = document.getElementById('app');

function render() {
  const active = document.activeElement;
  const focusKey = state.focus || (active && active.dataset ? active.dataset.key : null);
  app.innerHTML = ({ home: homeView, play: playView, end: endView })[state.view]();
  state.anim = null; state.focus = null;
  if (state.q) state.q.justSolved = false;
  if (focusKey) {
    const el = app.querySelector(`[data-key="${focusKey}"]`);
    if (el && !el.disabled) el.focus({ preventScroll: true });
  }
}

function voiceBtn() {
  if (!voice) return '<span class="spacer"></span>';
  return `<button class="icon-btn" data-act="voice" data-key="voice" aria-pressed="${state.voiceOn}" aria-label="הַקְרָאָה בְּקוֹל">${I.sound}</button>`;
}

function homeView() {
  return `<div class="bar"><span class="spacer"></span><span class="dots"></span>${voiceBtn()}</div>
  <div class="home">
    <div class="speaker">${blobSVG(null)}</div>
    <h1>מִי אֲנִי?</h1>
    <p class="lead">הַצְּבָעִים מְסַפְּרִים עַל עַצְמָם. נַחֲשׁוּ מִי מְדַבֵּר!</p>
    <div class="levels">
      <button class="level" data-act="start" data-level="1" data-key="l1">${draw('banana')}עִם תְּמוּנוֹת</button>
      <button class="level" data-act="start" data-level="2" data-key="l2">${I.lines}רַק מִשְׁפָּטִים</button>
    </div>
  </div>`;
}

function playView() {
  const q = state.q, c = COLOR[q.id], pics = state.level === 1;

  const progress = state.queue.map((id, i) => {
    if (i < state.qi || (i === state.qi && q.solved)) return `<span class="got" style="background:${COLOR[id].hex}"></span>`;
    return `<span class="${i === state.qi ? 'now' : ''}"></span>`;
  }).join('');

  const hintRows = [];
  for (let i = 0; i < Math.min(q.hints, 2); i++) {
    const t = c.more[i];
    hintRows.push(`<div class="hint${state.anim === 'hint' && i === q.hints - 1 ? ' fresh' : ''}">
      ${pics ? picTile(t[0], q) : ''}<p>${moreLine(t)}</p></div>`);
  }
  if (q.gone) {
    const g = COLOR[q.gone];
    hintRows.push(`<div class="hint${state.anim === 'hint' ? ' fresh' : ''}">
      <span class="chip" style="background:${g.hex}"></span><p>${notMe(g)}</p></div>`);
  }

  const left = hintsLeft(q);
  const hintBtn = left ? `<button class="hint-btn" data-act="hint" data-key="hint">${I.bulb}רֶמֶז
      <span class="left" aria-hidden="true">${'<i></i>'.repeat(left)}</span></button>` : '';

  const opts = q.opts.map(id => {
    const o = COLOR[id];
    let cls = '', mark = '', dis = q.solved;
    if (q.wrong.has(id)) { cls = 'wrong'; mark = I.x; dis = true; }
    else if (q.gone === id) { cls = 'gone'; mark = I.x; dis = true; }
    else if (q.solved && id === q.id) { cls = 'right'; mark = I.check; }
    else if (q.solved) cls = 'idle';
    return `<button class="opt ${cls}" data-act="pick" data-id="${id}" data-key="o-${id}" ${dis ? 'disabled' : ''}>
      ${mark ? `<span class="mark">${mark}</span>` : ''}<span class="sw" style="background:${o.hex}"></span>${o.name}</button>`;
  }).join('');

  let fb = '';
  if (q.msg) fb = q.msg.kind === 'yes' ? `${I.star}${rightLine(c)}` : wrongLine(COLOR[q.msg.id]);

  const last = state.qi === state.queue.length - 1;

  return `<div class="bar">
      <button class="icon-btn" data-act="home" data-key="home" aria-label="לַמָּסָךְ הָרִאשׁוֹן">${I.back}</button>
      <span class="dots" role="img" aria-label="חִידָה ${state.qi + 1} מִתּוֹךְ ${state.queue.length}">${progress}</span>
      ${voiceBtn()}
    </div>
    <div class="play">
      <div class="stage${q.solved ? ' colored' : ''}" style="--answer:${c.hex}">
        <div class="speaker ${state.anim === 'no' ? 'no' : state.anim === 'yes' ? 'yes' : ''}">${blobSVG(q.solved ? c : null)}</div>
        <div class="bubble">
          <div class="say-row">
            <p class="say">${riddle(c)}</p>
            ${voice ? `<button class="listen" data-act="listen" data-key="listen" aria-label="לְהַקְשִׁיב לַחִידָה">${I.sound}</button>` : ''}
          </div>
          ${pics ? `<div class="pics">${picTile(c.clues[0][0], q)}${picTile(c.clues[1][0], q)}</div>` : ''}
        </div>
        ${hintRows.length ? `<div class="hints">${hintRows.join('')}</div>` : ''}
        ${hintBtn}
      </div>
      <h2 class="ask">מִי אֲנִי?</h2>
      <div class="opts">${opts}</div>
      <div class="fb${q.msg && q.msg.kind === 'yes' ? ' yes' : ''}" aria-live="polite">${fb}</div>
      ${q.solved ? `<div class="actions"><button class="act primary" data-act="next" data-key="next">${last ? 'לְסִיּוּם' : 'הַבָּא'}${I.next}</button></div>` : ''}
    </div>`;
}

function endView() {
  const first = state.results.filter(r => r.first).length;
  const found = state.results.map(r => `<div>
      ${r.first ? `<span class="star" aria-label="בַּפַּעַם הָרִאשׁוֹנָה">${I.star}</span>` : ''}
      ${blobSVG(COLOR[r.id])}${COLOR[r.id].name}</div>`).join('');
  return `<div class="bar">
      <button class="icon-btn" data-act="home" data-key="home" aria-label="לַמָּסָךְ הָרִאשׁוֹן">${I.back}</button>
      <span class="dots"></span>${voiceBtn()}
    </div>
    <div class="end">
      <h1>כָּל הַכָּבוֹד!</h1>
      <p class="lead">גִּלִּיתֶם ${state.results.length} צְבָעִים</p>
      <div class="found">${found}</div>
      ${first ? `<span class="legend">${I.star}נִחַשְׁתֶּם בַּפַּעַם הָרִאשׁוֹנָה</span>` : ''}
      <div class="actions">
        <button class="act primary" data-act="again" data-key="again">${I.redo}עוֹד סִבּוּב</button>
        <button class="act" data-act="home" data-key="home2">${I.home}הַבַּיְתָה</button>
      </div>
    </div>`;
}

/* ================= actions ================= */
function startRound() {
  state.queue = shuffle(COLORS.map(c => c.id)).slice(0, ROUND);
  state.qi = 0; state.results = [];
  state.q = makeQuestion(state.queue[0]);
  state.view = 'play';
  render(); window.scrollTo(0, 0);
  if (state.voiceOn) say(riddle(COLOR[state.q.id]));
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const q = state.q;
  switch (b.dataset.act) {
    case 'home':
      if (synth) synth.cancel();
      state.view = 'home'; state.q = null; render(); window.scrollTo(0, 0); break;
    case 'start': state.level = +b.dataset.level; startRound(); break;
    case 'again': startRound(); break;
    case 'voice':
      state.voiceOn = !state.voiceOn;
      try { localStorage.setItem(VOICE_KEY, state.voiceOn ? '1' : '0'); } catch (err) {}
      if (state.voiceOn && state.view === 'play') say(riddle(COLOR[q.id]));
      else if (synth) synth.cancel();
      render(); break;
    case 'listen': say(riddle(COLOR[q.id])); break;
    case 'hint': {
      const kind = nextHint(q);
      if (!kind) return;
      let line;
      if (kind === 'more') { line = moreLine(COLOR[q.id].more[q.hints]); q.hints++; }
      else {
        const pool = q.opts.filter(o => o !== q.id && !q.wrong.has(o));
        q.gone = pool[Math.floor(Math.random() * pool.length)];
        q.hints++;
        line = notMe(COLOR[q.gone]);
        if (q.msg && q.msg.kind === 'no') q.msg = null;
      }
      state.anim = 'hint';
      if (!hintsLeft(q)) state.focus = 'o-' + q.opts.find(o => o !== q.gone && !q.wrong.has(o));
      render();
      if (state.voiceOn) say(line);
      break;
    }
    case 'pick': {
      const id = b.dataset.id, c = COLOR[q.id];
      if (id === q.id) {
        q.solved = true; q.justSolved = true; q.msg = { kind: 'yes' };
        state.results.push({ id: q.id, first: q.wrong.size === 0 });
        state.anim = 'yes'; state.focus = 'next';
        render();
        if (state.voiceOn) say(rightLine(c));
      } else {
        q.wrong.add(id); q.msg = { kind: 'no', id };
        state.anim = 'no';
        if (q.gone === id) q.gone = null;
        render();
        if (state.voiceOn) say(wrongLine(COLOR[id]));
      }
      break;
    }
    case 'next':
      if (state.qi >= state.queue.length - 1) { state.view = 'end'; state.q = null; render(); window.scrollTo(0, 0); break; }
      state.qi++; state.q = makeQuestion(state.queue[state.qi]);
      render(); window.scrollTo(0, 0);
      if (state.voiceOn) say(riddle(COLOR[state.q.id]));
      break;
  }
});

if (synth) {
  findVoice();
  const onVoices = () => { const had = !!voice; findVoice(); if (!had && voice) render(); };
  if (synth.addEventListener) synth.addEventListener('voiceschanged', onVoices);
  else synth.onvoiceschanged = onVoices;
}

render();
})();
</script>
</body>
</html>
