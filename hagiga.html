<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חגיגה של צבעים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;600&display=swap">
<style>
/* Layout: one calm column like מעבדת צבעים. A rainbow that is missing its paint is the progress bar:
   every station gives back one stripe. Same interaction on every screen: one question, three big picture buttons. */
:root {
  --paper: #f3f5f8;
  --surface: #ffffff;
  --ink: #1d2431;
  --ink-soft: #5a6476;
  --line: #d8dee7;
  --track: #e3e8ef;
  --good: #2f8a55;
  --display: "Rubik", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --body: "Noto Sans Hebrew", "Rubik", "Arial Hebrew", Arial, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --radius: 22px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 760px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 16px 32px;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.5; }
p { margin: 0; }
svg { display: block; }
.emo { font-family: var(--emoji); line-height: 1.2; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.bar h2 { font-size: 1.3rem; flex: 1; min-width: 0; }
.icon-btn {
  width: 52px; height: 52px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; flex: none;
}
.icon-btn svg { width: 26px; height: 26px; }
.sound {
  border: 2px solid var(--line); background: var(--surface); border-radius: 999px;
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px 6px 12px; min-height: 52px;
  font-family: var(--display); font-weight: 500; font-size: 1.1rem;
}
.sound svg { width: 24px; height: 24px; }
.sound.off { color: var(--ink-soft); border-style: dashed; }
@media (max-width: 420px) { .sound { padding: 6px 12px; } .sound .txt { display: none; } }
.dots { display: flex; gap: 8px; align-items: center; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--track); }
.dots i.past { background: var(--ink-soft); }
.dots i.now { background: var(--ink); width: 16px; height: 16px; }

/* ---------- rainbow ---------- */
.rainbow { width: 100%; height: auto; }
.rainbow .new { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s ease-out .3s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* ---------- home ---------- */
.home { display: flex; flex-direction: column; align-items: center; gap: 22px; padding-block: 8px 12px; text-align: center; }
.home .rainbow { max-width: 380px; }
.home h1 { font-size: clamp(2rem, 8vw, 2.8rem); line-height: 1.3; }
.home .by { color: var(--ink-soft); font-size: 1.05rem; }
.home .tell { display: flex; align-items: center; gap: 10px; }
.home .story { font-family: var(--display); font-size: 1.35rem; font-weight: 500; max-width: 30ch; }
.start {
  border: 0; border-radius: 999px; background: var(--ink); color: var(--surface);
  font-family: var(--display); font-weight: 700; font-size: 1.5rem;
  padding: 14px 40px; min-height: 68px; min-width: min(300px, 100%);
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
}
.start svg { width: 28px; height: 28px; }
.start:active { transform: scale(.97); }
.plan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
.stop {
  position: relative;
  border: 2px solid var(--line); background: var(--surface); border-radius: 18px;
  padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-family: var(--display); font-size: 1.1rem; font-weight: 500; line-height: 1.4;
}
.stop .badge { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); border: 4px solid var(--c); background: var(--surface); }
.stop .badge svg { width: 26px; height: 26px; }
.stop.done .badge { background: var(--c); color: #ffffff; }
.stop.next { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.stop .tick { position: absolute; top: 8px; inset-inline-start: 8px; width: 26px; height: 26px; color: var(--good); }

.teacher { width: 100%; text-align: start; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 4px 18px; font-size: 1rem; }
.teacher summary { cursor: pointer; font-family: var(--display); font-weight: 500; font-size: 1.1rem; padding-block: 10px; }
.teacher ul { margin: 0 0 12px; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 6px; }
.teacher .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-bottom: 14px; }
.link-btn { color: inherit; text-decoration: none; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; font-size: 1rem; }
.link-btn.warn { border-color: #b4412f; color: #b4412f; }
.note { color: var(--ink-soft); }

/* ---------- question ---------- */
.stage { display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 12px; flex: 1; }
.lead { color: var(--ink-soft); font-size: 1.15rem; text-align: center; }
.q { font-family: var(--display); font-weight: 700; font-size: clamp(1.45rem, 5.4vw, 1.9rem); text-align: center; text-wrap: balance; line-height: 1.5; display: flex; align-items: center; gap: 10px; }
.say-btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.say-btn svg { width: 22px; height: 22px; }

.subject { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.item { display: flex; flex-direction: column; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 34px 12px; font-family: var(--display); font-size: 1.4rem; font-weight: 500; }
.item .emo { font-size: 4.2rem; }

.options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 600px; }
.opt {
  border: 3px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 16px 6px 12px; min-height: 150px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--display); font-size: 1.25rem; font-weight: 500; line-height: 1.35; text-align: center;
  transition: opacity .25s, border-color .2s, transform .15s;
}
.opt:not(:disabled):active { transform: scale(.97); }
.opt .emo { font-size: 3.4rem; }
.opt.right { border-color: var(--good); box-shadow: 0 0 0 3px var(--good); }
.opt.off { opacity: .28; }
.blob {
  display: block; width: 64px; height: 64px; border-radius: 50%; position: relative; flex: none;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.08), inset 0 0 0 2px rgba(29,36,49,.14);
}
.blob::after { content: ""; position: absolute; top: 12px; inset-inline-end: 14px; width: 14px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.45); }
.pic-svg { width: 3.4rem; height: 3.4rem; }

.fb { min-height: 132px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px; text-align: center; }
.fb .msg { font-family: var(--display); font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.fb .msg svg { width: 32px; height: 32px; }
.fb.good .msg { color: var(--good); }
.fb.retry .msg { color: var(--ink-soft); font-weight: 500; }

.act {
  border: 2px solid var(--line); background: var(--surface); border-radius: 999px;
  font-family: var(--display); font-weight: 500; font-size: 1.25rem;
  padding: 10px 28px; min-height: 60px;
  display: inline-flex; align-items: center; gap: 10px;
}
.act svg { width: 26px; height: 26px; }
.act.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.act:disabled { opacity: .3; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

/* ---------- mixing ---------- */
.formula { display: flex; align-items: center; gap: 10px; }
.formula .blob { width: 76px; height: 76px; }
.formula .op { font-family: var(--display); font-size: 2rem; font-weight: 700; color: var(--ink-soft); }
.formula .unknown { width: 76px; height: 76px; border-radius: 50%; border: 3px dashed var(--ink-soft); display: grid; place-items: center; font-family: var(--display); font-size: 2rem; font-weight: 700; color: var(--ink-soft); }
.formula .blob.pop { animation: pop .6s ease-out; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.reveal { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 1.3rem; font-weight: 500; }
.reveal .emo { font-size: 2.6rem; }
.reveal .pic-svg { width: 2.6rem; height: 2.6rem; }

/* ---------- traffic light ---------- */
.light { height: 210px; width: auto; }

/* ---------- sequencing ---------- */
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.slot .num { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-family: var(--display); font-weight: 700; }
.slot .box { width: 100%; aspect-ratio: 16 / 11; max-width: 100%; border-radius: 12px; border: 2px dashed var(--line); background: var(--surface); overflow: hidden; }
.slot .box.full { border: 2px solid var(--good); }
.slot .box svg { width: 100%; height: 100%; }
.slot small { font-size: .85rem; line-height: 1.35; text-align: center; min-height: 2.7em; }
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; max-width: 560px; }
.card {
  border: 3px solid var(--line); background: var(--surface); border-radius: 18px; padding: 8px 8px 10px;
  display: flex; flex-direction: column; gap: 8px; align-items: stretch;
  font-family: var(--display); font-size: 1.15rem; font-weight: 500; line-height: 1.35; text-align: center;
}
.card svg { width: 100%; height: auto; border-radius: 10px; }
.card.gone { visibility: hidden; }

/* ---------- mirror ---------- */
.studio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; width: 100%; align-items: start; }
.mirror { width: 100%; max-width: 280px; height: auto; justify-self: center; }
.mirror [data-part] { cursor: pointer; }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.swatch { border: 0; background: none; padding: 4px 0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .95rem; line-height: 1.4; }
.swatch .blob { width: 48px; height: 48px; }
.swatch .blob::after { top: 9px; inset-inline-end: 10px; width: 11px; height: 7px; }
.swatch.on .blob { box-shadow: 0 0 0 4px var(--paper), 0 0 0 7px var(--ink); }
.hints { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.hints b { font-family: var(--display); font-weight: 500; }
.hints span { display: flex; align-items: center; gap: 8px; }
.hints i { width: 20px; height: 20px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(29,36,49,.14); }
.tip { min-height: 1.6em; color: var(--ink-soft); text-align: center; font-size: 1.1rem; }

/* ---------- station finished ---------- */
.done-view { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 20px; text-align: center; }
.done-view .rainbow { max-width: 420px; }
.done-view h1 { font-size: clamp(1.9rem, 7vw, 2.4rem); }
.done-view .line { font-family: var(--display); font-size: 1.35rem; font-weight: 500; display: flex; align-items: center; gap: 10px; }
.done-view .line i { width: 30px; height: 30px; border-radius: 50%; }
.final-art { display: flex; align-items: flex-end; justify-content: center; gap: 12px; width: 100%; max-width: 520px; }
.final-art .rainbow { flex: 1; min-width: 0; }
.final-art .mirror { width: 110px; flex: none; }

@media (max-width: 560px) {
  .plan { grid-template-columns: repeat(2, 1fr); }
  .studio { grid-template-columns: 1fr; }
  .mirror { max-width: 230px; }
}
@media (max-width: 420px) {
  body { font-size: 17px; }
  .options { gap: 10px; }
  .opt { min-height: 132px; font-size: 1.1rem; }
  .opt .emo { font-size: 2.8rem; }
  .blob { width: 54px; height: 54px; }
  .formula { gap: 6px; }
  .formula .blob, .formula .unknown { width: 60px; height: 60px; }
  .slots { gap: 6px; }
  .slot small { font-size: .75rem; }
  .swatch .blob { width: 42px; height: 42px; }
  .light { height: 180px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .rainbow .new { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div id="app" lang="he" dir="rtl"></div>

<script>
(() => {
/* ================= colors ================= */
const C = {
  red: '#e0453a', orange: '#f08a24', yellow: '#f5c518', green: '#3a9d5d', sky: '#7cc6ee',
  blue: '#2d68c4', purple: '#7d4bb8', pink: '#f5b3c4', brown: '#8a5a33', black: '#262a33',
};
const CN = {
  red: 'אָדֹם', orange: 'כָּתֹם', yellow: 'צָהֹב', green: 'יָרֹק', sky: 'תְּכֵלֶת',
  blue: 'כָּחֹל', purple: 'סָגֹל', pink: 'וָרֹד', brown: 'חוּם', black: 'שָׁחֹר',
};
// station i gives back stripe i, outermost first
const STRIPES = ['red', 'orange', 'yellow', 'green', 'blue', 'purple'];

/* ================= icons ================= */
const sv = (inner, w = 2.2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const I = {
  back: sv('<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>', 2.4),
  next: sv('<path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>', 2.4),
  home: sv('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>'),
  redo: sv('<path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/>', 2.4),
  check: sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 3),
  speak: sv('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/>'),
  play: sv('<circle cx="12" cy="12" r="9.5"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/>', 2),
  mute: sv('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/>'),
  ask: sv('<path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M10 8.6a2 2 0 1 1 2.8 1.8c-.6.3-.8.8-.8 1.4"/><path d="M12 13.6v.1"/>'),
  sort: sv('<path d="M3.5 9h5v10a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19z"/><path d="M9.5 9h5v10a1.5 1.5 0 0 1-1.5 1.5h-2A1.5 1.5 0 0 1 9.5 19z"/><path d="M15.5 9h5v10a1.5 1.5 0 0 1-1.5 1.5h-2a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M12 3v3"/>'),
  mix: sv('<path d="M9 3s-5 6-5 9.5a5 5 0 0 0 10 0C14 9 9 3 9 3z"/><path d="M15 8s-5 5.5-5 8.5a5 5 0 0 0 10 0C20 13.5 15 8 15 8z"/>'),
  light: sv('<rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="7" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="17" r="1.8"/>'),
  mirror: sv('<ellipse cx="12" cy="10" rx="6" ry="8"/><path d="M12 18v4M8 22h8"/><path d="M9.5 8l2.5-2.5"/>'),
  order: sv('<rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="13" width="7" height="7" rx="1.5"/><rect x="14" y="13" width="7" height="7" rx="1.5"/>'),
};
const PLUM = `<svg class="pic-svg" viewBox="0 0 48 48" aria-hidden="true">
  <path d="M24 14c0-4 2-7 5-9" stroke="#6b4a2b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M28 9c5-4 11-2 13 2-5 2-10 2-13-2z" fill="${C.green}"/>
  <circle cx="24" cy="29" r="15" fill="${C.purple}"/>
  <ellipse cx="18" cy="23" rx="4.5" ry="2.8" fill="#ffffff" fill-opacity=".35"/></svg>`;

/* ================= drawings ================= */
const blob = c => `<span class="blob" style="background:${c}"></span>`;

function arcs(cx, cy, r0, w, only) {
  return STRIPES.map((c, i) => {
    const r = r0 - i * (w + 1);
    return `<path d="M${cx - r} ${cy}A${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="${C[c]}" stroke-width="${w}"/>`;
  }).join('');
}

function cloud(x, y) {
  const puffs = [[-18, 2, 13], [0, -6, 17], [18, 2, 13], [0, 6, 13]];
  return `<g>${puffs.map(([dx, dy, r]) => `<circle cx="${x + dx}" cy="${y + dy}" r="${r + 2}" fill="#d8dee7"/>`).join('')}
    ${puffs.map(([dx, dy, r]) => `<circle cx="${x + dx}" cy="${y + dy}" r="${r}" fill="#ffffff"/>`).join('')}</g>`;
}

// the progress rainbow: grey tracks, coloured stripes for finished stations
function rainbowSVG(fresh = -1) {
  const cx = 120, cy = 118;
  const paths = STRIPES.map((c, i) => {
    const r = 104 - i * 13, d = `M${cx - r} ${cy}A${r} ${r} 0 0 1 ${cx + r} ${cy}`;
    const on = state.done.has(i);
    return `<path d="${d}" fill="none" stroke="#e3e8ef" stroke-width="12"/>` +
      (on ? `<path class="${i === fresh ? 'new' : ''}" pathLength="1" d="${d}" fill="none" stroke="${C[c]}" stroke-width="12"/>` : '');
  }).join('');
  return `<svg class="rainbow" viewBox="0 0 240 132" role="img" aria-label="קֶשֶׁת עִם ${state.done.size} מִתּוֹךְ 6 צְבָעִים">${paths}${cloud(34, 116)}${cloud(206, 116)}</svg>`;
}

const LAMPS = ['red', 'yellow', 'green'];
function trafficSVG(filled, target) {
  const ys = [46, 100, 154];
  return `<svg class="light" viewBox="0 0 100 226" role="img" aria-label="רַמְזוֹר">
    <rect x="44" y="180" width="12" height="46" fill="#8a93a3"/>
    <rect x="22" y="12" width="56" height="172" rx="18" fill="#2b313c"/>
    ${ys.map((y, k) => `<circle cx="50" cy="${y}" r="21" fill="${k < filled ? C[LAMPS[k]] : '#4a5260'}"/>
      ${k === target ? `<circle cx="50" cy="${y}" r="27" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="5 5"/>` : ''}`).join('')}
  </svg>`;
}

const drop = (x, y, c) => `<path d="M${x} ${y}c0 0-4 5-4 8a4 4 0 0 0 8 0c0-3-4-8-4-8z" fill="${C[c]}"/>`;
const emoT = (x, y, s, e) => `<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">${e}</text>`;
const sceneFrame = inner => `<svg viewBox="0 0 160 110" aria-hidden="true"><rect width="160" height="110" fill="#dff0fb"/><rect y="90" width="160" height="20" fill="#cfe8c4"/>${inner}</svg>`;

const SCENES = [
  { label: 'לִיאוֹר רוֹאֶה קֶשֶׁת', art: () => sceneFrame(arcs(70, 92, 60, 6) + emoT(136, 104, 28, '👦')) },
  { label: 'לִיאוֹר קוֹרֵא לְאִמָּא', art: () => sceneFrame(`
      <rect x="16" y="46" width="70" height="46" fill="#ffffff" stroke="#97a3b6" stroke-width="2"/>
      <path d="M10 48L51 18 92 48z" fill="${C.red}"/>
      <rect x="34" y="56" width="34" height="26" fill="#eaf5fc" stroke="#97a3b6" stroke-width="2"/>
      ${emoT(51, 78, 20, '👩')}
      <rect x="98" y="30" width="54" height="26" rx="12" fill="#ffffff" stroke="#97a3b6" stroke-width="2"/>
      <path d="M116 55l-2 9 9-9" fill="#ffffff" stroke="#97a3b6" stroke-width="2" stroke-linejoin="round"/>
      <rect x="114" y="52" width="12" height="4" fill="#ffffff"/>
      <text x="125" y="48" font-size="13" text-anchor="middle" font-family="Rubik, Arial, sans-serif" font-weight="700" fill="#1d2431">אִמָּא!</text>

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// avoid two items of the same colour in a row
function spread(items) {
  for (let t = 0; t < 30; t++) {
    if (items.every((it, i) => i === 0 || it.c !== items[i - 1].c)) break;
    items = shuffle(items);
  }
  return items;
}

/* ================= sound =================
   Speech reads every instruction (most first graders cannot read it alone yet).
   The chime is short and quiet; wrong answers make no sound at all. */
const canSpeak = 'speechSynthesis' in window;
let heVoice = null;
function pickVoice() {
  if (!canSpeak) return;
  heVoice = speechSynthesis.getVoices().find(v => /^he|^iw/i.test(v.lang)) || null;
  const n = document.getElementById('voice-note');
  if (n) n.hidden = !!heVoice;
}
if (canSpeak) { pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', pickVoice); }

function say(text) {
  if (!canSpeak || !text || !state.sound) return;
  speechSynthesis.cancel();
  // speech engines read unpointed Hebrew best; keep the maqaf as a pause
  const u = new SpeechSynthesisUtterance(text.replace(/־/g, ' ').replace(/[֑-ׇ]/g, ''));
  u.lang = 'he-IL'; u.rate = 0.85;
  if (heVoice) u.voice = heVoice;
  speechSynthesis.speak(u);
}

let ac = null;
function chime() {
  if (!state.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * 0.14;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.07, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.55);
    });
  } catch (e) {}
}

      <div class="side">
        <div class="palette" role="group" aria-label="צְבָעִים">
          ${PALETTE.map(id => `<button class="swatch ${sub.brush === id ? 'on' : ''}" data-act="brush" data-id="${id}" data-key="b${id}" aria-pressed="${sub.brush === id}">${blob(C[id])}${CN[id]}</button>`).join('')}
        </div>
        <p class="tip" aria-live="polite">${sub.tip || ''}</p>
        <div class="hints"><b>בַּסִּפּוּר:</b>
          ${HINTS.map(([, c, t]) => `<span><i style="background:${C[c]}"></i>${t}</span>`).join('')}
        </div>
      </div>
    </div>
    <button class="act primary" data-act="finish" data-key="finish" ${count < 2 ? 'disabled' : ''}>סִיַּמְתִּי ${I.check}</button>
  </div>`;
}

const ORDER_Q = 'מָה קָרָה קֹדֶם? לַחֲצוּ לְפִי הַסֵּדֶר.';
function orderView() {
  const sub = state.sub;
  return `<div class="stage">
    <h1 class="q">${ORDER_Q}${sayBtn()}</h1>
    <ol class="slots" style="list-style:none;margin:0;padding:0">
      ${SCENES.map((_, n) => {
        const id = sub.placed[n];
        return `<li class="slot"><span class="num">${n + 1}</span>
          <div class="box ${id != null ? 'full' : ''}">${id != null ? SCENES[id].art() : ''}</div>
          <small>${id != null ? SCENES[id].label : ''}</small></li>`;
      }).join('')}
    </ol>
    ${sub.solved
      ? `<div class="fb good" aria-live="polite"><p class="msg">${I.check} נָכוֹן! זֶה הַסֵּדֶר שֶׁל הַסִּפּוּר.</p>
          <button class="act primary" data-act="next" data-key="next">הַלְאָה ${I.next}</button></div>`
      : `<div class="cards">
          ${sub.cards.map(id => `<button class="card ${sub.placed.includes(id) ? 'gone' : ''}" data-act="place" data-i="${id}" data-key="c${id}" ${sub.placed.includes(id) ? 'disabled tabindex="-1"' : ''}>${SCENES[id].art()}<span>${SCENES[id].label}</span></button>`).join('')}
        </div>
        <div class="fb retry" aria-live="polite">${sub.miss ? '<p class="msg">נַסּוּ שׁוּב</p>' : ''}</div>`}
  </div>`;
}

function doneView() {
  const c = STRIPES[state.st];
  const nx = nextStation();
  return `<div class="bar"><span style="flex:1"></span>${soundBtn()}</div>
  <div class="done-view">
    ${rainbowSVG(state.fresh)}
    <h1>כָּל הַכָּבוֹד!</h1>
    <p class="line"><i style="background:${C[c]}"></i>הַקֶּשֶׁת קִבְּלָה פַּס ${CN[c]}.</p>
    <div class="actions">
      ${nx >= 0 ? `<button class="act primary" data-act="go" data-i="${nx}" data-key="nextSt">לַתַּחֲנָה הַבָּאָה ${I.next}</button>` : ''}
      <button class="act" data-act="home" data-key="home">${I.home} הַבַּיְתָה</button>
    </div>
  </div>`;
}

const FINAL_SAY = 'הַקֶּשֶׁת חָזְרָה! כָּל הַכָּבוֹד! הֶחְזַרְתֶּם לַקֶּשֶׁת אֶת כָּל הַצְּבָעִים.';
function finalView() {
  return `<div class="bar"><span style="flex:1"></span>${soundBtn()}</div>
  <div class="done-view">
    <div class="final-art">${rainbowSVG(state.fresh)}${mirrorSVG(state.paint, false)}</div>
    <h1>הַקֶּשֶׁת חָזְרָה!</h1>
    <p class="line">כָּל הַכָּבוֹד! הֶחְזַרְתֶּם לַקֶּשֶׁת אֶת כָּל הַצְּבָעִים.</p>
    <div class="actions">
      <button class="act primary" data-act="again" data-key="again">${I.redo} מְשַׂחֲקִים שׁוּב</button>
      <button class="act" data-act="home" data-key="home">${I.home} הַבַּיְתָה</button>
    </div>
  </div>`;
}

/* ================= flow ================= */
function stepSay() {
  const def = state.steps[state.step];
  if (def.type === 'paint') return `${PAINT_Q} בַּסִּפּוּר: ${HINTS.map(h => h[2]).join(', ')}.`;
  if (def.type === 'order') return ORDER_Q;
  const opts = state.sub.order.map(k => def.options[k].label).join(', ');
  return `${def.lead ? def.lead + ' ' : ''}${def.q} ${opts}.`;
}

function initStep() {
  const def = state.steps[state.step];
  if (def.type === 'order') {
    let cards = shuffle([0, 1, 2, 3]);
    while (cards.every((id, i) => id === i)) cards = shuffle(cards);
    state.sub = { cards, placed: [], miss: false, solved: false };
  } else if (def.type === 'paint') {
    state.sub = { brush: null, tip: '' };
  } else {
    const idx = def.options.map((_, i) => i);
    state.sub = { order: def.keep ? idx : shuffle(idx), wrong: [], solved: false };
  }
}

function go(view) { state.view = view; render(); window.scrollTo(0, 0); }

function enterStation(i) {
  state.st = i; state.step = 0; state.steps = STATIONS[i].steps();
  initStep(); go('station');
  if (state.sound) say(stepSay());
}

function completeStation() {
  state.done.add(state.st); state.fresh = state.st; save();
  chime();
  if (state.done.size === STATIONS.length) { go('final'); if (state.sound) say(FINAL_SAY); }
  else { go('done'); if (state.sound) say(`כָּל הַכָּבוֹד! הַקֶּשֶׁת קִבְּלָה פַּס ${CN[STRIPES[state.st]]}.`); }
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const i = +b.dataset.i;
  switch (b.dataset.act) {
    case 'home': if (canSpeak) speechSynthesis.cancel(); state.confirmReset = false; go('home'); break;
    case 'go': enterStation(i); break;
    case 'final': state.fresh = -1; go('final'); if (state.sound) say(FINAL_SAY); break;
    case 'sound': state.sound = !state.sound; save(); if (!state.sound && canSpeak) speechSynthesis.cancel(); render(); break;
    case 'sayHome': say(HOME_SAY); break;
    case 'sayStep': say(stepSay()); break;
    case 'answer': {
      const def = state.steps[state.step], sub = state.sub;
      if (sub.solved) return;
      if (def.options[i].correct) {
        sub.solved = true; chime();
        if (state.sound) say(`נָכוֹן! ${def.revealSay || ''}`);
      } else {
        sub.wrong.push(i);
        if (state.sound) say('נַסּוּ שׁוּב');
      }
      render(); break;
    }
    case 'place': {
      const sub = state.sub;
      if (i === sub.placed.length) {
        sub.placed.push(i); sub.miss = false;
        if (sub.placed.length === SCENES.length) { sub.solved = true; chime(); if (state.sound) say('נָכוֹן! זֶה הַסֵּדֶר שֶׁל הַסִּפּוּר.'); }
      } else {
        sub.miss = true;
        if (state.sound) say('נַסּוּ שׁוּב. מָה קָרָה קֹדֶם?');
      }
      render(); break;
    }
    case 'brush': state.sub.brush = b.dataset.id; state.sub.tip = ''; render(); break;
    case 'paint': {
      if (!state.sub.brush) { state.sub.tip = 'קֹדֶם בַּחֲרוּ צֶבַע.'; if (state.sound) say(state.sub.tip); render(); break; }
      state.paint[b.dataset.part] = state.sub.brush; save(); render(); break;
    }
    case 'finish': completeStation(); break;
    case 'next':
      if (state.step < state.steps.length - 1) {
        state.step++; initStep(); render(); window.scrollTo(0, 0);
        if (state.sound) say(stepSay());
      } else completeStation();
      break;
    case 'askReset': state.confirmReset = true; render(); break;
    case 'cancelReset': state.confirmReset = false; render(); break;
    case 'reset': case 'again':
      state.done = new Set(); state.paint = {}; state.confirmReset = false; state.fresh = -1; save(); go('home'); break;
  }
});

// the mirror parts are SVG shapes: let Enter and Space paint them from the keyboard too
app.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t instanceof SVGElement && t.dataset.act) {
    e.preventDefault();
    t.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }
});

render();
})();
</script>
</body>
</html>
