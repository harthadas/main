<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חגיגה של צבעים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;600&display=swap">
<style>
/* Layout: the door to both levels. Two big cards side by side (stacked on a phone),
   each with its own rainbow showing how far this device got in that level. */
:root {
  --paper: #f3f5f8;
  --surface: #ffffff;
  --ink: #1d2431;
  --ink-soft: #5a6476;
  --line: #d8dee7;
  --display: "Rubik", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --body: "Noto Sans Hebrew", "Rubik", "Arial Hebrew", Arial, sans-serif;
  --radius: 22px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 760px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 28px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  text-align: center;
}
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.3; }
p { margin: 0; }
svg { display: block; }
h1 { font-size: clamp(2rem, 8vw, 2.8rem); }
.by { color: var(--ink-soft); font-size: 1.05rem; margin-top: 6px; }
.pick { font-family: var(--display); font-size: 1.4rem; font-weight: 500; }

.levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: 100%; }
.lvl {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  background: var(--surface); border: 3px solid var(--line); border-radius: var(--radius);
  padding: 18px 16px 20px; color: inherit; text-decoration: none;
  transition: border-color .15s, transform .15s;
}
.lvl:hover { border-color: var(--ink); }
.lvl:active { transform: scale(.98); }
.lvl .rainbow { width: 100%; max-width: 220px; height: auto; }
.lvl h2 { font-size: 1.9rem; }
.lvl .what { font-family: var(--display); font-size: 1.2rem; font-weight: 500; }
.lvl .who { color: var(--ink-soft); font-size: 1rem; }
.lvl .go {
  margin-top: 6px; border-radius: 999px; background: var(--ink); color: var(--surface);
  font-family: var(--display); font-weight: 700; font-size: 1.3rem;
  padding: 10px 28px; min-height: 56px; display: inline-flex; align-items: center; gap: 10px;
}
.lvl .go svg { width: 24px; height: 24px; }
.lvl .progress { font-size: 1rem; color: var(--ink-soft); min-height: 1.6em; }

@media (max-width: 560px) {
  .levels { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>
<main lang="he" dir="rtl">
  <div>
    <h1>חֲגִיגָה שֶׁל צְבָעִים</h1>
    <p class="by">שְׁתֵּי פְּעִילֻיּוֹת לְפִי הַסֵּפֶר שֶׁל שׁוּלָה מוֹדָן</p>
  </div>
  <p class="pick">בַּחֲרוּ רָמָה:</p>
  <div class="levels">
    <a class="lvl" href="hagiga.html" data-key="hagiga-shel-tzvaim">
      <span class="art"></span>
      <h2>רָמָה 1</h2>
      <p class="what">תְּמוּנוֹת, שָׁלוֹשׁ תְּשׁוּבוֹת, צְבִיעָה</p>
      <p class="who">כיתות א'–ב' וילדי תקשורת</p>
      <p class="progress"></p>
      <span class="go">מַתְחִילִים <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></span>
    </a>
    <a class="lvl" href="hagiga-2.html" data-key="hagiga-shel-tzvaim-2">
      <span class="art"></span>
      <h2>רָמָה 2</h2>
      <p class="what">מִלִּים, אַרְבַּע תְּשׁוּבוֹת, חֲרוּזִים</p>
      <p class="who">למי שכבר קורא לבד</p>
      <p class="progress"></p>
      <span class="go">מַתְחִילִים <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></span>
    </a>
  </div>
</main>

<script>
(() => {
/* each level saves its finished stations under its own key; draw that as the card's rainbow */
const STRIPES = ['#e0453a', '#f08a24', '#f5c518', '#3a9d5d', '#2d68c4', '#7d4bb8'];

function cloud(x, y) {
  const puffs = [[-18, 2, 13], [0, -6, 17], [18, 2, 13], [0, 6, 13]];
  return puffs.map(([dx, dy, r]) => `<circle cx="${x + dx}" cy="${y + dy}" r="${r + 2}" fill="#d8dee7"/>`).join('') +
    puffs.map(([dx, dy, r]) => `<circle cx="${x + dx}" cy="${y + dy}" r="${r}" fill="#ffffff"/>`).join('');
}
function rainbowSVG(done) {
  const cx = 120, cy = 118;
  const paths = STRIPES.map((c, i) => {
    const r = 104 - i * 13, d = `M${cx - r} ${cy}A${r} ${r} 0 0 1 ${cx + r} ${cy}`;
    return `<path d="${d}" fill="none" stroke="#e3e8ef" stroke-width="12"/>` +
      (done.has(i) ? `<path d="${d}" fill="none" stroke="${c}" stroke-width="12"/>` : '');
  }).join('');
  return `<svg class="rainbow" viewBox="0 0 240 132" aria-hidden="true">${paths}${cloud(34, 116)}${cloud(206, 116)}</svg>`;
}

document.querySelectorAll('.lvl').forEach(card => {
  let done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem(card.dataset.key) || '{}').done || []); } catch (e) {}
  card.querySelector('.art').innerHTML = rainbowSVG(done);
  const n = done.size;
  card.querySelector('.progress').textContent = n === 6 ? 'הַקֶּשֶׁת מְלֵאָה!' : n ? `${n} מִתּוֹךְ 6 תַּחֲנוֹת` : '';
  if (n > 0 && n < 6) card.querySelector('.go').firstChild.textContent = 'מַמְשִׁיכִים ';
});
})();
</script>
</body>
</html>
