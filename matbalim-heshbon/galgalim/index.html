<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גלגלים ורגליים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gveret+Levin&family=Secular+One&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff5ec; --bg2:#ffe3cf; --bg3:#ffd2b8;
  --ink:#4a2b20; --ink-soft:#7a5446; --card:#ffffff; --line:#f1d2bf;
  --peach-soft:#ffeee4; --pepper:#c2311f; --pepper-soft:#f7c9c0; --stem:#4f8a3c;
  --good:#2b8a52; --good-soft:#dff3e6; --gold:#f2b705; --bad:#c2311f; --bad-soft:#fde4e1;
  --park:#c2621f; --zoo:#2b8a52; --more:#6a4fb3; --k:var(--park);
  --bar:rgba(255,248,242,.8); --radius:22px; --shadow:0 10px 26px -14px rgba(150,70,30,.45);
  --road:#e9ddd3; --road-line:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a1b16; --bg2:#33211a; --bg3:#3d271e;
    --ink:#fbe9df; --ink-soft:#d9b9a8; --card:#3a2820; --line:#5a3c30;
    --peach-soft:#4a3025; --pepper:#ff7a5c; --pepper-soft:#5e2b22; --stem:#8cc56f;
    --good:#6fd39a; --good-soft:#1f3a2a; --bad:#ff7a5c; --bad-soft:#4a2421;
    --park:#ff9a5c; --zoo:#6fd39a; --more:#b9a2ff;
    --bar:rgba(42,27,22,.8); --shadow:0 10px 26px -14px rgba(0,0,0,.7); --road:#47332a; --road-line:#6b4e40;
  }
}
:root[data-theme="dark"]{
  --bg1:#2a1b16; --bg2:#33211a; --bg3:#3d271e;
  --ink:#fbe9df; --ink-soft:#d9b9a8; --card:#3a2820; --line:#5a3c30;
  --peach-soft:#4a3025; --pepper:#ff7a5c; --pepper-soft:#5e2b22; --stem:#8cc56f;
  --good:#6fd39a; --good-soft:#1f3a2a; --bad:#ff7a5c; --bad-soft:#4a2421;
  --park:#ff9a5c; --zoo:#6fd39a; --more:#b9a2ff;
  --bar:rgba(42,27,22,.8); --shadow:0 10px 26px -14px rgba(0,0,0,.7); --road:#47332a; --road-line:#6b4e40;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0}
body{font-family:"Varela Round",system-ui,sans-serif;font-size:18px;line-height:1.6;color:var(--ink);background:var(--bg1);
  background-image:radial-gradient(1100px 560px at 85% -10%,var(--bg3),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,.btn{font-family:"Secular One",system-ui,sans-serif;font-weight:400;margin:0;line-height:1.3}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.m{font-family:"Gveret Levin",cursive;color:var(--pepper);font-size:1.15em}
.sig{display:inline-block;width:170px;aspect-ratio:900/271;background:var(--ink);-webkit-mask:url(images/sig.png) center/contain no-repeat;mask:url(images/sig.png) center/contain no-repeat;transform:rotate(-3deg)}
.pep{width:20px;height:20px;display:inline-block;vertical-align:middle}
.peps{display:inline-flex;line-height:0;direction:ltr}
.peps .pep{margin-left:-3px}

/* bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:1440px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:"Secular One";font-size:22px;line-height:1.1}
.brand img{height:56px;width:auto;display:block}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto;align-items:center}
.nav a{font-family:"Secular One";text-decoration:none;padding:7px 15px;border-radius:999px;color:var(--ink-soft)}
.nav a.on{background:var(--ink);color:var(--bg1)}
.ghostbtn{border:2px solid var(--line);background:transparent;border-radius:999px;min-height:40px;padding:0 14px;font-size:15px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:4px 22px;border-radius:999px;border:2px solid var(--k);background:var(--k);color:#fff;font-size:18px;text-decoration:none;transition:transform .15s}
:root[data-theme="dark"] .btn:not(.ghost){color:#2a1b16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#2a1b16}}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--card);color:var(--k)}
.btn.small{min-height:40px;padding:2px 14px;font-size:16px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3b2a00!important}

/* home */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;padding:30px 0 10px}
.hero h1{font-size:clamp(38px,5.4vw,64px);line-height:1.1}
.tag{font-family:"Secular One";color:var(--park);font-size:clamp(19px,2.2vw,24px);margin:4px 0 10px}
.hero p{margin:0 0 8px;color:var(--ink-soft);max-width:34em}
.heroart{display:flex;flex-direction:column;align-items:center;gap:6px}
.heroart svg{width:100%;max-width:470px;height:auto}
.sigline{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:15px}
.world{margin:26px 0 6px}
.world h2{font-size:30px;color:var(--k)}
.world p{margin:2px 0 0;color:var(--ink-soft)}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px 22px;padding:16px 0 8px}
.qc{position:relative;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);padding:22px 20px 18px;
  border-radius:46% 54% 42% 58% / 16% 13% 17% 14%;box-shadow:var(--shadow);transform:rotate(var(--r,0deg));transition:transform .2s}
.qc:nth-child(3n+2){border-radius:54% 46% 58% 42% / 13% 16% 13% 17%}
.qc:hover{transform:rotate(0) translateY(-4px)}
.qc::before{content:"";position:absolute;top:-2px;inset-inline:20%;height:7px;border-radius:999px;background:var(--k)}
.qc h3{font-size:21px}
.qc .ic{display:flex;gap:2px;height:40px}
.qc .ic svg{height:40px;width:auto}
.qc .row{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--ink-soft)}
.closing{text-align:center;font-family:"Secular One";font-size:21px;color:var(--ink-soft);margin:26px 0 0}
footer{border-top:1px solid var(--line);margin-top:20px;padding:18px 0 26px;display:flex;justify-content:center;align-items:center;gap:12px;color:var(--ink-soft)}

/* game */
.game{max-width:1440px;margin:0 auto;padding:10px 16px 12px;display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;height:calc(100dvh - 69px);min-height:520px}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding:2px}
.box{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:10px 14px;border-top:7px solid var(--k)}
.qhead{display:flex;align-items:center;gap:8px;justify-content:space-between}
.qhead h2{font-size:21px;color:var(--k)}
.qtext{font-family:"Secular One";font-size:20px;line-height:1.45;margin:6px 0}
.rules{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.rule{display:flex;align-items:center;gap:4px;background:var(--peach-soft);border-radius:12px;padding:2px 8px 2px 4px;font-size:14.5px}
.rule svg{height:28px;width:auto}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:14px;border:2px solid var(--line);font-size:16px;line-height:1.4}
.task .mk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--k);display:grid;place-items:center;font-size:14px;color:var(--k);margin-top:1px}
.task.done{background:var(--good-soft);border-color:var(--good)}
.task.done .mk{background:var(--good);border-color:var(--good);color:#fff}
.task .ans{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.task input{width:90px;min-height:38px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 10px;text-align:center}
.task .think{margin-top:4px;background:var(--peach-soft);border-radius:10px;padding:4px 8px;font-size:15px}
.linkbtn{background:none;border:none;color:var(--k);text-decoration:underline;padding:0;font-size:15px}
.fb{min-height:1.4em;font-size:16px;margin:2px 0 0}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.hintbox{background:var(--peach-soft);border-radius:14px;padding:6px 10px;font-size:15.5px;line-height:1.45}
.saved{display:flex;flex-wrap:wrap;gap:6px}
.saved span{background:var(--good-soft);border:1.5px solid var(--good);border-radius:999px;padding:1px 10px;font-size:14.5px}
.acts{display:flex;flex-wrap:wrap;gap:6px}

.play{display:flex;flex-direction:column;gap:10px;min-height:0}
.lot{flex:1 1 auto;min-height:0;overflow:auto;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:flex;flex-direction:column;gap:8px;
  background-image:repeating-linear-gradient(90deg,transparent 0 120px,var(--line) 120px 122px)}
.lane{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:6px 10px;min-height:76px}
.lane .ctl{display:flex;flex-direction:column;align-items:center;gap:2px}
.lane .nm{font-family:"Secular One";font-size:16px;text-align:center;line-height:1.2}
.lane .per{font-size:13px;color:var(--ink-soft)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:50%;border:2px solid var(--k);background:var(--card);color:var(--k);font-family:"Secular One";font-size:20px;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:34px;text-align:center;font-family:"Secular One";font-size:22px}
.tokens{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;min-height:44px}
.tokens svg{height:44px;width:auto}
.tokens svg.nw{animation:pop .3s ease}
.tokens.many svg{height:32px}
.tokens .more{font-family:"Secular One";color:var(--ink-soft);font-size:16px;padding:0 6px}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
.meter{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:8px 14px}
.meter .big{font-family:"Secular One";font-size:24px}
.meter .big b{font-weight:400;color:var(--k)}
.meter .sp{flex:1}
.meter .hid{color:var(--ink-soft);font-size:16px}

.gbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gbar select{min-height:40px;border-radius:999px;border:2px solid var(--line);background:var(--card);padding:2px 12px;font-family:"Secular One";font-size:15px;max-width:290px}

/* own question */
.own{max-width:860px;margin:20px auto;padding:0 16px}
.own .box{padding:18px 20px}
.own h2{font-size:28px;color:var(--more)}
.own .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.own label{display:flex;flex-direction:column;gap:4px;font-size:16px}
.own select,.own input{min-height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 10px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(40,20,10,.45);display:grid;place-items:center;z-index:50;padding:16px}
.mcard{background:var(--card);border-radius:var(--radius);border-top:7px solid var(--k);max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:18px 22px;position:relative}
.mcard h3{font-size:24px;color:var(--k);margin-bottom:6px}
.mcard h4{font-size:18px;margin:10px 0 2px}
.mcard p,.mcard li{font-size:16.5px;margin:2px 0}
.mcard .x{position:absolute;top:10px;left:12px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:22px}
.sols{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sols span{background:var(--peach-soft);border-radius:999px;padding:2px 12px;font-size:15px}

@media (max-width:980px){
  .game{grid-template-columns:1fr;height:auto}
  .lot{min-height:300px}
  .hero{grid-template-columns:1fr}
  .heroart{order:-1}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .brand img{height:38px}.brand{font-size:19px}
  .bar .in{min-height:56px;gap:6px}
  .lane{grid-template-columns:1fr;gap:4px}
  .lane .ctl{flex-direction:row;justify-content:space-between;width:100%}
  .own .grid{grid-template-columns:1fr}
  .gbar select{max-width:100%}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.qc,.qc:hover{transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="pep" viewBox="0 0 32 32">
    <path d="M21.5 8.5c3.6 1.6 4.9 5.6 3.3 10.2C22.7 24.6 15 29.6 6.2 28.6c-1.2-.1-1.3-1.1-.3-1.6 6.4-3.1 9.6-8.3 10.5-13.6.6-3.6 2.4-5.8 5.1-4.9z" fill="var(--pepper)"/>
    <path d="M19.6 11.4c-.6 3.8-2.4 8.4-6.4 11.8" stroke="#fff" stroke-opacity=".45" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M21 8.8c.2-2.4 1.6-4.4 4.4-5.6" stroke="var(--stem)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M18.6 9.6c1.6-1.8 4.6-2 6.6-.2" stroke="var(--stem)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </symbol>
</defs></svg>

<header class="bar"><div class="in">
  <a class="brand" href="#home" aria-label="גלגלים ורגליים, דף הבית">
    <img src="images/100-bameah.webp" alt="100 במאה: קידום תהליכי מצוינות ואפיקי הצטיינות">
    <span>גלגלים ורגליים</span>
  </a>
  <nav class="nav" aria-label="ניווט">
    <a href="#home" data-r="home">כל השאלות</a>
    <a href="#own" data-r="own">שאלה משלכם</a>
    <button class="ghostbtn" id="teachBtn" type="button">למורה ℹ️</button>
    <button class="ghostbtn" id="theme" type="button" aria-label="החלפת מצב בהיר וכהה">בהיר / כהה</button>
  </nav>
</div></header>

<main id="app"></main>

<div class="modal" id="modal" hidden><div class="mcard" id="mcard" role="dialog" aria-modal="true"></div></div>

<script>
/* ================= types ================= */
const UNIT={w:['גלגלים','גַּלְגַּלִּים','גלגל'],l:['רגליים','רַגְלַיִם','רגל'],a:['זרועות','זְרוֹעוֹת','זרוע']};
const T={
  car:{n:'מכונית',pl:'מכוניות',nk:'מְכוֹנִיּוֹת',per:4,u:'w',c:'#e07a5f'},
  moto:{n:'אופנוע',pl:'אופנועים',nk:'אוֹפַנּוֹעִים',per:2,u:'w',c:'#3d85c6'},
  bus:{n:'אוטובוס',pl:'אוטובוסים',nk:'אוֹטוֹבּוּסִים',per:6,u:'w',c:'#e9a20b'},
  truck:{n:'משאית',pl:'משאיות',nk:'מַשָּׂאִיּוֹת',per:10,u:'w',c:'#5f9e4a'},
  uni:{n:'חד־אופן',pl:'חד־אופן',nk:'חַד־אוֹפַן',per:1,u:'w',c:'#b55fc4'},
  bike:{n:'אופניים',pl:'אופניים',nk:'אוֹפַנַּיִם',per:2,u:'w',c:'#2f9c9c'},
  tri:{n:'תלת־אופן',pl:'תלת־אופן',nk:'תְּלַת־אוֹפַן',per:3,u:'w',c:'#d0577a'},
  hen:{n:'תרנגולת',pl:'תרנגולות',nk:'תַּרְנְגוֹלוֹת',per:2,u:'l',c:'#e8a33d'},
  rabbit:{n:'ארנב',pl:'ארנבים',nk:'אַרְנָבִים',per:4,u:'l',c:'#a88f80'},
  spider:{n:'עכביש',pl:'עכבישים',nk:'עַכָּבִישִׁים',per:8,u:'l',c:'#6b5b7b'},
  beetle:{n:'חיפושית',pl:'חיפושיות',nk:'חִפּוּשִׁיּוֹת',per:6,u:'l',c:'#3f8f5a'},
  duck:{n:'ברווז',pl:'ברווזים',nk:'בַּרְוָזִים',per:2,u:'l',c:'#e3c23a'},
  goat:{n:'עז',pl:'עזים',nk:'עִזִּים',per:4,u:'l',c:'#9b7b5b'},
  snake:{n:'נחש',pl:'נחשים',nk:'נְחָשִׁים',per:0,u:'l',c:'#4f9d3a'},
  table:{n:'שולחן',pl:'שולחנות',nk:'שֻׁלְחָנוֹת',per:4,u:'l',c:'#b07a4a'},
  stool:{n:'שרפרף',pl:'שרפרפים',nk:'שְׁרַפְרַפִּים',per:3,u:'l',c:'#c98a52'},
  star:{n:'כוכב ים',pl:'כוכבי ים',nk:'כּוֹכְבֵי יָם',per:5,u:'a',c:'#ef7f5f'},
  octo:{n:'תמנון',pl:'תמנונים',nk:'תְּמָנוּנִים',per:8,u:'a',c:'#c25b9a'}
};

/* ================= drawings: every wheel / leg / arm is drawn so children can count ================= */
function wheels(n,x0,x1,y,r){let s='';for(let i=0;i<n;i++){const x=n===1?(x0+x1)/2:x0+(x1-x0)*i/(n-1);
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#3a3a3a" stroke="#b9b9b9" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="${r*.42}" fill="#d9d9d9"/>`}return s}
function legs(n,x0,x1,y0,len,col){let s='';for(let i=0;i<n;i++){const x=n===1?(x0+x1)/2:x0+(x1-x0)*i/(n-1);
  s+=`<path d="M${x} ${y0}l${(i%2?1.5:-1.5)} ${len}" stroke="${col}" stroke-width="2.6" stroke-linecap="round"/>`}return s}
function icon(t){
  const c=T[t].c;let b='',vb='0 0 80 56';
  switch(t){
    case 'car': b=`<path d="M8 36v-9q0-4 4-5l10-2 8-9h22l9 9 9 2q3 1 3 5v9z" fill="${c}"/><path d="M33 13h8v8H26zM44 13h7l6 8H44z" fill="#cfe8f5"/>${wheels(4,15,65,40,6)}`;break;
    case 'moto': b=`<path d="M18 34l12-12h14l6-8h6l-4 10 10 10z" fill="${c}"/><path d="M50 14l6-4" stroke="#555" stroke-width="3"/>${wheels(2,16,62,40,8)}`;break;
    case 'bus': b=`<rect x="4" y="8" width="72" height="28" rx="5" fill="${c}"/>${[0,1,2,3,4].map(i=>`<rect x="${9+i*13}" y="13" width="10" height="9" rx="1.5" fill="#cfe8f5"/>`).join('')}${wheels(6,9,71,40,5)}`;break;
    case 'truck': vb='0 0 92 56'; b=`<rect x="2" y="6" width="62" height="30" rx="3" fill="${c}"/><path d="M66 14h12l10 10v12H66z" fill="${c}" opacity=".85"/><path d="M70 17h7l6 7H70z" fill="#cfe8f5"/>${wheels(10,7,85,41,4.2)}`;break;
    case 'uni': b=`<path d="M40 30V12" stroke="${c}" stroke-width="4"/><rect x="31" y="7" width="18" height="6" rx="3" fill="${c}"/>${wheels(1,40,40,40,11)}`;break;
    case 'bike': b=`<path d="M20 38l14-18h16l10 18M34 20l6 18 10-18M32 16h8M50 20l2-6h6" stroke="${c}" stroke-width="3.4" fill="none" stroke-linejoin="round"/>${wheels(2,20,60,38,10)}`;break;

/* ================= solver ================= */
const sumW=(q,c)=>q.types.reduce((s,t)=>s+T[t].per*(c[t]||0),0);
const sumN=(q,c)=>q.types.reduce((s,t)=>s+(c[t]||0),0);
function ok(q,c){
  if(q.given)return q.types.every(t=>(c[t]||0)===q.given[t]);
  if(sumW(q,c)!==q.W)return false;
  if(q.N!=null&&sumN(q,c)!==q.N)return false;
  if(q.min&&q.types.some(t=>(c[t]||0)<q.min))return false;
  if(q.ex&&!q.ex(c))return false;
  return true;
}
function solve(q){
  if(q.given)return[q.given];
  const out=[],ts=q.types,c={};
  const cap=t=>T[t].per?Math.floor(q.W/T[t].per):(q.N!=null?q.N:0);
  (function rec(i,w,n){
    if(out.length>500)return;
    if(i===ts.length){if(ok(q,c))out.push({...c});return}
    const t=ts[i];for(let k=q.min||0;k<=cap(t);k++){
      const w2=w+T[t].per*k,n2=n+k;if(w2>q.W)break;if(q.N!=null&&n2>q.N)break;c[t]=k;rec(i+1,w2,n2)}
    delete c[t];
  })(0,0,0);
  return out;
}
const key=(q,c)=>q.types.map(t=>c[t]||0).join('-');
const describe=(q,c)=>q.types.filter(t=>(c[t]||0)>0||q.types.length<=3).map(t=>`${c[t]||0} ${T[t].pl}`).join(', ');

/* ================= state ================= */
let S=null;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const nkMode=q=>q.p<=2;
const qText=q=>q.nk||q.q;
const unit=(q,i=0)=>UNIT[T[q.types[0]].u][nkMode(q)&&i===0?1:i];
const tname=(q,t)=>nkMode(q)?T[t].nk:T[t].pl;
const taskText=(q,tk)=>{const nk=nkMode(q);
  switch(tk.k){
    case 'one': return nk?'מִצְאוּ דֶּרֶךְ אַחַת שֶׁמַּתְאִימָה':'מצאו דרך אחת שמתאימה';
    case 'all': return nk?`מִצְאוּ ${tk.n} דְּרָכִים שׁוֹנוֹת`:`מצאו ${tk.n} דרכים שונות`;
    case 'min': return nk?'מִצְאוּ אֶת הַדֶּרֶךְ עִם הֲכִי מְעַט':`מצאו את הדרך עם הכי מעט ${q.w==='park'?'כלי רכב':q.w==='zoo'?'בעלי חיים':'פריטים'}`;
    case 'max': return `מצאו את הדרך עם הכי הרבה ${q.w==='park'?'כלי רכב':q.w==='zoo'?'בעלי חיים':'פריטים'}`;
    case 'maxT': return `מצאו את הדרך עם הכי הרבה ${T[tk.t].pl}`;
    default: return tk.t;
  }};

function startQ(q){
  const c={};q.types.forEach(t=>c[t]=q.given?q.given[t]:(q.min||0));
  const sols=solve(q);
  S={q,c,sols,saved:[],done:{},hint:0,fb:'',fbc:'',showMeter:!q.given&&q.p>=3,think:{}};
}

function shortTitle(q){
  const u=UNIT[T[q.types[0]].u][0];
  if(q.given)return `${q.types.map(t=>`${q.given[t]} ${T[t].pl}`).join(' ו-')}: כמה ${u}?`;
  return `${q.W} ${u}${q.N!=null?`, ${q.N} ${q.w==='park'?'כלים':q.w==='zoo'?'ראשים':'כלים'}`:''}`;
}

function game(){
  const s=S,q=s.q,nk=nkMode(q);
  document.documentElement.style.setProperty('--k',`var(${WORLDS[q.w][2]})`);
  const W=sumW(q,s.c),N=sumN(q,s.c);
  const list=Q.map(x=>`<option value="${x.id}" ${x===q?'selected':''}>${'🌶'.repeat(x.p)} ${esc(shortTitle(x))}</option>`).join('');
  const opts=Q.includes(q)?list:`<option selected>השאלה שלכם</option>${list}`;
  const tasks=q.tasks.map((tk,i)=>{
    const d=s.done[i];
    let extra='';
    if(tk.k==='num'&&!d)extra=`<div class="ans"><input id="num${i}" type="number" inputmode="numeric" aria-label="תשובה"><button class="btn small" data-num="${i}">בדיקה</button></div>`;
    if(tk.k==='num'&&d)extra=`<div class="think">${tk.ans}</div>`;
    if(tk.k==='think')extra=s.think[i]?`<div class="think">${esc(tk.a)}</div>`:`<button class="linkbtn" data-think="${i}">חשבנו יחד, להציג תשובה</button>`;
    if(tk.k==='all')extra=`<div class="per">${s.saved.length} מתוך ${tk.n}</div>`;
    return `<li class="task ${d?'done':''}"><span class="mk">${d?'✓':i+1}</span><div>${esc(taskText(q,tk))}${extra}</div></li>`}).join('');
  const lanes=q.types.map(t=>{const n=s.c[t]||0,lock=!!q.given;
    const shown=Math.min(n,48);
    return `<div class="lane"><div class="ctl"><div class="nm">${esc(tname(q,t))}</div><div class="per">${T[t].per} ${UNIT[T[t].u][0]} ל${T[t].n}</div>
      ${lock?`<div class="stepper"><output>${n}</output></div>`:`<div class="stepper"><button data-add="${t}" aria-label="להוסיף ${T[t].n}">+</button><output aria-live="polite">${n}</output><button data-sub="${t}" aria-label="להוריד ${T[t].n}" ${n<=(q.min||0)?'disabled':''}>−</button></div>`}</div>
      <div class="tokens ${n>14?'many':''}">${Array.from({length:shown},(_,i)=>i===shown-1&&s.last===t?icon(t).replace('<svg ','<svg class="nw" '):icon(t)).join('')}${n>shown?`<span class="more">ועוד ${n-shown}</span>`:''}</div></div>`}).join('');
  const target=q.given?'':`<span class="big">${unit(q,0)}: <b>${s.showMeter?W:'?'}</b> / ${q.W}</span>${q.N!=null?`<span class="big">${q.w==='zoo'?'ראשים':'כלים'}: <b>${s.showMeter?N:'?'}</b> / ${q.N}</span>`:`<span class="big">${q.w==='zoo'?'בעלי חיים':'כלים'}: <b>${s.showMeter?N:'?'}</b></span>`}`;
  app.innerHTML=`<div class="game">
    <aside class="side">
      <div class="box">
        <div class="qhead"><h2>${WORLDS[q.w][0]}</h2>${pepIcons(q.p)}</div>
        <p class="qtext">${esc(qText(q))}</p>
        <div class="rules">${q.types.map(t=>`<span class="rule">${icon(t)} ${T[t].per} ${UNIT[T[t].u][0]}</span>`).join('')}</div>
        <div class="acts"><button class="btn ghost small" id="readBtn">🔊 הקראה</button><button class="btn ghost small" id="hintBtn">רמז</button><button class="btn ghost small" id="solBtn">הצגת הפתרון</button></div>
        ${s.hint?`<div class="hintbox">${q.hints.slice(0,s.hint).map(esc).join('<br>')}</div>`:''}
      </div>
      <div class="box"><h3 style="font-size:18px">משימות</h3><ul class="tasks">${tasks}</ul>
        ${s.saved.length?`<h3 style="font-size:16px;margin-top:6px">הדרכים שמצאתם</h3><div class="saved">${s.saved.map(k=>`<span>${esc(describe(q,Object.fromEntries(q.types.map((t,i)=>[t,+k.split('-')[i]]))))}</span>`).join('')}</div>`:''}
      </div>
      <div class="gbar"><select id="qSel" aria-label="בחירת שאלה">${opts}</select></div>
    </aside>
    <section class="play">
      <div class="lot" aria-label="המגרש">${lanes}</div>
      <div class="meter">${target}<span class="sp"></span>
        ${q.given?'':`<button class="btn ghost small" id="meterBtn">${s.showMeter?'הסתרת המונה':'הצגת המונה'}</button><button class="btn ghost small" id="resetBtn">מתחילים מחדש</button><button class="btn" id="checkBtn">בדיקה</button>`}
      </div>
      <p class="fb ${s.fbc}" role="status">${s.fb}</p>
    </section>
  </div>`;
  bind();
}

function bind(){
  const s=S,q=s.q;
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const t=b.dataset.add;s.c[t]=(s.c[t]||0)+1;s.fb='';s.last=t;game();focusBtn('add',t)});
  app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{const t=b.dataset.sub;s.c[t]=Math.max(q.min||0,(s.c[t]||0)-1);s.fb='';s.last=null;game();focusBtn('sub',t)});
  app.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{const i=+b.dataset.num,v=+document.getElementById('num'+i).value;
    if(v===q.tasks[i].ans){s.done[i]=true;s.fb=nkMode(q)?'נָכוֹן! כָּל הַכָּבוֹד.':'נכון! כל הכבוד.';s.fbc='good'}
    else{s.fb=nkMode(q)?'עוֹד לֹא. סִפְרוּ שׁוּב, אוֹ בַּקְּשׁוּ רֶמֶז.':'עוד לא. בדקו שוב, או בקשו רמז.';s.fbc='bad'}game()});
  app.querySelectorAll('[data-think]').forEach(b=>b.onclick=()=>{s.think[+b.dataset.think]=true;s.done[+b.dataset.think]=true;game()});
  on('hintBtn',()=>{s.hint=Math.min(q.hints.length,s.hint+1);if(s.hint===q.hints.length&&!q.hints.length){s.fb='אין רמז לשאלה הזו.'}game()});
  on('solBtn',solution);
  on('readBtn',()=>{try{const u=new SpeechSynthesisUtterance(qText(q));u.lang='he-IL';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}});
  on('meterBtn',()=>{s.showMeter=!s.showMeter;game()});
  on('resetBtn',()=>{q.types.forEach(t=>s.c[t]=q.min||0);s.fb='';game()});
  on('checkBtn',check);
  const sel=document.getElementById('qSel');if(sel)sel.onchange=e=>{location.hash='q-'+e.target.value};
}
function on(id,f){const el=document.getElementById(id);if(el)el.onclick=f}
function focusBtn(k,t){const b=app.querySelector(`[data-${k}="${t}"]`);if(b&&!b.disabled)b.focus()}

function check(){
  const s=S,q=s.q,c=s.c,W=sumW(q,c),N=sumN(q,c),U=UNIT[T[q.types[0]].u][0],nk=nkMode(q);
  if(!ok(q,c)){
    const m=[];
    if(W!==q.W)m.push(nk?`יֵשׁ ${W} ${unit(q,0)}, וְצָרִיךְ ${q.W}.`:`יש ${W} ${U}, וצריך ${q.W}.`);
    if(q.N!=null&&N!==q.N)m.push(`יש ${N} ${q.w==='zoo'?'בעלי חיים':'כלים'}, וצריך ${q.N}.`);
    if(q.min&&q.types.some(t=>(c[t]||0)<q.min))m.push(`צריך לפחות ${q.min} מכל סוג.`);
    if(q.ex&&!q.ex(c)&&!m.length)m.push(q.exMsg);
    if(!m.length&&q.ex&&!q.ex(c))m.push(q.exMsg);
    s.fb=(nk?'עוֹד לֹא. ':'עוד לא. ')+m.join(' ');s.fbc='bad';game();return;
  }
  const k=key(q,c),isNew=!s.saved.includes(k);
  if(isNew)s.saved.push(k);
  const msgs=[nk?'מַתְאִים!':(isNew?'מתאים! הדרך נשמרה.':'מתאים, אבל את הדרך הזו כבר מצאתם.')];
  const Ns=s.sols.map(x=>sumN(q,x));
  q.tasks.forEach((tk,i)=>{
    if(s.done[i])return;
    if(tk.k==='one')s.done[i]=true;
    if(tk.k==='all'&&s.saved.length>=tk.n)s.done[i]=true;
    if(tk.k==='min'){if(N===Math.min(...Ns))s.done[i]=true;else msgs.push('אפשר גם עם פחות?')}
    if(tk.k==='max'){if(N===Math.max(...Ns))s.done[i]=true;else msgs.push('אפשר גם עם יותר?')}
    if(tk.k==='maxT'){const best=Math.max(...s.sols.map(x=>x[tk.t]));if(c[tk.t]===best)s.done[i]=true;else msgs.push(`אפשר עם יותר ${T[tk.t].pl}?`)}
  });
  const allDone=q.tasks.every((tk,i)=>s.done[i]);
  if(allDone)msgs.push(nk?'כָּל הַמְּשִׂימוֹת הֻשְׁלְמוּ!':'כל המשימות הושלמו! נסו שאלה עם עוד פלפל.');
  s.fb=msgs.join(' ');s.fbc='good';game();
}

function solution(){
  const s=S,q=s.q,sols=s.sols;
  const show=sols.slice(0,24);
  modal(`<h3>הפתרון</h3><p>${esc(q.sol||'')}</p>
    ${q.given?'':`<h4>${sols.length===1?'יש פתרון אחד':`יש ${sols.length} פתרונות`}</h4><div class="sols">${show.map(x=>`<span>${esc(describe(q,x))}</span>`).join('')}${sols.length>show.length?`<span>ועוד ${sols.length-show.length}</span>`:''}</div>`}
    <h4>לדיון</h4><p>איך חיפשתם? ניסוי וטעייה, טבלה, או "מה אם כולם…"? איזו דרך הייתה הכי מהירה?</p>`);
}

function teacher(){
  modal(`<h3>למורה – גלגלים ורגליים</h3>
  <h4>מתי</h4><p>פתיחת שיעור בפתרון בעיות, עבודה בזוגות על הלוח החכם, או "אתגר השבוע". כל שאלה לוקחת 5–15 דקות.</p>
  <h4>שלבים</h4><ol>
    <li>קוראים יחד את השאלה (בכיתות א׳–ב׳ יש כפתור הקראה) ומסמנים מה ידוע: כמה גלגלים או רגליים לכל סוג, וכמה יש בסך הכול.</li>
    <li>הילדים מנחשים דרך ראשונה ובונים אותה במגרש בכפתורי + ו-−.</li>
    <li>"בדיקה" אומרת אם הדרך מתאימה, ואם לא, כמה חסר או עודף. כל דרך נכונה נשמרת ברשימה.</li>
    <li>ממשיכים למשימות הבאות: עוד דרכים, הדרך עם הכי מעט, הדרך עם הכי הרבה.</li>
    <li>בסוף משווים אסטרטגיות. "הצגת הפתרון" מראה את כל הפתרונות.</li>
  </ol>
  <h4>המונה</h4><p>בשאלות של פלפל אחד ושניים המונה מוסתר, והילדים סופרים את הגלגלים בתמונה. אפשר להציג או להסתיר אותו בכל שאלה.</p>
  <h4>טיפ: "מה אם כולם…"</h4><p>אם כל 8 הכלים היו אופנועים, היו 16 גלגלים. חסרים 8, וכל החלפה של אופנוע במכונית מוסיפה 2, ולכן מחליפים 4. בקשו מהילדים להסביר למה זה עובד, ואז לנסות את זה על שאלה אחרת.</p>
  <h4>מקום לילדים</h4><p>בלשונית "שאלה משלכם" הילדים כותבים שאלה חדשה לכיתה. אם אין לה פתרון, שואלים: למה אין?</p>`);
}
function modal(html){const m=document.getElementById('modal');document.getElementById('mcard').innerHTML=`<button class="x" id="mx" aria-label="סגירה">×</button>${html}`;m.hidden=false;document.getElementById('mx').onclick=closeModal;document.getElementById('mx').focus()}
function closeModal(){document.getElementById('modal').hidden=true}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('teachBtn').onclick=teacher;

/* ================= own question ================= */
let ownQ=null;
function ownPage(){
  document.documentElement.style.setProperty('--k','var(--more)');
  const opts=sel=>Object.keys(T).map(t=>`<option value="${t}" ${t===sel?'selected':''}>${T[t].pl} (${T[t].per})</option>`).join('');
  app.innerHTML=`<div class="own"><div class="box">
    <h2>שאלה משלכם</h2>
    <p>בוחרים שניים או שלושה סוגים, כמה גלגלים או רגליים ספרתם, ואם רוצים גם כמה יש בסך הכול. הכיתה פותרת.</p>
    <div class="grid">
      <label>סוג ראשון<select id="o1">${opts('car')}</select></label>
      <label>סוג שני<select id="o2">${opts('moto')}</select></label>
      <label>סוג שלישי (לא חובה)<select id="o3"><option value="">בלי</option>${opts('')}</select></label>
      <label>כמה גלגלים או רגליים ספרתם?<input id="oW" type="number" min="1" max="400" value="30"></label>
      <label>כמה יש בסך הכול? (לא חובה)<input id="oN" type="number" min="1" max="200" placeholder="בלי"></label>
      <label>לפחות מכל סוג<select id="oM"><option value="1">לפחות אחד</option><option value="0">אפשר גם אפס</option></select></label>
    </div>
    <button class="btn" id="oGo">יוצאים לדרך</button>
    <p class="fb bad" id="oMsg"></p>
  </div></div>
  <footer><span>נוצר על ידי</span><span class="sig" role="img" aria-label="הדס הרצמן לפשיץ"></span></footer>`;
  document.getElementById('oGo').onclick=()=>{
    const ts=[...new Set(['o1','o2','o3'].map(i=>document.getElementById(i).value).filter(Boolean))];
    const W=+document.getElementById('oW').value,Nv=document.getElementById('oN').value,N=Nv?+Nv:null,min=+document.getElementById('oM').value;
    const msg=document.getElementById('oMsg');
    if(ts.length<2){msg.textContent='בחרו שני סוגים שונים לפחות.';return}
    if(!(W>0&&W<=400)){msg.textContent='בחרו מספר מ-1 עד 400.';return}
    if(ts.some(t=>T[t].per===0)&&N==null){msg.textContent='כשיש נחשים צריך לכתוב גם כמה יש בסך הכול, אחרת אפשר להוסיף נחשים בלי סוף.';return}
    const u=UNIT[T[ts[0]].u][0];
    const q={id:'own',w:'more',p:Math.min(7,ts.length+(N!=null?2:0)+(W>60?1:0)),types:ts,W,N,min,
      q:`ספרתי ${W} ${u}. היו ${ts.map(t=>T[t].pl).join(', ')}${min?', לפחות אחד מכל סוג':''}.${N!=null?` היו ${N} בסך הכול.`:''} מה יכול להיות?`,
      tasks:[{k:'one'}],hints:['התחילו מאחד מכל סוג וחשבו כמה חסר.','נסו את אסטרטגיית "מה אם כולם…".'],sol:''};
    const sols=solve(q);
    if(!sols.length){msg.textContent='לשאלה הזו אין פתרון! זה בעצמו חידה טובה לכיתה: למה אין? נסו מספר אחר.';return}
    if(sols.length>1)q.tasks.push({k:'all',n:Math.min(3,sols.length)});
    if(sols.length>2&&N==null)q.tasks.push({k:'min'});
    q.sol=sols.length===1?'לשאלה שלכם יש פתרון אחד בלבד.':`לשאלה שלכם יש ${sols.length>500?'יותר מ-500':sols.length} פתרונות.`;
    ownQ=q;location.hash='q-own';
  };
}

/* ================= routing ================= */
function route(){
  const h=location.hash.slice(1)||'home';
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===(h==='own'?'own':h==='home'?'home':'')));
  closeModal();
  const m=/^q-(.+)$/.exec(h);
  if(m){const q=m[1]==='own'?ownQ:Q.find(x=>x.id===m[1]);
    if(q){if(!S||S.q!==q)startQ(q);game();window.scrollTo(0,0);return}}
  if(h==='own'){ownPage();window.scrollTo(0,0);return}
  home();window.scrollTo(0,0);
}
document.getElementById('theme').onclick=()=>{const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};
addEventListener('hashchange',route);
route();
