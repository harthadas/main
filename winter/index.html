<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חורף</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&display=swap">
<style>
/* Layout: a winter sky. Home = a row of six clouds, each under its own umbrella (one rainbow color per grade); a grade = its cloud on top and subject drops that fall from it and land on the ground below. */
:root {
  --sky-top: #c9d9ea;
  --sky-bottom: #eef3f8;
  --ink: #1c2b3d;
  --ink-soft: #4f6178;
  --cloud: #ffffff;
  --cloud-shade: #d6e0eb;
  --cloud-ink: #1c2b3d;
  --card: #ffffff;
  --line: #c6d4e3;
  --good: #2b8a52;
  --good-soft: #e1f2e8;
  --rain: rgba(60, 100, 150, .28);
  --gold: #f2b705;
  --gold-ink: #3b2a00;
  --display: "Secular One", "Arial Hebrew", Arial, sans-serif;
  --body: "Varela Round", "Arial Hebrew", Arial, sans-serif;
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #0d1828; --sky-bottom: #1a2a41; --ink: #e8eef6; --ink-soft: #a7b5c8;
    --cloud: #dfe7f1; --cloud-shade: #a9b9cc; --cloud-ink: #1c2b3d; --card: #1f3049; --line: #354a64;
    --good: #5cc485; --good-soft: #1d3b2c; --rain: rgba(180, 205, 235, .22); --gold: #f5c22e; --gold-ink: #3b2a00;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #0d1828; --sky-bottom: #1a2a41; --ink: #e8eef6; --ink-soft: #a7b5c8;
  --cloud: #dfe7f1; --cloud-shade: #a9b9cc; --cloud-ink: #1c2b3d; --card: #1f3049; --line: #354a64;
  --good: #5cc485; --good-soft: #1d3b2c; --rain: rgba(180, 205, 235, .22); --gold: #f5c22e; --gold-ink: #3b2a00;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 70%) fixed, var(--sky-bottom);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
#rain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#app {
  position: relative; z-index: 1;
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 12px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.35; text-wrap: balance; }
svg { display: block; }
.view { animation: fade .35s ease both; }
@keyframes fade { from { opacity: .4; } to { opacity: 1; } }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.back {
  width: 52px; height: 52px; border-radius: 50%; flex: none;
  border: 2px solid var(--line); background: var(--card);
  display: grid; place-items: center;
}
.back svg { width: 26px; height: 26px; }
.bar h2 { font-size: 1.4rem; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; font-family: var(--display); font-size: 1.05rem; }

/* ---------- home ---------- */
.home-head { text-align: center; padding-block: 18px 8px; display: grid; gap: 6px; }
.home-head h1 { font-size: clamp(2.2rem, 8vw, 3.4rem); letter-spacing: .01em; }
.home-head p { margin: 0; color: var(--ink-soft); font-size: 1.1rem; }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px 18px; padding-block: 28px 8px; }
@media (max-width: 620px) { .grades { grid-template-columns: repeat(2, 1fr); gap: 22px 12px; } }
.grade {
  border: 0; background: none; padding: 6px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.grade .umb { width: 62%; margin-bottom: -14%; transform-origin: 50% 95%; transition: transform .3s ease; }
.grade .cld { width: 100%; filter: drop-shadow(0 6px 10px rgba(20, 40, 70, .12)); }
.grade:hover .umb, .grade:focus-visible .umb { transform: rotate(-6deg) translateY(-4px); }
.grade .name { font-family: var(--display); font-size: 1.35rem; }
.grade .count { font-size: .95rem; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
.grade .count svg { width: 14px; height: 17px; }

/* ---------- grade screen ---------- */
.sky-hero { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 4px; }
.sky-hero .umb { width: min(210px, 52vw); margin-bottom: -38px; animation: sway 4s ease-in-out infinite; transform-origin: 50% 95%; }
.sky-hero .cld { width: min(330px, 82vw); }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.hint-line { text-align: center; color: var(--ink-soft); margin: 4px 0 0; }
.drops {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 22px 26px;
  padding-block: 26px 20px; max-width: 940px; margin: 0 auto;
}
.drop {
  position: relative; width: 128px; aspect-ratio: 100 / 124; max-width: 100%;
  border: 0; background: none; padding: 0;
  animation: fall .9s cubic-bezier(.45, 0, .7, 1.2) backwards;
  transition: transform .2s ease;
}
.drop:nth-child(even) { margin-top: 30px; }
.drop:hover { transform: translateY(-6px) scale(1.04); }
.drop:active { transform: scale(.97); }
.drop > svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 8px 10px rgba(20, 40, 70, .18)); }
.drop .in {
  position: absolute; inset: 44% 8% 9%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: #fff; text-align: center;
}
.drop .ic { width: 30px; height: 30px; display: grid; place-items: center; font-family: var(--display); font-size: 1.15rem; line-height: 1; }
.drop .ic svg { width: 30px; height: 30px; }
.drop .lbl { font-family: var(--display); font-size: 1.15rem; line-height: 1.2; }
.drop.challenge .in { color: var(--gold-ink); }
.drop .done {
  position: absolute; top: 18%; inset-inline-end: -4px; width: 32px; height: 32px; border-radius: 50%;
  background: var(--good); display: grid; place-items: center; box-shadow: 0 0 0 3px var(--sky-bottom);
}
.drop .done svg { width: 18px; height: 18px; }
@keyframes fall {
  0% { transform: translateY(-260px) scale(.5); opacity: .2; }
  80% { transform: translateY(6px) scale(1.02, .96); opacity: 1; }
  100% { transform: none; }
}
.ground { height: 14px; max-width: 940px; margin: 0 auto; border-radius: 999px; background: linear-gradient(90deg, transparent, var(--line), transparent); }

/* ---------- activity ---------- */
.panel {
  max-width: 680px; margin: 18px auto 0;
  background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 22px clamp(16px, 4vw, 30px) 26px;
  display: flex; flex-direction: column; gap: 18px;
}
.steps { display: flex; gap: 8px; align-items: center; justify-content: center; }
.steps svg { width: 22px; height: 27px; }
.qnum { text-align: center; color: var(--ink-soft); font-size: .95rem; margin: -8px 0 0; }
.question { font-family: var(--display); font-size: clamp(1.3rem, 4.4vw, 1.65rem); line-height: 1.5; text-align: center; margin: 0; }
.options { display: grid; gap: 12px; }
.opt {
  border: 2px solid var(--line); background: var(--card); border-radius: 16px;
  padding: 14px 18px; font-size: 1.2rem; text-align: center; min-height: 60px;
  transition: opacity .2s, border-color .2s, background .2s;
}
.opt:hover:not(:disabled) { border-color: var(--accent, var(--ink-soft)); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { opacity: .35; animation: shake .35s; }
.opt:disabled { cursor: default; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
[dir="ltr"] { text-align: center; }
.feedback { min-height: 1.6em; text-align: center; font-family: var(--display); font-size: 1.2rem; color: var(--good); margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.btn {
  border: 0; border-radius: 999px; padding: 12px 28px; min-height: 52px;
  background: var(--accent, var(--ink)); color: #fff; font-family: var(--display); font-size: 1.15rem;
}
.btn.ghost { background: none; border: 2px solid var(--line); color: var(--ink); }
.reveal { border-radius: 16px; padding: 14px 18px; background: var(--sky-bottom); border: 2px dashed var(--line); margin: 0; }
.reveal strong { font-family: var(--display); font-weight: 400; display: block; }
.challenge-panel { border-color: var(--gold); }
.star-big { width: 64px; height: 64px; margin: 0 auto; }
.finish { text-align: center; display: grid; gap: 10px; justify-items: center; }
.finish h2 { font-size: 2rem; }
.finish p { margin: 0; color: var(--ink-soft); font-size: 1.15rem; }

footer.hh-credit { position: relative; z-index: 1; text-align: center; font-size: 15px; line-height: 1.5; margin: 24px 16px 16px; opacity: .8; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

/* ================================================================

function renderQuiz(g, key) {
  const s = SUBJECTS[key];
  const items = (CONTENT[g.n] && CONTENT[g.n][key]) || [];
  const dir = s.ltr ? ' dir="ltr" lang="en"' : '';
  let i = 0, firstTry = 0;
  app.innerHTML = `<div class="view">${header(g, key)}<section class="panel" style="--accent:${s.color}"></section></div>`;
  const panel = app.querySelector('.panel');

  if (!items.length) {
    panel.innerHTML = `<p class="question">השאלות לטיפה הזו עוד בדרך.</p>
      <div class="actions"><button class="btn ghost" data-go="g${g.n}">חזרה לענן</button></div>`;
    return;
  }

  function show() {
    const item = items[i];
    const opts = shuffle(item.o.map((t, j) => ({ t, right: j === 0 })));
    let missed = false;
    panel.innerHTML = `
      <div class="steps" aria-hidden="true">${items.map((_, j) => miniDrop(j < i ? s.color : 'none', j <= i ? s.color : 'var(--line)')).join('')}</div>
      <p class="qnum">שאלה ${i + 1} מתוך ${items.length}</p>
      <p class="question"${dir}>${esc(item.q)}</p>
      <div class="options">${opts.map((o, j) => `<button class="opt" data-i="${j}"${dir}>${esc(o.t)}</button>`).join('')}</div>
      <p class="feedback" aria-live="polite"></p>
      <div class="actions" hidden><button class="btn next">${i + 1 < items.length ? 'הלאה' : 'סיום'}</button></div>`;
    panel.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      const o = opts[+b.dataset.i];
      if (!o.right) { b.classList.add('wrong'); b.disabled = true; missed = true; return; }
      if (!missed) firstTry++;
      b.classList.add('right');
      panel.querySelectorAll('.opt').forEach(x => { x.disabled = true; });
      panel.querySelector('.feedback').textContent = missed ? 'נכון! הצלחתם.' : 'נכון מאוד!';
      const act = panel.querySelector('.actions');
      act.hidden = false;
      act.querySelector('.next').focus();
    }));
    panel.querySelector('.next').addEventListener('click', () => {
      i++;
      if (i < items.length) return show();
      done[g.n + '-' + key] = true; save();
      panel.innerHTML = finishHTML(g, key, `סיימתם את טיפת ה${subjectName(key, g.n)}. עניתם נכון בניסיון הראשון על ${firstTry} מתוך ${items.length} שאלות.`);
    });
  }
  show();
}

function renderChallenge(g) {
  const c = CONTENT[g.n] && CONTENT[g.n].challenge;
  app.innerHTML = `<div class="view">${header(g, 'challenge')}<section class="panel challenge-panel" style="--accent:#b07d00"></section></div>`;
  const panel = app.querySelector('.panel');
  if (!c) {
    panel.innerHTML = `<p class="question">האתגר לכיתה הזו עוד בדרך.</p>
      <div class="actions"><button class="btn ghost" data-go="g${g.n}">חזרה לענן</button></div>`;
    return;
  }
  panel.innerHTML = `
    <svg class="star-big" viewBox="0 0 24 24" fill="var(--gold)" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
    <p class="question">${esc(c.q)}</p>
    <p class="reveal" id="hint" hidden><strong>רמז</strong>${esc(c.hint)}</p>
    <p class="reveal" id="answer" hidden><strong>הפתרון</strong>${esc(c.answer)}</p>
    <div class="actions">
      <button class="btn ghost" id="show-hint">רמז</button>
      <button class="btn ghost" id="show-answer">הצגת הפתרון</button>
      <button class="btn" id="solved">פתרתי!</button>
    </div>`;
  panel.querySelector('#show-hint').addEventListener('click', e => { panel.querySelector('#hint').hidden = false; e.currentTarget.hidden = true; });
  panel.querySelector('#show-answer').addEventListener('click', e => { panel.querySelector('#answer').hidden = false; e.currentTarget.hidden = true; });
  panel.querySelector('#solved').addEventListener('click', () => {
    done[g.n + '-challenge'] = true; save();
    panel.innerHTML = finishHTML(g, 'challenge', `פתרתם את האתגר של כיתה ${g.letter}׳.`);
  });
}

/* ================================================================
   Routing: #g3 is a grade, #g3-math is a drop inside it.
   ================================================================ */
function route(token, push) {
  const m = /^g([1-6])(?:-([a-z]+))?$/.exec(token || '');
  const g = m && gradeOf(+m[1]);
  const key = m && m[2];
  if (!g) { renderHome(); token = ''; }
  else if (!key || !g.drops.includes(key)) { renderGrade(g); token = 'g' + g.n; }
  else if (key === 'challenge') renderChallenge(g);
  else renderQuiz(g, key);
  if (push) {
    try { history.pushState(null, '', token ? '#' + token : location.pathname + location.search); } catch (e) {}
  }
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) route(b.dataset.go === 'home' ? '' : b.dataset.go, true);
});
window.addEventListener('popstate', () => route(location.hash.slice(1)));
route(location.hash.slice(1));

/* ================================================================
   Background rain
   ================================================================ */
const cv = document.getElementById('rain');
const ctx = cv.getContext('2d');
const still = window.matchMedia('(prefers-reduced-motion: reduce)');
let streaks = [], W = 0, H = 0, color = '';
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(W * H / 14000);
  streaks = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 10 + Math.random() * 16, v: 4 + Math.random() * 5 }));
  color = getComputedStyle(document.documentElement).getPropertyValue('--rain').trim() || 'rgba(60,100,150,.28)';
  if (still.matches) draw();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const s of streaks) { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.l * .18, s.y + s.l); }
  ctx.stroke();
}
function tick() {
  if (!still.matches && !document.hidden) {
    for (const s of streaks) {
      s.y += s.v; s.x -= s.v * .18;
      if (s.y > H) { s.y = -s.l; s.x = Math.random() * (W + 60); }
    }
    draw();
  }
  requestAnimationFrame(tick);
}
window.addEventListener('resize', resize);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', resize);
new MutationObserver(resize).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
resize();
tick();
})();
</script>
