<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חורף</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&display=swap">
<style>
/* Layout: a winter sky. Home = a row of six clouds, each under its own umbrella (one rainbow color per grade); a grade = its cloud on top and subject drops that fall from it and land on the ground below. */
:root {
  --sky-top: #c9d9ea;
  --sky-bottom: #eef3f8;
  --ink: #1c2b3d;
  --ink-soft: #4f6178;
  --cloud: #ffffff;
  --cloud-shade: #d6e0eb;
  --cloud-ink: #1c2b3d;
  --card: #ffffff;
  --line: #c6d4e3;
  --good: #2b8a52;
  --good-soft: #e1f2e8;
  --rain: rgba(60, 100, 150, .28);
  --gold: #f2b705;
  --gold-ink: #3b2a00;
  --near: #a8641a;
  --display: "Secular One", "Arial Hebrew", Arial, sans-serif;
  --body: "Varela Round", "Arial Hebrew", Arial, sans-serif;
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #0d1828; --sky-bottom: #1a2a41; --ink: #e8eef6; --ink-soft: #a7b5c8;
    --cloud: #dfe7f1; --cloud-shade: #a9b9cc; --cloud-ink: #1c2b3d; --card: #1f3049; --line: #354a64;
    --good: #5cc485; --good-soft: #1d3b2c; --rain: rgba(180, 205, 235, .22); --gold: #f5c22e; --gold-ink: #3b2a00; --near: #e7a85a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #0d1828; --sky-bottom: #1a2a41; --ink: #e8eef6; --ink-soft: #a7b5c8;
  --cloud: #dfe7f1; --cloud-shade: #a9b9cc; --cloud-ink: #1c2b3d; --card: #1f3049; --line: #354a64;
  --good: #5cc485; --good-soft: #1d3b2c; --rain: rgba(180, 205, 235, .22); --gold: #f5c22e; --gold-ink: #3b2a00; --near: #e7a85a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 70%) fixed, var(--sky-bottom);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
#rain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#app {
  position: relative; z-index: 1;
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 12px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.35; text-wrap: balance; }
svg { display: block; }
.view { animation: fade .35s ease both; }
@keyframes fade { from { opacity: .4; } to { opacity: 1; } }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.back {
  width: 52px; height: 52px; border-radius: 50%; flex: none;
  border: 2px solid var(--line); background: var(--card);
  display: grid; place-items: center;
}
.back svg { width: 26px; height: 26px; }
.bar h2 { font-size: 1.4rem; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px; border-radius: 999px; color: #fff; font-family: var(--display); font-size: 1.05rem; }

/* ---------- home ---------- */
.home-head { text-align: center; padding-block: 18px 8px; display: grid; gap: 6px; }
.home-head h1 { font-size: clamp(2.4rem, 9vw, 4.2rem); letter-spacing: .01em; flex: none; margin-top: calc(min(300px, 31vw) * .12); }
.title-row { display: flex; align-items: flex-start; justify-content: center; gap: clamp(6px, 3vw, 36px); }
.hd-cloud { width: min(300px, 31vw); height: auto; flex: none; }
.hd-cloud.flip { transform: scaleX(-1); }
.cld { position: relative; display: block; container-type: inline-size; }
.cld img { display: block; width: 100%; height: auto; user-select: none; }
.cld-letter {
  position: absolute; left: 38%; top: 30%; transform: translate(-50%, -50%);
  font-family: var(--display); font-size: 17cqw; line-height: 1; color: #1f2e45;
  text-shadow: 0 0 10px rgba(255, 255, 255, .85);
}
.home-head p { margin: 0; color: var(--ink-soft); font-size: 1.1rem; }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px 18px; padding-block: 28px 8px; }
@media (max-width: 620px) { .grades { grid-template-columns: repeat(2, 1fr); gap: 22px 12px; } }
.grade {
  border: 0; background: none; padding: 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: transform .25s ease;
}
.grade:hover { transform: translateY(-4px); }
.grade .umb { width: 56%; margin-bottom: -11%; transform-origin: 50% 95%; transition: transform .3s ease; position: relative; z-index: 1; }
.grade .cld { width: 92%; position: relative; z-index: 2; }
.grade:hover .umb, .grade:focus-visible .umb { transform: rotate(-6deg) translateY(-4px); }
.grade .name { font-family: var(--display); font-size: 1.35rem; }
.grade .count { font-size: .95rem; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
.grade .count svg { width: 14px; height: 17px; }
.rainfall line { stroke-dasharray: 9 13; animation: drip 1s linear infinite; }
.rainfall line:nth-child(even) { animation-duration: 1.35s; }
@keyframes drip { to { stroke-dashoffset: -22; } }

/* ---------- grade screen ---------- */
.sky-hero { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 4px; }
.sky-hero .umb { width: min(190px, 46vw); margin-bottom: -34px; animation: sway 4s ease-in-out infinite; transform-origin: 50% 95%; position: relative; z-index: 1; }
.sky-hero .cld { width: min(340px, 80vw); position: relative; z-index: 2; }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.hint-line { text-align: center; color: var(--ink-soft); margin: 4px 0 0; }
.drops {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 20px 20px;
  padding-block: 26px 20px; max-width: 600px; margin: 0 auto;
}
.drop {
  position: relative; width: 116px; aspect-ratio: 100 / 124; max-width: 100%;
  border: 0; background: none; padding: 0;
  animation: fall .9s cubic-bezier(.45, 0, .7, 1.2) backwards;
  transition: transform .2s ease;
}
.drop:nth-child(even) { margin-top: 30px; }
.drop:hover { transform: translateY(-6px) scale(1.04); }
.drop:active { transform: scale(.97); }
.drop > svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 8px 10px rgba(20, 40, 70, .18)); }
.drop .in {
  position: absolute; inset: 44% 8% 9%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: #fff; text-align: center;
}
.drop .ic { width: 30px; height: 30px; display: grid; place-items: center; font-family: var(--display); font-size: 1.15rem; line-height: 1; }
.drop .ic svg { width: 30px; height: 30px; }
.drop .lbl { font-family: var(--display); font-size: 1.05rem; line-height: 1.15; }
.drop .lbl { max-width: 100%; }
.drop.long .ic, .drop.long .ic svg { width: 24px; height: 24px; }
.drop.long .lbl { font-size: .92rem; line-height: 1.1; }
.drop.xlong .lbl { font-size: .8rem; }
.drop.challenge .in { color: var(--gold-ink); }
.drop .done, .level .done {
  position: absolute; top: 18%; inset-inline-end: -4px; width: 32px; height: 32px; border-radius: 50%;
  background: var(--good); display: grid; place-items: center; box-shadow: 0 0 0 3px var(--sky-bottom);
}
.drop .done svg { width: 18px; height: 18px; }
@keyframes fall {
  0% { transform: translateY(-260px) scale(.5); opacity: .2; }
  80% { transform: translateY(6px) scale(1.02, .96); opacity: 1; }
  100% { transform: none; }
}
.ground { height: 14px; max-width: 940px; margin: 0 auto; border-radius: 999px; background: linear-gradient(90deg, transparent, var(--line), transparent); }

/* ---------- activity ---------- */
.panel {
  max-width: 680px; margin: 18px auto 0;
  background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 22px clamp(16px, 4vw, 30px) 26px;
  display: flex; flex-direction: column; gap: 18px;
}
.steps { display: flex; gap: 8px; align-items: center; justify-content: center; }
.steps svg { width: 22px; height: 27px; }
.qnum { text-align: center; color: var(--ink-soft); font-size: .95rem; margin: -8px 0 0; }
.question { font-family: var(--display); font-size: clamp(1.3rem, 4.4vw, 1.65rem); line-height: 1.5; text-align: center; margin: 0; }
.options { display: grid; gap: 12px; }
.opt {
  border: 2px solid var(--line); background: var(--card); border-radius: 16px;
  padding: 14px 18px; font-size: 1.2rem; text-align: center; min-height: 60px;
  transition: opacity .2s, border-color .2s, background .2s;
}
.opt:hover:not(:disabled) { border-color: var(--accent, var(--ink-soft)); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { opacity: .35; animation: shake .35s; }
.opt:disabled { cursor: default; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
[dir="ltr"] { text-align: center; }
.feedback { min-height: 1.6em; text-align: center; font-family: var(--display); font-size: 1.2rem; color: var(--good); margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.btn {
  border: 0; border-radius: 999px; padding: 12px 28px; min-height: 52px;
  background: var(--accent, var(--ink)); color: #fff; font-family: var(--display); font-size: 1.15rem;
}
.btn.ghost { background: none; border: 2px solid var(--line); color: var(--ink); }
.reveal { border-radius: 16px; padding: 14px 18px; background: var(--sky-bottom); border: 2px dashed var(--line); margin: 0; }
.reveal strong { font-family: var(--display); font-weight: 400; display: block; }
.challenge-panel { border-color: var(--gold); }
.star-big { width: 64px; height: 64px; margin: 0 auto; }
.finish { text-align: center; display: grid; gap: 10px; justify-items: center; }
.finish h2 { font-size: 2rem; }
.finish p { margin: 0; color: var(--ink-soft); font-size: 1.15rem; }

/* ---------- math levels ---------- */
.levels-intro { text-align: center; color: var(--ink-soft); margin: 14px 0 0; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 760px; margin: 18px auto 0; }
.level {
  position: relative; border: 0; border-radius: var(--radius); padding: 14px 14px 20px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(0, 0, 0, .1)), var(--lv);
  color: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  box-shadow: 0 10px 22px rgba(14, 28, 52, .2); transition: transform .2s ease;
}
.level:hover { transform: translateY(-4px); }
.level .lv-art { width: 124px; }
.lv-text { display: flex; flex-direction: column; }
.lv-name { font-family: var(--display); font-size: 1.6rem; line-height: 1.3; }
.lv-desc { font-size: .95rem; opacity: .88; }
.level .done { top: 12px; inset-inline-end: 12px; box-shadow: 0 0 0 3px rgba(255, 255, 255, .5); }
@media (max-width: 620px) {
  .levels { grid-template-columns: 1fr; }
  .level { flex-direction: row; text-align: start; padding: 10px 18px; gap: 14px; }
  .level .lv-art { width: 92px; flex: none; }
}

/* ---------- typed answers ---------- */
.answer-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 0; }
.ans {
  width: min(220px, 100%); min-height: 56px; padding: 6px 14px;
  border: 2px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink);
  font: inherit; font-size: 1.5rem; text-align: center;
}
.ans:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ans.wrong { border-color: var(--near); animation: shake .35s; }
.ans.right { border-color: var(--good); background: var(--good-soft); }
.feedback.soft { color: var(--ink-soft); }
.actions:has(> [hidden]:only-child) { display: none; }

/* ---------- connections board ---------- */
.connect-intro { font-size: clamp(1.15rem, 4vw, 1.4rem); }
.board { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 10px; }
.tile {
  min-height: 68px; padding: 8px 6px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--sky-bottom); color: var(--ink);
  font-family: var(--display); font-size: clamp(.95rem, 3.6vw, 1.2rem); line-height: 1.25;
  overflow-wrap: anywhere; transition: background .15s, border-color .15s, transform .15s;
}
.tile:hover { border-color: var(--accent); }
.tile.on { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(.97); }
.tile.shake { animation: shake .35s; }
.band {
  grid-column: 1 / -1; border-radius: 14px; padding: 10px 14px; text-align: center;
  background: var(--c-soft); border: 2px solid var(--c); color: #1c2b3d;
  display: flex; flex-direction: column; gap: 2px;
}
.band strong { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.band span { font-size: 1rem; }
.connect-end:empty { display: none; }
.connect-end { display: flex; flex-direction: column; gap: 18px; }

/* ---------- see, think, wonder ---------- */
.stw-photo { border: 0; padding: 0; background: none; border-radius: 16px; overflow: hidden; cursor: zoom-in; display: block; width: 100%; }
.stw-photo img { display: block; width: 100%; height: auto; max-height: 420px; object-fit: contain; background: var(--sky-bottom); }
.stw-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stw-tab {
  border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 6px;
  font-family: var(--display); font-size: 1.05rem; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.stw-tab .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--ink); font-size: .9rem; }
.stw-tab.on { border-color: var(--accent); background: var(--accent); color: #fff; }
.stw-tab.on .n { background: #fff; color: var(--accent); }
.stw-step { display: flex; flex-direction: column; gap: 12px; }
.stw-step h3 { font-size: 1.5rem; color: var(--accent); }
.stw-ask { margin: 0; font-size: 1.15rem; }
.stw-prompts { margin: 0; padding-inline-start: 1.2em; color: var(--ink-soft); display: grid; gap: 4px; }
.stw-step textarea {
  width: 100%; min-height: 110px; resize: vertical; padding: 12px 14px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--sky-bottom); color: var(--ink); font: inherit;
}
.stw-step textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stw-end:empty { display: none; }
.stw-end { display: flex; flex-direction: column; gap: 18px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.zoom { position: fixed; inset: 0; z-index: 20; background: rgba(8, 14, 26, .9); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.zoom img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
.zoom-close { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); inset-inline-start: 16px; font-size: 1.3rem; }

.stw-photo-bar { display: flex; justify-content: flex-end; margin-top: -8px; }
.change-photo { border: 0; background: none; color: var(--ink-soft); font: inherit; font-size: .95rem; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
.stw-picker { border: 2px dashed var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.stw-picker-title { margin: 0; font-family: var(--display); font-size: 1.1rem; }
.stw-picker-note { margin: 0; color: var(--ink-soft); font-size: .9rem; }
.stw-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.stw-thumb {
  border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 0; overflow: hidden;
  display: flex; flex-direction: column; cursor: pointer; font-size: .9rem; color: var(--ink); text-align: center;
}
.stw-thumb img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.stw-thumb span { padding: 4px 6px; line-height: 1.3; }
.stw-thumb.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.stw-thumb.upload { justify-content: center; align-items: center; min-height: 120px; }
.stw-thumb .plus { font-size: 2rem; line-height: 1; color: var(--accent); }

footer.hh-credit { position: relative; z-index: 1; text-align: center; font-size: 15px; line-height: 1.5; margin: 24px 16px 16px; opacity: .8; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main id="app" dir="rtl" lang="he"></main>
<script>
(() => {
document.documentElement.lang = 'he';
document.documentElement.dir = 'rtl';

/* ================================================================
   תוכן: כאן מוסיפים ומשנים שאלות.
   בכל שאלה התשובה הנכונה היא הראשונה ברשימה (o). האתר מערבב את הסדר בעצמו.
   ================================================================ */
const SUBJECTS = {
  math:      { name: g => g <= 2 ? 'חֶשְׁבּוֹן' : g <= 3 ? 'חשבון' : 'מתמטיקה', color: '#2f6fb0' },
  lang:      { name: g => g <= 2 ? 'שָׂפָה' : 'שפה',       color: '#12817a' },
  sci:       { name: g => g <= 2 ? 'מַדָּעִים' : 'מדעים',     color: '#3b8541' },
  eng:       { name: () => 'אנגלית',    color: '#4a4fb3', ltr: true },
  home:      { name: g => g <= 2 ? 'מוֹלֶדֶת' : 'מולדת',     color: '#1b7896' },
  geo:       { name: () => 'גאוגרפיה',  color: '#1b7896' },
  art:       { name: g => g <= 2 ? 'אָמָּנוּת' : 'אומנות',    color: '#8a4bb0' },
  stw:       { name: g => g <= 2 ? 'רוֹאִים, חוֹשְׁבִים, שׁוֹאֲלִים' : 'רואים, חושבים, שואלים', color: '#b8682a' },
  link:      { name: g => g <= 2 ? 'לוּחַ מָה הַקֶּשֶׁר' : 'לוח מה הקשר', color: '#b04a78' },
  challenge: { name: g => g <= 2 ? 'אֶתְגָּר' : 'אתגר',      color: '#f2b705' },
};

const GRADES = [
  { n: 1, letter: 'א', color: '#e4572e', drops: ['math', 'lang', 'sci', 'home', 'art', 'stw', 'link', 'challenge'] },
  { n: 2, letter: 'ב', color: '#f08a24', drops: ['math', 'lang', 'sci', 'home', 'art', 'stw', 'link', 'challenge'] },
  { n: 3, letter: 'ג', color: '#e8b81a', drops: ['math', 'lang', 'sci', 'eng', 'home', 'stw', 'link', 'challenge'] },
  { n: 4, letter: 'ד', color: '#3a9a6e', drops: ['math', 'lang', 'sci', 'eng', 'home', 'stw', 'link', 'challenge'] },
  { n: 5, letter: 'ה', color: '#3f73c4', drops: ['math', 'lang', 'sci', 'eng', 'geo', 'stw', 'link', 'challenge'] },
  { n: 6, letter: 'ו', color: '#8a62c2', drops: ['math', 'lang', 'sci', 'eng', 'geo', 'stw', 'link', 'challenge'] },
];

const CONTENT = {
  1: {
    lang: [
      { q: 'בְּאֵיזוֹ אוֹת מַתְחִילָה הַמִּלָּה "גֶּשֶׁם"?', o: ['ג', 'ש', 'מ'] },
      { q: 'אֵיזוֹ מִלָּה מִתְחָרֶזֶת עִם "עָנָן"?', o: ['גַּנָּן', 'רוּחַ', 'מִטְרִיָּה'] },
      { q: 'כַּמָּה הֲבָרוֹת יֵשׁ בַּמִּלָּה "מִטְ-רִ-יָּה"?', o: ['3', '2', '4'] },
    ],

function renderQuiz(g, key, level) {
  const s = SUBJECTS[key], lv = level && levelOf(level);
  const items = lv ? ((MATH[g.n] || {})[level] || []) : ((CONTENT[g.n] && CONTENT[g.n][key]) || []);
  const doneKey = lv ? `${g.n}-${key}-${level}` : `${g.n}-${key}`;
  const noun = lv ? tx(g, 'משימה', 'מְשִׂימָה') : tx(g, 'שאלה', 'שְׁאֵלָה');
  const accent = lv ? lv.color : s.color;
  const dir = s.ltr ? ' dir="ltr" lang="en"' : '';
  let i = 0, firstTry = 0;
  app.innerHTML = `<div class="view">${header(g, key, level)}<section class="panel" style="--accent:${accent}"></section></div>`;
  const panel = app.querySelector('.panel');

  if (!items.length) {
    panel.innerHTML = `<p class="question">המשימות כאן עוד בדרך.</p>
      <div class="actions"><button class="btn ghost" data-go="${lv ? `g${g.n}-${key}` : `g${g.n}`}">חזרה</button></div>`;
    return;
  }

  function show() {
    const item = items[i];
    const typed = item.o === undefined;
    const opts = typed ? [] : shuffle(item.o.map((t, j) => ({ t, right: j === 0 })));
    let missed = false, tries = 0, answerText = null;
    const RIGHT = tx(g, 'נכון מאוד!', 'נָכוֹן מְאוֹד!'), RIGHT_AFTER = tx(g, 'נכון! הצלחתם.', 'נָכוֹן! הִצְלַחְתֶּם.');
    panel.innerHTML = `
      <div class="steps" aria-hidden="true">${items.map((_, j) => miniDrop(j < i ? accent : 'none', j <= i ? accent : 'var(--line)')).join('')}</div>
      <p class="qnum">${noun} ${i + 1} ${tx(g, 'מתוך', 'מִתּוֹךְ')} ${items.length}</p>
      <p class="question"${dir}>${esc(item.q)}</p>
      ${typed
        ? `<form class="answer-row" autocomplete="off">
             <input id="ans-${g.n}-${key}-${i}" class="ans" type="text" inputmode="decimal" dir="ltr" placeholder="?" aria-label="התשובה שלכם">
             <button class="btn" type="submit">${tx(g, 'בדיקה', 'בְּדִיקָה')}</button>
           </form>
           <div class="actions"><button class="btn ghost reveal-btn" type="button" hidden>${tx(g, 'הצגת התשובה', 'הַצָּגַת הַתְּשׁוּבָה')}</button></div>`
        : `<div class="options">${opts.map((o, j) => `<button class="opt" data-i="${j}"${dir}>${esc(o.t)}</button>`).join('')}</div>`}
      <p class="feedback" aria-live="polite"></p>
      <div class="actions next-row" hidden><button class="btn next">${i + 1 < items.length ? tx(g, 'הלאה', 'הָלְאָה') : tx(g, 'סיום', 'סִיּוּם')}</button></div>`;
    const fb = panel.querySelector('.feedback');
    const succeed = text => {
      if (!missed) firstTry++;
      fb.textContent = text; fb.classList.toggle('soft', text === answerText);
      const row = panel.querySelector('.next-row');
      row.hidden = false;
      row.querySelector('.next').focus();
    };
    if (typed) {
      const form = panel.querySelector('form'), input = form.querySelector('.ans'), reveal = panel.querySelector('.reveal-btn');
      const lock = () => { input.disabled = true; form.querySelector('button').disabled = true; reveal.hidden = true; input.classList.remove('wrong'); input.classList.add('right'); };
      form.addEventListener('submit', e => {
        e.preventDefault();
        const v = norm(input.value);
        if (!v) return;
        if ([].concat(item.a).some(a => norm(a) === v)) { lock(); succeed(missed ? RIGHT_AFTER : RIGHT); return; }
        missed = true; tries++;
        input.classList.remove('wrong'); void input.offsetWidth; input.classList.add('wrong');
        fb.textContent = tx(g, 'עוד לא. נסו שוב.', 'עוֹד לֹא. נַסּוּ שׁוּב.'); fb.classList.add('soft');

        input.select();

        const a = [].concat(item.a)[0];
        input.value = a; lock();
        answerText = tx(g, 'התשובה היא ', 'הַתְּשׁוּבָה הִיא ') + a + '.';
        succeed(answerText);

    } else {
      panel.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {

        : `${lv ? 'פתרתם' : 'עניתם'} נכון בניסיון הראשון על ${firstTry} מתוך ${items.length} ${lv ? 'משימות' : 'שאלות'}.`;
      if (lv) {

        panel.innerHTML = finishHTML(g, key, `${tx(g, 'סיימתם את רמת', 'סִיַּמְתֶּם אֶת רָמַת')} ${the(g, lvName(g, lv))}. ${score}`,

      } else {

      }
    });
  }

}

const NOTES_KEY = 'winter-stw-notes', PICK_KEY = 'winter-stw-photo', CUSTOM_KEY = 'winter-stw-custom-';

function photoFor(g) {
  const id = photoPick[g.n] || (STW[g.n] ? 'g' + g.n : null);
  if (id === 'custom') {
    const url = loadCustom(g.n);
    if (url) return { id, img: url, alt: tx(g, 'תמונה שהמורה בחרה', 'תְּמוּנָה שֶׁהַמּוֹרָה בָּחֲרָה'), ...GENERIC[young(g) ? 'nik' : 'plain'] };
  }
  const p = id && STW[id.slice(1)];
  return p ? { id, ...p } : null;
}
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = reject;
    r.onload = () => {
      const im = new Image();
      im.onerror = reject;
      im.onload = () => {
        const k = Math.min(1, 1100 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', .82));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function renderConnect(g) {
  const groups = CONNECT[g.n] || [];
  const s = SUBJECTS.link;
  app.innerHTML = `<div class="view">${header(g, 'link')}<section class="panel connect" style="--accent:${s.color}"></section></div>`;
  const panel = app.querySelector('.panel');
  if (!groups.length) {
    panel.innerHTML = `<p class="question">הלוח לכיתה הזו עוד בדרך.</p>
      <div class="actions"><button class="btn ghost" data-go="g${g.n}">חזרה לענן</button></div>`;
    return;
  }
  const size = groups[0].words.length;
  const numWords = ['', '', '', tx(g, 'שלוש', 'שָׁלוֹשׁ'), tx(g, 'ארבע', 'אַרְבַּע')][size];
  let tiles = shuffle(groups.flatMap((gr, gi) => gr.words.map(w => ({ w, gi }))));
  const solved = [], picked = new Set();
  let mistakes = 0, revealed = false;

  panel.innerHTML = `
    <p class="question connect-intro">${tx(g, `מצאו ${numWords} מילים שיש ביניהן קשר`, `מִצְאוּ ${numWords} מִלִּים שֶׁיֵּשׁ בֵּינֵיהֶן קֶשֶׁר`)}</p>
    <div class="board" style="--cols:${size}"></div>
    <p class="feedback" aria-live="polite"></p>
    <div class="actions connect-actions">
      <button class="btn ghost" id="mix">${tx(g, 'ערבוב', 'עִרְבּוּב')}</button>
      <button class="btn ghost" id="clear">${tx(g, 'ביטול הבחירה', 'בִּטּוּל הַבְּחִירָה')}</button>
      <button class="btn" id="check" disabled>${tx(g, 'בדיקה', 'בְּדִיקָה')}</button>
    </div>
    <div class="actions"><button class="btn ghost" id="reveal" hidden>${tx(g, 'הצגת הפתרון', 'הַצָּגַת הַפִּתְרוֹן')}</button></div>
    <div class="connect-end"></div>`;
  const board = panel.querySelector('.board'), fb = panel.querySelector('.feedback');
  const checkBtn = panel.querySelector('#check');

  function draw() {
    board.innerHTML = solved.map(gi => {
      const gr = groups[gi], c = GROUP_COLORS[gi % GROUP_COLORS.length];
      return `<div class="band" style="--c:${c};--c-soft:${tint(c, .72)}"><strong>${esc(gr.name)}</strong><span>${gr.words.map(esc).join(' · ')}</span></div>`;
    }).join('') + tiles.map((t, i) => `<button class="tile${picked.has(i) ? ' on' : ''}" data-i="${i}" aria-pressed="${picked.has(i)}">${esc(t.w)}</button>`).join('');
    checkBtn.disabled = picked.size !== size;
  }
  function finish() {
    done[`${g.n}-link`] = true; save();
    panel.querySelector('.connect-actions').hidden = true;
    panel.querySelector('#reveal').hidden = true;
    const line = revealed
      ? tx(g, 'אלה כל הקבוצות. נסו שוב בפעם אחרת!', 'אֵלֶּה כָּל הַקְּבוּצוֹת. נַסּוּ שׁוּב בְּפַעַם אַחֶרֶת!')
      : tx(g, `מצאתם את כל הקבוצות! טעויות בדרך: ${mistakes}.`, `מְצָאתֶם אֶת כָּל הַקְּבוּצוֹת! טָעֻיּוֹת בַּדֶּרֶךְ: ${mistakes}.`);
    fb.textContent = '';
    panel.querySelector('.connect-end').innerHTML = finishHTML(g, 'link', line);
  }
  board.addEventListener('click', e => {
    const b = e.target.closest('.tile');
    if (!b) return;
    const i = +b.dataset.i;
    if (picked.has(i)) picked.delete(i);
    else if (picked.size < size) picked.add(i);
    fb.textContent = '';
    draw();
  });
  panel.querySelector('#mix').addEventListener('click', () => {
    const chosen = [...picked].map(i => tiles[i]);
    tiles = shuffle(tiles);
    picked.clear(); chosen.forEach(t => picked.add(tiles.indexOf(t)));
    draw();
  });
  panel.querySelector('#clear').addEventListener('click', () => { picked.clear(); fb.textContent = ''; draw(); });
  checkBtn.addEventListener('click', () => {
    const sel = [...picked].map(i => tiles[i]);
    const counts = {};
    sel.forEach(t => { counts[t.gi] = (counts[t.gi] || 0) + 1; });
    const best = Math.max(...Object.values(counts));
    if (best === size) {
      const gi = sel[0].gi;
      solved.push(gi);
      tiles = tiles.filter(t => t.gi !== gi);
      picked.clear();
      fb.textContent = tx(g, 'יפה! מצאתם קבוצה.', 'יָפֶה! מְצָאתֶם קְבוּצָה.');
      draw();
      if (!tiles.length) finish();
      return;
    }
    mistakes++;
    fb.textContent = best === size - 1
      ? tx(g, 'כמעט! מילה אחת לא שייכת.', 'כִּמְעַט! מִלָּה אַחַת לֹא שַׁיֶּכֶת.')
      : tx(g, 'עוד לא. נסו קבוצה אחרת.', 'עוֹד לֹא. נַסּוּ קְבוּצָה אַחֶרֶת.');
    board.querySelectorAll('.tile.on').forEach(t => { t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); });
    if (mistakes >= 3) panel.querySelector('#reveal').hidden = false;
  });
  panel.querySelector('#reveal').addEventListener('click', () => {
    revealed = true;
    groups.forEach((_, gi) => { if (!solved.includes(gi)) solved.push(gi); });
    tiles = []; picked.clear();
    draw(); finish();
  });
  draw();
}

/* ================================================================
   Routing: #g3 is a grade, #g3-lang is a drop, #g3-math-easy is a math level.
   ================================================================ */
function route(token, push) {
  const m = /^g([1-6])(?:-([a-z]+))?(?:-([a-z]+))?$/.exec(token || '');
  const g = m && gradeOf(+m[1]);
  const key = m && m[2], level = m && m[3];
  if (!g) { renderHome(); token = ''; }
  else if (!key || !g.drops.includes(key)) { renderGrade(g); token = 'g' + g.n; }
  else if (key === 'challenge') renderChallenge(g);
  else if (key === 'link') renderConnect(g);
  else if (key === 'stw') renderSTW(g);
  else if (key === 'math') {
    if (levelOf(level)) renderQuiz(g, 'math', level);
    else { renderMathLevels(g); token = `g${g.n}-math`; }
  }
  else renderQuiz(g, key);
  if (push) {
    try { history.pushState(null, '', token ? '#' + token : location.pathname + location.search); } catch (e) {}
  }
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) route(b.dataset.go === 'home' ? '' : b.dataset.go, true);
});
window.addEventListener('popstate', () => route(location.hash.slice(1)));
route(location.hash.slice(1));

/* ================================================================
   Background rain
   ================================================================ */
const cv = document.getElementById('rain');
const ctx = cv.getContext('2d');
const still = window.matchMedia('(prefers-reduced-motion: reduce)');
let streaks = [], W = 0, H = 0, color = '';
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(W * H / 14000);
  streaks = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 10 + Math.random() * 16, v: 4 + Math.random() * 5 }));
  color = getComputedStyle(document.documentElement).getPropertyValue('--rain').trim() || 'rgba(60,100,150,.28)';
  if (still.matches) draw();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const s of streaks) { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.l * .18, s.y + s.l); }
  ctx.stroke();
}
function tick() {
  if (!still.matches && !document.hidden) {
    for (const s of streaks) {
      s.y += s.v; s.x -= s.v * .18;
      if (s.y > H) { s.y = -s.l; s.x = Math.random() * (W + 60); }
    }
    draw();
  }
  requestAnimationFrame(tick);
}
window.addEventListener('resize', resize);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', resize);
new MutationObserver(resize).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
resize();
tick();
})();
</script>
