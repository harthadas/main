<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>צבעים לעזרה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;600&display=swap">
<style>
/* Same calm language as the color lab and the story lab: neutral paper; the hero starts uncolored and the helper colors paint it.
   Wide screens: choices on the right, the picture and the growing story on the left. */
:root {
  --paper: #f3f5f8;
  --surface: #ffffff;
  --ink: #1d2431;
  --ink-soft: #5a6476;
  --line: #d8dee7;
  --glass: #97a3b6;
  --mark: #fff1b0;
  --display: "Rubik", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --body: "Noto Sans Hebrew", "Rubik", "Arial Hebrew", Arial, sans-serif;
  --radius: 22px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 1040px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 16px 32px;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.5; }
svg { display: block; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.icon-btn {
  width: 52px; height: 52px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; flex: none; padding: 0;
}
.icon-btn svg { width: 26px; height: 26px; }
.icon-btn.off { color: var(--glass); }
.bar h2 { font-size: 1.35rem; flex: 1; }
.steps { flex: 1; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.stepdot {
  width: 36px; height: 36px; border-radius: 50%; padding: 0;
  border: 2px solid var(--line); background: var(--surface);
  font-family: var(--display); font-weight: 700; font-size: 1rem; line-height: 1;
  display: grid; place-items: center;
}
.stepdot.done { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.stepdot.cur { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.stepdot:disabled { opacity: .4; }

/* ---------- start ---------- */
.start { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding-block: 24px; text-align: center; }
.start h1 { font-size: clamp(2rem, 7vw, 2.8rem); }
.start p { margin: -18px 0 0; color: var(--ink-soft); font-family: var(--display); font-size: 1.25rem; }
.start .hello { width: min(340px, 100%); }
.start .actions { flex-direction: column; align-items: center; }

/* ---------- work area ---------- */
.work { display: grid; gap: 18px; padding-top: 14px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "ask" "story"; }
.work.final { grid-template-areas: "stage" "story" "more"; }
@media (min-width: 860px) {
  .work { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "ask stage" "ask story"; align-items: start; }
  .work.final { grid-template-areas: "stage story" "more story"; grid-template-rows: auto 1fr; }
}
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); }
.stage { grid-area: stage; overflow: hidden; }
.stage svg { width: 100%; height: auto; }

.ask { grid-area: ask; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.ask h2 { font-size: 1.5rem; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.choices.small { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.card {
  border: 2px solid var(--line); background: var(--surface); border-radius: 18px;
  padding: 10px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-family: var(--display); font-size: 1.15rem; font-weight: 500; line-height: 1.5; text-align: center;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.card:hover { border-color: var(--glass); }
.card:active { transform: scale(.97); }
.card.on, .card.flash { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.card.on { background: #f7f9fc; }
.card svg { width: 100%; height: auto; }
.choices.small .card svg { max-width: 70px; }
.card .thumb { width: 100%; border-radius: 10px; overflow: hidden; }
.card small { display: block; font-family: var(--body); font-size: .85rem; font-weight: 400; color: var(--ink-soft); line-height: 1.4; }

.own {
  width: 100%; font-size: 1.15rem; line-height: 1.6;
  padding: 12px 16px; border: 2px dashed var(--glass); border-radius: 16px; background: var(--paper);
}
.own::placeholder { color: var(--ink-soft); opacity: 1; }
.own.filled { border-style: solid; border-color: var(--ink); background: var(--surface); }
.own:focus-visible { outline-offset: 2px; }

.tools { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }

/* ---------- story ---------- */
.story { grid-area: story; padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.story-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.story-head h2 { font-size: 1.3rem; }
.part h3 { font-size: 1rem; color: var(--ink-soft); font-weight: 500; margin-bottom: 2px; }
.sent { display: flex; align-items: flex-start; gap: 8px; font-size: 1.22rem; line-height: 1.9; }
.sent + .sent { margin-top: 4px; }
.sent .txt { flex: 1; min-width: 0; border-radius: 6px; padding-inline: 2px; transition: background .2s; overflow-wrap: anywhere; }
.sent.reading .txt { background: var(--mark); }
.sent.blank .txt { color: var(--glass); letter-spacing: .12em; }
.sent.fresh .txt { animation: rise .45s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.say {
  flex: none; width: 40px; height: 40px; margin-top: 3px; border-radius: 50%; padding: 0;
  border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center;
}
.say svg { width: 20px; height: 20px; }
.say.del { color: var(--ink-soft); }
.say.del svg { width: 14px; height: 14px; }

/* ---------- final screen ---------- */
.title-in {
  width: 100%; border: 0; border-bottom: 2px dashed var(--glass); background: none;
  font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1.5; padding: 4px 2px;
}
.title-in::placeholder { color: var(--ink); opacity: .45; }
.title-in:focus { border-bottom-style: solid; border-bottom-color: var(--ink); outline: none; }
.label { font-family: var(--display); font-size: 1rem; color: var(--ink-soft); }
.more { grid-area: more; padding: 16px; display: flex; flex-direction: column; gap: 10px; align-self: start; }
.add-row { display: flex; gap: 10px; align-items: stretch; }
.add-row .own { flex: 1; min-width: 0; }

/* ---------- buttons ---------- */
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.act {
  border: 2px solid var(--line); background: var(--surface); border-radius: 999px;
  font-family: var(--display); font-weight: 500; font-size: 1.15rem; line-height: 1.4;
  padding: 10px 22px; min-height: 54px; text-decoration: none; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.act svg { width: 24px; height: 24px; flex: none; }
.act.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.act.big { font-size: 1.4rem; font-weight: 700; min-height: 64px; padding-inline: 34px; min-width: min(300px, 100%); }
.act:disabled { opacity: .3; }
.act:not(:disabled):active { transform: scale(.97); }

@media (max-width: 420px) {
  body { font-size: 17px; }
  .stepdot { width: 29px; height: 29px; font-size: .9rem; border-width: 1.5px; }
  .stepdot.cur { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .steps { gap: 5px; flex-wrap: nowrap; }
  .bar { gap: 8px; }
  .icon-btn { width: 46px; height: 46px; }
  .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .choices.small { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sent { font-size: 1.15rem; }
  .act { padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media print {
  body { background: #fff; }
  .bar, .actions, .say, .more, .tools, .story-head .act { display: none !important; }
  .work.final { display: block; }
  .panel { border: 0; }
  .stage { max-width: 520px; margin: 0 auto 12px; }
  .title-in { border: 0; text-align: center; }
}
</style>
</head>
<body>
<div id="app" lang="he" dir="rtl"></div>

<script>
(() => {
/* ================= content =================
   The hero is a child or an animal who starts out uncolored, like a page in a
   coloring book. Two colors come to help: the first paints the hero's body or
   clothes, the second the scarf or bow, and together they bring the world's
   color back. Grammar follows the hero: masculine for יֶלֶד / חָתוּל,
   feminine for יַלְדָּה / אַרְנֶבֶת. */
const COLORS = [
  { id: 'red',    hex: '#ef3b44', name: 'אָדֹם',  def: 'הָאָדֹם',  gift: 'כֹּחַ וְאֹמֶץ' },
  { id: 'orange', hex: '#fb7a2c', name: 'כָּתֹם', def: 'הַכָּתֹם', gift: 'מֶרֶץ וְשִׂמְחָה' },
  { id: 'yellow', hex: '#fad21e', name: 'צָהֹב',  def: 'הַצָּהֹב',  gift: 'אוֹר' },
  { id: 'green',  hex: '#2f9e55', name: 'יָרֹק',  def: 'הַיָּרֹק',  gift: 'עֵץ גָּבוֹהַּ' },
  { id: 'blue',   hex: '#1f6fd6', name: 'כָּחֹל', def: 'הַכָּחֹל', gift: 'רֹגַע' },
  { id: 'purple', hex: '#8a4cc2', name: 'סָגֹל',  def: 'הַסָּגֹל',  gift: 'קְסָמִים' },
  { id: 'pink',   hex: '#f58cb2', name: 'וָרֹד',  def: 'הַוָּרֹד',  gift: 'חִבּוּק' },
];
const C = Object.fromEntries(COLORS.map(c => [c.id, c]));

const HEROES = [
  { id: 'boy',   g: 'm', noun: 'יֶלֶד',    def: 'הַיֶּלֶד',    to: 'לַיֶּלֶד',    small: 'קָטָן' },
  { id: 'girl',  g: 'f', noun: 'יַלְדָּה',   def: 'הַיַּלְדָּה',   to: 'לַיַּלְדָּה',   small: 'קְטַנָּה' },
  { id: 'cat',   g: 'm', noun: 'חָתוּל',   def: 'הֶחָתוּל',   to: 'לֶחָתוּל',   small: 'קָטָן' },
  { id: 'bunny', g: 'f', noun: 'אַרְנֶבֶת', def: 'הָאַרְנֶבֶת', to: 'לָאַרְנֶבֶת', small: 'קְטַנָּה' },
];
const HR = Object.fromEntries(HEROES.map(h => [h.id, h]));

const PLACES = [
  { id: 'village', at: 'בַּכְּפָר' },
  { id: 'forest',  at: 'בַּיַּעַר' },
  { id: 'sea',     at: 'לְיַד הַיָּם' },
  { id: 'city',    at: 'בָּעִיר' },
];

// The color born when the two helpers work together.
const MIX = {};
[
  ['red', 'orange', 'צֶבַע שְׁקִיעָה', '#f4582f'], ['red', 'yellow', 'כָּתֹם', '#fb8f22'],
  ['red', 'green', 'חוּם', '#7a5236'],             ['red', 'blue', 'סָגֹל', '#7b3fa8'],
  ['red', 'purple', 'צֶבַע דֻּבְדְּבָן', '#b0306e'], ['red', 'pink', 'צֶבַע תּוּת', '#e8475f'],
  ['orange', 'yellow', 'צֶבַע זָהָב', '#f5b22a'],  ['orange', 'green', 'צֶבַע זַיִת', '#8a8a32'],
  ['orange', 'blue', 'צֶבַע עָנָן', '#8f949b'],    ['orange', 'purple', 'צֶבַע שׁוֹקוֹלָד', '#6b3f2a'],
  ['orange', 'pink', 'צֶבַע אֲפַרְסֵק', '#ffb38a'], ['yellow', 'green', 'צֶבַע פִּיסְטוּק', '#a5cf4a'],
  ['yellow', 'blue', 'יָרֹק', '#2fa35a'],          ['yellow', 'purple', 'צֶבַע חוֹל', '#cbb58a'],
  ['yellow', 'pink', 'צֶבַע מֶלוֹן', '#ffad7a'],    ['green', 'blue', 'טוּרְקִיז', '#1ea7a0'],
  ['green', 'purple', 'צֶבַע אֶבֶן', '#6b6e6a'],   ['green', 'pink', 'צֶבַע עֵץ', '#a8825e'],
  ['blue', 'purple', 'צֶבַע לַיְלָה', '#3b2f86'],  ['blue', 'pink', 'לִילָךְ', '#b39ddb'],
  ['purple', 'pink', 'צֶבַע סִגָּלִית', '#c06ad0'],
].forEach(([a, b, name, hex]) => { MIX[[a, b].sort().join('+')] = { name, hex }; });
const mixOf = (a, b) => MIX[[a, b].sort().join('+')];

// What each color does when it arrives. h = the hero, v(m, f) picks by the hero's gender.
const POWER = {
  red:    h => `הוּא נָתַן ${h.to} כֹּחַ וְאֹמֶץ.`,
  orange: h => `הוּא הֵבִיא ${h.to} מֶרֶץ וְשִׂמְחָה.`,
  yellow: () => 'הוּא הֵאִיר אֶת הַכֹּל, כְּמוֹ שֶׁמֶשׁ.',
  green:  () => 'הוּא הִצְמִיחַ עֵץ גָּבוֹהַּ, וּמִמֶּנּוּ אֶפְשָׁר הָיָה לִרְאוֹת רָחוֹק.',
  blue:   () => `הוּא לָחַשׁ: ״${v('נְשֹׁם', 'נִשְׁמִי')} עָמֹק, הַכֹּל יִהְיֶה בְּסֵדֶר.״`,
  purple: () => 'הוּא פִּזֵּר אֲבָקַת קְסָמִים, וְהַכֹּל נִהְיָה קַל יוֹתֵר.',
  pink:   h => `הוּא חִבֵּק אֶת ${h.def} וְאָמַר: ״${v('אַתָּה', 'אַתְּ')} לֹא לְבַד.״`,
};

const PROBLEMS = [
  { id: 'dark', label: 'חֹשֶׁךְ בַּדֶּרֶךְ',
    text: h => `יוֹם אֶחָד, ${h.def} ${v('יָצָא', 'יָצְאָה')} לְטַיֵּל, וּפִתְאוֹם יָרַד חֹשֶׁךְ. ${v('הוּא לֹא מָצָא', 'הִיא לֹא מָצְאָה')} אֶת הַדֶּרֶךְ הַבַּיְתָה.`,
    fixed: () => `בְּעֶזְרַת הַצְּבָעִים, ${v('הוּא מָצָא', 'הִיא מָצְאָה')} אֶת הַדֶּרֶךְ הַבַּיְתָה.` },
  { id: 'grey', label: 'הַכֹּל אָפֹר',
    text: h => `יוֹם אֶחָד, כָּל הַצְּבָעִים נֶעֶלְמוּ, וְהַכֹּל נִהְיָה אָפֹר. ${h.def} ${v('הִרְגִּישׁ עָצוּב', 'הִרְגִּישָׁה עֲצוּבָה')}.`,
    fixed: h => `בְּעֶזְרַת הַצְּבָעִים, הָעוֹלָם חָזַר לִהְיוֹת צִבְעוֹנִי, וְ${h.def} ${v('חִיֵּךְ', 'חִיְּכָה')}.` },
  { id: 'new', label: 'מָקוֹם חָדָשׁ',
    text: h => `יוֹם אֶחָד, ${h.def} ${v('הָיָה צָרִיךְ', 'הָיְתָה צְרִיכָה')} לָלֶכֶת לְמָקוֹם חָדָשׁ, ${v('וְהוּא פָּחַד', 'וְהִיא פָּחֲדָה')} מְאוֹד.`,
    fixed: () => `בְּעֶזְרַת הַצְּבָעִים, ${v('הוּא נִכְנַס', 'הִיא נִכְנְסָה')} בְּאֹמֶץ, ${v('וּמָצָא', 'וּמָצְאָה')} שָׁם חֲבֵרִים חֲדָשִׁים.` },
  { id: 'flowers', label: 'הַפְּרָחִים נָבְלוּ',
    text: h => `יוֹם אֶחָד, הַפְּרָחִים שֶׁל ${h.def} נָבְלוּ, ${v('וְהוּא לֹא יָדַע', 'וְהִיא לֹא יָדְעָה')} מָה לַעֲשׂוֹת.`,
    fixed: () => 'בְּעֶזְרַת הַצְּבָעִים, הַפְּרָחִים פָּרְחוּ מֵחָדָשׁ.' },
];

const THANKS = [
  { id: 'draw', label: 'צִיּוּר תּוֹדָה',
    text: h => `${h.def} ${v('צִיֵּר', 'צִיְּרָה')} לַצְּבָעִים צִיּוּר גָּדוֹל, כְּדֵי לוֹמַר תּוֹדָה.` },
  { id: 'hug', label: 'חִבּוּק וְתוֹדָה',
    text: h => `${h.def} ${v('חִבֵּק', 'חִבְּקָה')} אֶת הַצְּבָעִים ${v('וְאָמַר', 'וְאָמְרָה')}: ״תּוֹדָה רַבָּה!״` },
  { id: 'song', label: 'שִׁיר תּוֹדָה',
    text: h => `${h.def} ${v('שָׁר', 'שָׁרָה')} לַצְּבָעִים שִׁיר תּוֹדָה.` },
  { id: 'back', label: 'לַעֲזֹר בַּחֲזָרָה',
    text: h => `${h.def} ${v('אָמַר', 'אָמְרָה')}: ״גַּם אֲנִי אֶעֱזֹר לָכֶם, כְּשֶׁתִּצְטָרְכוּ.״` },
];

const ENDINGS = [
  { id: 'friends', label: 'חֲבֵרִים טוֹבִים',
    text: h => `מֵאָז, ${h.def} וְהַצְּבָעִים הֵם חֲבֵרִים טוֹבִים.` },
  { id: 'paint', label: 'מְצַיְּרִים כָּל יוֹם',
    text: h => `מֵאָז, ${h.def} ${v('מְצַיֵּר', 'מְצַיֶּרֶת')} כָּל יוֹם בְּכָל הַצְּבָעִים.` },
  { id: 'others', label: 'עוֹזְרִים לַאֲחֵרִים',

/* ================= the story ================= */
function story() {
  const parts = [[], [], [], []];
  if (!st.hero) return parts;
  const h = H(), place = pick(PLACES, st.place);
  parts[0].push({ id: 'open', text: `פַּעַם${place ? `, ${place.at},` : ''} ${v('גָּר', 'גָּרָה')} ${h.noun} ${h.small}.` });
  const line = (key, list, part) => {
    const val = st[key];
    if (val === 'own') { const t = st.own[key].trim(); if (t) parts[part].push({ id: key, text: t, own: true }); }
    else if (val) parts[part].push({ id: key, text: pick(list, val).text(h) });
  };
  line('problem', PROBLEMS, 1);
  if (st.help1) parts[2].push({ id: 'help1', text: `פִּתְאוֹם הִגִּיעַ הַצֶּבַע ${C[st.help1].def}. ${POWER[st.help1](h)}` });
  if (st.help2) {
    parts[2].push({ id: 'help2', text: `וְאָז הִגִּיעַ גַּם הַצֶּבַע ${C[st.help2].def}. ${POWER[st.help2](h)}` });
    const p = pick(PROBLEMS, st.problem);
    parts[2].push({ id: 'together', text: `שְׁנֵי הַצְּבָעִים עָבְדוּ יַחַד, הִתְעַרְבְּבוּ, וְנוֹלַד צֶבַע חָדָשׁ: ${mixOf(st.help1, st.help2).name}! `
      + (p ? p.fixed(h) : 'בְּעֶזְרַת הַצְּבָעִים, הַכֹּל הִסְתַּדֵּר.') });
  }
  line('thanks', THANKS, 3);
  line('ending', ENDINGS, 3);
  st.extra.forEach((t, i) => parts[3].push({ id: 'x' + i, text: t, extra: i }));
  return parts;
}

// A paint-drop helper with a face.
function drop(hex, mood, cx, bottom, size) {

    <ellipse cx="28" cy="46" rx="5" ry="9" fill="#fff" opacity=".45" transform="rotate(28 28 46)"/>${eyes}${mouth}</g>`;
}
function ghost(cx, bottom, size) {

// The hero, drawn in a 100 x 100 box. main = body or clothes, acc = scarf or bow.
// mood: happy | sad | scared | sleep
function face(cx, ey, mood) {
  const s = `fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round"`;
  let eyes = mood === 'sleep'
    ? `<path d="M${cx - 10} ${ey} q4 4 8 0 M${cx + 2} ${ey} q4 4 8 0" ${s}/>`
    : `<circle cx="${cx - 7}" cy="${ey}" r="${mood === 'scared' ? 3.6 : 2.9}" fill="${INK}"/><circle cx="${cx + 7}" cy="${ey}" r="${mood === 'scared' ? 3.6 : 2.9}" fill="${INK}"/>`;
  if (mood === 'sad' || mood === 'scared') eyes += `<path d="M${cx - 12} ${ey - 7} l6 -2 M${cx + 12} ${ey - 7} l-6 -2" ${s}/>`;
  const mouth = mood === 'sad' ? `<path d="M${cx - 6} ${ey + 13} q6 -6 12 0" ${s}/>`
    : mood === 'scared' ? `<ellipse cx="${cx}" cy="${ey + 11}" rx="3.5" ry="4.5" fill="${INK}"/>`
    : `<path d="M${cx - 7} ${ey + 8} q7 7 14 0" ${s}/>`;
  const cheeks = mood === 'happy' || mood === 'sleep'
    ? `<circle cx="${cx - 12}" cy="${ey + 7}" r="3.5" fill="#ff7a96" opacity=".45"/><circle cx="${cx + 12}" cy="${ey + 7}" r="3.5" fill="#ff7a96" opacity=".45"/>` : '';
  return eyes + mouth + cheeks;
}
function person(kind, main, acc, mood, cx, bottom, size) {

    g += `<path d="M38 60 Q27 66 27 76" fill="none" ${o} stroke-linecap="round"/><path d="M62 60 Q73 66 73 76" fill="none" ${o} stroke-linecap="round"/>`;

function scene(place, night) {

const TROUBLE = ['dark', 'grey', 'new', 'flowers'];
const helpCount = () => (st.help1 ? 1 : 0) + (st.help2 ? 1 : 0);
function heroMood() {
  if (st.ending === 'sleep') return 'sleep';
  if (TROUBLE.includes(st.problem) && helpCount() === 0) return st.problem === 'new' || st.problem === 'dark' ? 'scared' : 'sad';
  return 'happy';
}
const heroMain = () => st.help1 ? C[st.help1].hex : PLAIN;
const heroAcc = () => st.help2 ? C[st.help2].hex : PLAIN;

function stageSVG() {
  const n = helpCount(), trouble = TROUBLE.includes(st.problem) && n < 2;
  // the world loses its color while the trouble lasts, and gets it back with each helper
  const sat = st.problem === 'grey' && trouble ? (n ? 0.45 : 0.04) : 1;
  const night = st.problem === 'dark' && trouble ? (n ? 0.3 : 0.62) : 0;
  let back = '', front = '';
  if (st.problem === 'flowers') back += [[22, '#ef3b44'], [46, '#fad21e'], [226, '#8a4cc2']].map(([x, c]) => flower(x, 190, c, trouble)).join('');
  if (st.problem === 'new') back += `<rect x="186" y="96" width="62" height="104" rx="6" fill="#c9b6ff" stroke="${INK}" stroke-width="2.5"/><rect x="196" y="108" width="42" height="92" rx="4" fill="#9a6b4a" stroke="${INK}" stroke-width="2"/><circle cx="230" cy="156" r="3.5" fill="#ffd84d"/>`;
  if (st.ending === 'sleep') back += moon(60, 50, 22) + sparkle(110, 40, 6, '#ffe27a') + sparkle(150, 70, 4, '#ffe27a');
  if (st.ending === 'paint') back += `<path d="M226 206 L238 130 M262 206 L250 130 M244 206 V140" stroke="#9a6b4a" stroke-width="4" stroke-linecap="round"/><rect x="220" y="120" width="48" height="40" rx="3" fill="#fff" stroke="${INK}" stroke-width="2.5"/>
    <path d="M226 150 a18 18 0 0 1 36 0" fill="none" stroke="#ef3b44" stroke-width="4"/><path d="M231 150 a13 13 0 0 1 26 0" fill="none" stroke="#fad21e" stroke-width="4"/><path d="M236 150 a8 8 0 0 1 16 0" fill="none" stroke="#1f6fd6" stroke-width="4"/>`;
  const hero = st.hero ? person(st.hero, heroMain(), heroAcc(), heroMood(), 130, 216, 132) : heroGhost(130, 216, 132);
  const wantHelp = st.step >= 3 || st.help1;
  const h1 = st.help1 ? drop(C[st.help1].hex, 'happy', 292, 206, 78) : wantHelp ? ghost(292, 206, 78) : '';
  const h2 = st.help2 ? drop(C[st.help2].hex, 'happy', 362, 206, 72) : (st.step >= 4 || st.help1) && wantHelp ? ghost(362, 206, 72) : '';
  if (st.help1 && st.help2) front += drop(mixOf(st.help1, st.help2).hex, 'happy', 328, 226, 44) + sparkle(318, 112, 7) + sparkle(360, 100, 5);
  if (st.ending === 'friends') front += heart(214, 70, 15);
  if (st.thanks === 'song') front += note(70, 60, 1.2) + note(196, 46, 1);
  if (st.thanks === 'hug' && !st.ending) front += heart(200, 76, 11, '#ff6f91');
  if (st.ending === 'others') front += heart(196, 60, 10, '#ff6f91') + sparkle(176, 92, 6);
  return `<svg viewBox="0 0 400 230" role="img" aria-label="${esc(titleText() || 'הַגִּבּוֹר')}">
    <defs><filter id="fade"><feColorMatrix type="saturate" values="${sat}"/></filter></defs>
    <g ${sat < 1 ? 'filter="url(#fade)"' : ''}>${scene(st.place, night)}${back}</g>
    ${night ? `<rect width="400" height="230" fill="#141a3a" opacity="${night}"/>${moon(200, 44, 18)}` : ''}
    ${hero}${h1}${h2}${front}</svg>`;
}

/* ================= sounds ================= */
let actx = null;
function tone(freq, at, dur, type = 'triangle', vol = 0.1) {
  const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  tap:   () => tone(700, 0, 0.07, 'sine', 0.06),
  pick:  () => { tone(523, 0, 0.13); tone(784, 0.09, 0.2); },
  back:  () => { tone(523, 0, 0.1, 'sine', 0.07); tone(392, 0.08, 0.14, 'sine', 0.07); },
  magic: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.06, 0.15, 'triangle', 0.07)),
  done:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, i === 3 ? 0.6 : 0.2, 'triangle', 0.1)),
};
function sfx(name) {
  if (!soundOn) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    SFX[name]();
  } catch (e) {}
}

/* ================= reading aloud ================= */
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let reading = 0;   // token of the current reading, 0 when silent
function stopReading() {
  reading = 0;
  if (canSpeak) speechSynthesis.cancel();
  app.querySelectorAll('.sent.reading').forEach(el => el.classList.remove('reading'));
  app.querySelectorAll('[data-act="readAll"]').forEach(b => { b.innerHTML = `${I.speak}${readAllLabel}`; });
}
function read(items) {   // items: [{ id, text }]
  if (!canSpeak) return;
  stopReading();
  const token = reading = Date.now();
  const voice = speechSynthesis.getVoices().find(v => /^(he|iw)/i.test(v.lang));
  let i = 0;
  const next = () => {
    if (reading !== token) return;
    app.querySelectorAll('.sent.reading').forEach(el => el.classList.remove('reading'));
    if (i >= items.length) { stopReading(); return; }
    const it = items[i++];
    const el = app.querySelector(`.sent[data-sid="${it.id}"]`);
    if (el) el.classList.add('reading');
    const u = new SpeechSynthesisUtterance(it.text.replace(/[״"]/g, ''));
    u.lang = 'he-IL'; if (voice) u.voice = voice; u.rate = 0.85;
    u.onend = next; u.onerror = next;
    speechSynthesis.speak(u);
  };
  next();
}
const readAllLabel = 'לְהַקְרִיא אֶת הַסִּפּוּר';
function readAll(btn) {
  if (reading) { stopReading(); return; }
  const items = story().flat();
  if (view === 'final') items.unshift({ id: 'title', text: titleText() });
  read(items);
  if (btn) btn.innerHTML = `${I.stop}לַעֲצֹר`;
}

/* ================= actions ================= */
let advanceTimer = null;
function go(nextView, step) {
  if (step !== undefined) st.step = step;
  view = nextView;
  render();
  window.scrollTo(0, 0);
}
function forward() {
  if (!chosen(STEPS[st.step].key)) return;
  if (st.step < STEPS.length - 1) { sfx('tap'); go('step', st.step + 1); }
  else { sfx('done'); go('final'); }
}
function choose(key, id) {
  st[key] = id;
  if (st.own[key] !== undefined) st.own[key] = '';
  if (key === 'help1' && st.help2 === id) st.help2 = null;
  if (key === 'help2' && st.help1 === id) st.help1 = null;
  sfx('pick');
  render();
  // one tap is enough: move on after the child has seen the choice
  advanceTimer = setTimeout(forward, 700);
}
function options(s) {
  if (s.key === 'hero') return HEROES.map(h => h.id);
  if (s.key === 'place') return PLACES.map(p => p.id);
  if (s.key === 'help1') return COLORS.filter(c => c.id !== st.help2).map(c => c.id);
  if (s.key === 'help2') return COLORS.filter(c => c.id !== st.help1).map(c => c.id);
  return s.list.map(o => o.id);
}
let spinning = false;
function surprise() {
  if (spinning) return;
  const s = STEPS[st.step];
  const ids = options(s), pool = ids.filter(id => id !== st[s.key]);
  const winner = pool[Math.floor(Math.random() * pool.length)];
  const cards = [...app.querySelectorAll(`.card[data-k="${s.key}"]`)];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  sfx('magic');
  if (reduce || !cards.length) { choose(s.key, winner); return; }
  spinning = true;
  let n = 0;
  const spin = () => {
    cards.forEach(c => c.classList.remove('flash'));
    if (n >= 7) { spinning = false; choose(s.key, winner); return; }
    cards[(n * 3 + 1) % cards.length].classList.add('flash');
    n++;
    setTimeout(spin, 95);
  };
  spin();
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || spinning) return;
  clearTimeout(advanceTimer);
  switch (b.dataset.act) {
    case 'new': st = fresh(); lastSeen = new Set(); sfx('tap'); go('step', 0); break;
    case 'resume': sfx('tap'); go(st.screen === 'final' ? 'final' : 'step'); break;
    case 'sound': soundOn = !soundOn; render(); sfx('tap'); break;
    case 'choose': choose(b.dataset.k, b.dataset.id); break;
    case 'surprise': surprise(); break;
    case 'next': forward(); break;
    case 'back':
      sfx('back');
      if (view === 'final') go('step', STEPS.length - 1);
      else if (st.step > 0) go('step', st.step - 1);
      else go('start');
      break;
    case 'goto': sfx('tap'); go('step', +b.dataset.i); break;
    case 'readOne': {
      const sid = b.dataset.sid;
      if (sid === 'title') { read([{ id: 'title', text: titleText() }]); break; }
      const s = story().flat().find(x => x.id === sid);
      if (s) read([s]);
      break;
    }
    case 'readAll': readAll(b); break;
    case 'addExtra': addExtra(); break;
    case 'delExtra': st.extra.splice(+b.dataset.i, 1); sfx('back'); render(); break;
    case 'print': window.print(); break;
  }
  if (st) { st.screen = view === 'final' ? 'final' : 'step'; save(); }
});

function addExtra() {
  const input = document.getElementById('extra');
  const t = input && input.value.trim();
  if (!t) { if (input) input.focus(); return; }
  st.extra.push(t);
  sfx('pick');
  render();
  const again = document.getElementById('extra');
  if (again) again.focus();
}

app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.own) {
    const key = t.dataset.own;
    st.own[key] = t.value;
    if (t.value.trim()) st[key] = 'own';
    else if (st[key] === 'own') st[key] = null;
    t.classList.toggle('filled', st[key] === 'own');
    app.querySelectorAll(`.card[data-k="${key}"]`).forEach(c => {
      const on = st[key] === c.dataset.id;
      c.classList.toggle('on', on); c.setAttribute('aria-pressed', on);
    });
    clearTimeout(advanceTimer);
    refreshStory();
  } else if (t.id === 'title') {
    st.title = t.value;
    save();
  }
});
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'extra') { e.preventDefault(); addExtra(); }
  else if (e.target.dataset.own && chosen(e.target.dataset.own)) { e.preventDefault(); forward(); }
});

if (canSpeak) speechSynthesis.getVoices();   // some browsers load voices lazily
render();
})();
</script>
</body>
</html>
