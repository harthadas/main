<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעבדת צבעים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;600&display=swap">
<style>
/* Layout: one calm column, three fixed zones top-to-bottom (paint bank, test tubes, mix button); the paint is the only saturated color on screen. */
:root {
  --paper: #f3f5f8;
  --surface: #ffffff;
  --ink: #1d2431;
  --ink-soft: #5a6476;
  --line: #d8dee7;
  --glass: #97a3b6;
  --good: #2f8a55;
  --near: #b7791f;
  --display: "Rubik", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --body: "Noto Sans Hebrew", "Rubik", "Arial Hebrew", Arial, sans-serif;
  --radius: 22px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 760px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 16px 32px;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.5; }
svg { display: block; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.icon-btn {
  width: 52px; height: 52px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; flex: none;
}
.icon-btn svg { width: 26px; height: 26px; }
.bar h2 { font-size: 1.35rem; }

/* ---------- home ---------- */
.home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding-block: 24px; }
.home h1 { font-size: clamp(2rem, 7vw, 2.8rem); }
.logo { display: flex; gap: 10px; align-items: flex-end; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 100%; max-width: 720px; }
.mode {
  border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px;
  font-family: var(--display); font-size: 1.45rem; font-weight: 500;
  transition: border-color .15s, transform .15s;
  color: var(--ink); text-decoration: none;
}
.mode:hover { border-color: var(--glass); }
.mode:active { transform: scale(.98); }
.mode svg { width: 76px; height: 76px; }

/* ---------- missions grid ---------- */
.missions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding-block: 16px; }
.mission {
  position: relative;
  border: 2px solid var(--line); background: var(--surface); border-radius: 18px;
  padding: 16px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-family: var(--display); font-size: 1.1rem; line-height: 1.5; text-align: center;
}
.mission:hover { border-color: var(--glass); }
.mission .dot { width: 64px; height: 64px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(29,36,49,.12); }
.mission .done { position: absolute; top: 8px; inset-inline-start: 8px; width: 28px; height: 28px; }

/* ---------- target card (mission mode) ---------- */
.target {
  display: flex; align-items: center; gap: 16px;
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 12px 16px; flex: 1; min-width: 0;
}
.target .dot { width: 56px; height: 56px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(29,36,49,.12); }
.target small { display: block; color: var(--ink-soft); font-size: .95rem; line-height: 1.4; }
.target strong { display: block; font-family: var(--display); font-size: 1.35rem; font-weight: 700; line-height: 1.5; }

/* ---------- lab ---------- */
.lab { display: flex; flex-direction: column; gap: 22px; padding-top: 18px; flex: 1; }
.bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; }
.pot {
  border: 0; background: none; padding: 4px; width: 84px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-family: var(--display); font-size: 1.15rem; font-weight: 500; line-height: 1.6;
  border-radius: 16px;
  transition: opacity .2s;
}
.pot .paint {
  position: relative;
  width: 64px; height: 64px; border-radius: 50%;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.08), inset 0 0 0 2px rgba(29,36,49,.14);
  transition: transform .15s;
}
.pot .paint::after { /* soft highlight so the blob reads as wet paint */
  content: ""; position: absolute; top: 12px; inset-inline-end: 14px;
  width: 14px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.45);
}
.pot:not(:disabled):active .paint { transform: scale(.94); }
.pot.on .paint { box-shadow: 0 0 0 4px var(--paper), 0 0 0 7px var(--ink); }
.pot:disabled { opacity: .3; }
.bank.empty .pot .paint { animation: nudge 2.4s ease-in-out infinite; }
@keyframes nudge { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-6px); } 90% { transform: translateY(0); } }

.bench {
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 18px 8px 14px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; justify-items: center;
}
.slot { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
.slot .step {
  width: 48px; height: 48px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center;
}
.slot .step svg { width: 24px; height: 24px; }
.slot .step:disabled { opacity: .3; }
.slot .remove {
  position: absolute; top: 56px; inset-inline-end: -6px;
  width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; padding: 0;
}
.slot .remove svg { width: 14px; height: 14px; }
.tube-btn { border: 0; background: none; padding: 0; touch-action: manipulation; }
.count {
  font-family: var(--display); font-weight: 700; font-size: 1.35rem; line-height: 1;
  font-variant-numeric: tabular-nums; min-height: 1.35rem;
}
.ghost { opacity: .55; }
.ghost .step { visibility: hidden; }

.mix {
  border: 0; border-radius: 999px; background: var(--ink); color: var(--surface);
  font-family: var(--display); font-weight: 700; font-size: 1.5rem;
  padding: 14px 40px; min-height: 68px;
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  align-self: center; min-width: min(320px, 100%);
  transition: transform .15s, opacity .2s;
}
.mix svg { width: 30px; height: 30px; }
.mix:not(:disabled):active { transform: scale(.97); }
.mix:disabled { opacity: .25; }

/* ---------- result ---------- */
.result { display: flex; flex-direction: column; align-items: center; gap: 22px; padding-top: 18px; flex: 1; }
.bowl-row { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }
.bowl {
  position: relative; width: 210px; height: 210px; max-width: 100%; border-radius: 50%;
  background: var(--surface);
  box-shadow: 0 0 0 12px #e7ebf1, 0 0 0 14px var(--line);
  overflow: hidden;
}
.bowl .swirl, .bowl .final { position: absolute; inset: 0; border-radius: 50%; }
.bowl .swirl { filter: blur(10px); transform: scale(1.2); animation: swirl 1.6s cubic-bezier(.3,.1,.3,1) forwards; }
.bowl .final { opacity: 0; animation: settle .7s ease-out 1.1s forwards; box-shadow: inset 0 -10px 0 rgba(0,0,0,.06); }
@keyframes swirl { from { transform: scale(1.2) rotate(0); } to { transform: scale(1.2) rotate(540deg); } }
@keyframes settle { to { opacity: 1; } }
.vs { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--ink-soft); font-size: .95rem; }
.vs .dot { width: 84px; height: 84px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(29,36,49,.12); }
.vs svg { width: 22px; height: 22px; }
.name { font-family: var(--display); font-size: 1.5rem; font-weight: 700; min-height: 1.5em; line-height: 1.5; }

.verdict { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.verdict .say { font-family: var(--display); font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.verdict .say svg { width: 34px; height: 34px; }
.verdict.good .say { color: var(--good); }
.verdict.near .say { color: var(--near); }
.hint {
  display: inline-flex; align-items: center; gap: 10px;
  border: 2px dashed var(--line); border-radius: 999px; padding: 6px 16px 6px 10px;
  font-family: var(--display); font-size: 1.2rem; font-weight: 500;
}
.hint .chip { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(29,36,49,.14); }

.recipe {
  width: 100%; max-width: 560px;
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 14px 10px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.recipe h2 { font-size: 1.3rem; }
.formula { display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: nowrap; max-width: 100%; }
.formula .item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.formula .op { font-family: var(--display); font-size: 1.6rem; font-weight: 700; color: var(--ink-soft); width: 20px; text-align: center; }
.formula .blob { width: 58px; height: 58px; border-radius: 50%; box-shadow: inset 0 -5px 0 rgba(0,0,0,.08), inset 0 0 0 2px rgba(29,36,49,.12); }
.formula .count { font-size: 1.15rem; }

.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.act {
  border: 2px solid var(--line); background: var(--surface); border-radius: 999px;
  font-family: var(--display); font-weight: 500; font-size: 1.2rem;
  padding: 10px 24px; min-height: 56px;
  display: inline-flex; align-items: center; gap: 10px;
}
.act svg { width: 24px; height: 24px; }
.act.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }

@media (max-width: 420px) {
  body { font-size: 17px; }
  .bank { gap: 8px 4px; }
  .pot { width: 62px; }
  .pot .paint { width: 52px; height: 52px; }
  .pot .paint::after { top: 9px; inset-inline-end: 11px; width: 11px; height: 7px; }
  .bench { padding-inline: 2px; }
  .slot .step { width: 44px; height: 44px; }
  .slot .remove { top: 50px; }
  .bowl { width: 180px; height: 180px; }
  .vs .dot { width: 70px; height: 70px; }
  .formula .blob { width: 46px; height: 46px; }
  .formula .op { width: 14px; font-size: 1.3rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .bowl .final { opacity: 1; }
}
</style>
</head>
<body>
<div id="app" lang="he" dir="rtl"></div>

<script>
(() => {
/* ================= paint model =================
   Each base paint has a reflectance curve (16 bands, 400–700nm).
   Paints mix by Kubelka–Munk: absorption/scattering ratios are averaged
   by amount, so blue + yellow gives green, as with real paint. */
const WL = [400,420,440,460,480,500,520,540,560,580,600,620,640,660,680,700];
const CMF = [
  [0.0143,0.0004,0.0679],[0.1344,0.0040,0.6456],[0.3483,0.0230,1.7471],[0.2908,0.0600,1.6692],
  [0.0956,0.1390,0.8130],[0.0049,0.3230,0.2720],[0.0633,0.7100,0.0782],[0.2904,0.9540,0.0203],
  [0.5945,0.9950,0.0039],[0.9163,0.8700,0.0017],[1.0622,0.6310,0.0008],[0.8544,0.3810,0.0002],
  [0.4479,0.1750,0.0000],[0.1649,0.0610,0.0000],[0.0468,0.0170,0.0000],[0.0114,0.0041,0.0000]];
const D65 = [82.75,93.43,104.86,117.81,115.92,109.35,104.79,104.41,100,95.79,90.01,87.7,83.7,80.21,78.28,71.61];
let NORM = 0; for (let i = 0; i < WL.length; i++) NORM += D65[i] * CMF[i][1];
const sig = (x, c, w) => 1 / (1 + Math.exp(-(x - c) / w));
const curve = f => WL.map(f);

// strength = tinting strength (how much one notch of this paint shifts a mix)
const PAINTS = [
  { id: 'red',    name: 'אָדֹם', strength: 1,    R: curve(l => 0.04 + 0.86*sig(l,592,9) + 0.09*sig(-l,-440,12)) },
  { id: 'yellow', name: 'צָהֹב', strength: 1.5,  R: curve(l => 0.04 + 0.86*sig(l,502,10) - 0.06*sig(l,620,20)) },
  { id: 'blue',   name: 'כָּחֹל', strength: 1,    R: curve(l => 0.03 + 0.62*sig(-l,-512,15) + 0.2*sig(l,660,12)) },
  { id: 'white',  name: 'לָבָן', strength: 5,    R: curve(() => 0.93) },
  { id: 'black',  name: 'שָׁחֹר', strength: 0.45, R: curve(() => 0.03) },
];
const PAINT = Object.fromEntries(PAINTS.map(p => [p.id, p]));
const ks = r => (1 - r) * (1 - r) / (2 * r);
const unks = k => 1 + k - Math.sqrt(k * k + 2 * k);

function mixRGB(parts) {
  let tot = 0;
  parts.forEach(p => { tot += p.n * PAINT[p.id].strength; });
  let X = 0, Y = 0, Z = 0;
  WL.forEach((_, i) => {
    let k = 0;
    parts.forEach(p => { k += p.n * PAINT[p.id].strength / tot * ks(PAINT[p.id].R[i]); });
    const e = D65[i] * unks(k);
    X += e * CMF[i][0]; Y += e * CMF[i][1]; Z += e * CMF[i][2];
  });
  X /= NORM; Y /= NORM; Z /= NORM;
  const gam = c => { c = Math.min(1, Math.max(0, c)); return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; };
  return [3.2406*X - 1.5372*Y - 0.4986*Z, -0.9689*X + 1.8758*Y + 0.0415*Z, 0.0557*X - 0.2040*Y + 1.0570*Z]
    .map(c => Math.round(gam(c) * 255));
}
const css = rgb => `rgb(${rgb[0]} ${rgb[1]} ${rgb[2]})`;

function lab([r, g, b]) {
  const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const R = lin(r), G = lin(g), B = lin(b);
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const X = (0.4124*R + 0.3576*G + 0.1805*B) / 0.95047, Y = 0.2126*R + 0.7152*G + 0.0722*B, Z = (0.0193*R + 0.1192*G + 0.9505*B) / 1.08883;
  return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
}
// CIEDE2000 color difference
function deltaE(a, b) {
  const [L1, a1, b1] = a, [L2, a2, b2] = b, rad = Math.PI / 180, p7 = Math.pow(25, 7);
  const Cb = (Math.hypot(a1, b1) + Math.hypot(a2, b2)) / 2;
  const G = 0.5 * (1 - Math.sqrt(Math.pow(Cb, 7) / (Math.pow(Cb, 7) + p7)));
  const ap1 = (1 + G) * a1, ap2 = (1 + G) * a2, C1 = Math.hypot(ap1, b1), C2 = Math.hypot(ap2, b2);
  const hue = (x, y) => { if (!x && !y) return 0; const h = Math.atan2(y, x) / rad; return h >= 0 ? h : h + 360; };
  const h1 = hue(ap1, b1), h2 = hue(ap2, b2);
  let dh = 0; if (C1 * C2) { dh = h2 - h1; if (dh > 180) dh -= 360; else if (dh < -180) dh += 360; }
  const dL = L2 - L1, dC = C2 - C1, dH = 2 * Math.sqrt(C1 * C2) * Math.sin(dh * rad / 2);
  const Lb = (L1 + L2) / 2, Cpb = (C1 + C2) / 2;
  let hb = h1 + h2; if (C1 * C2) { if (Math.abs(h1 - h2) > 180) hb += hb < 360 ? 360 : -360; hb /= 2; }
  const T = 1 - 0.17*Math.cos((hb - 30)*rad) + 0.24*Math.cos(2*hb*rad) + 0.32*Math.cos((3*hb + 6)*rad) - 0.2*Math.cos((4*hb - 63)*rad);
  const dT = 30 * Math.exp(-Math.pow((hb - 275) / 25, 2));
  const RC = 2 * Math.sqrt(Math.pow(Cpb, 7) / (Math.pow(Cpb, 7) + p7));
  const SL = 1 + 0.015 * Math.pow(Lb - 50, 2) / Math.sqrt(20 + Math.pow(Lb - 50, 2)), SC = 1 + 0.045 * Cpb, SH = 1 + 0.015 * Cpb * T;
  const RT = -Math.sin(2 * dT * rad) * RC;
  return Math.sqrt(Math.pow(dL/SL, 2) + Math.pow(dC/SC, 2) + Math.pow(dH/SH, 2) + RT * (dC/SC) * (dH/SH));
}

PAINTS.forEach(p => { p.rgb = mixRGB([{ id: p.id, n: 1 }]); });

/* ================= missions =================
   Each target is defined by a recipe, so it is always reachable
   and its sample is exactly what the model paints. */
const MISSIONS = [
  { name: 'כָּתֹם',               recipe: { red: 1, yellow: 2 } },
  { name: 'יָרֹק',                recipe: { blue: 1, yellow: 2 } },
  { name: 'סָגֹל',                recipe: { red: 1, blue: 1 } },
  { name: 'וָרֹד',                recipe: { red: 1, white: 2 } },
  { name: 'אָפֹר',                recipe: { black: 1, white: 2 } },
  { name: 'תְּכֵלֶת',              recipe: { blue: 1, white: 4 } },
  { name: 'חוּם',                 recipe: { red: 2, yellow: 2, blue: 1 } },
  { name: 'וָרֹד בָּהִיר מְאוֹד',     recipe: { red: 1, white: 6 } },
  { name: 'הָאָפֹר הֲכִי כֵּהֶה',     recipe: { black: 6, white: 1 } },
  { name: 'אָפֹר בָּהִיר מְאוֹד',     recipe: { black: 1, white: 6 } },
  { name: 'בּוֹרְדוֹ',              recipe: { red: 5, blue: 1, black: 1 } },
  { name: 'יָרֹק זַיִת',            recipe: { yellow: 3, black: 1 } },
  { name: 'לִילָךְ',               recipe: { red: 1, blue: 1, white: 4 } },
  { name: 'כָּחֹל כֵּהֶה',           recipe: { blue: 4, black: 1 } },
  { name: 'אֲפַרְסֵק',             recipe: { red: 1, yellow: 2, white: 3 } },
  { name: 'טוּרְקִיז',             recipe: { blue: 2, yellow: 1, white: 2 } },
  { name: 'יָרֹק בָּהִיר',          recipe: { blue: 1, yellow: 3, white: 2 } },
  { name: 'צָהֹב בָּהִיר',          recipe: { yellow: 1, white: 3 } },
  { name: 'בֶּז׳',                 recipe: { red: 1, yellow: 1, black: 1, white: 5 } },
  { name: 'יָרֹק כֵּהֶה',           recipe: { blue: 2, yellow: 2, black: 1 } },
];
MISSIONS.forEach(m => {
  m.rgb = mixRGB(Object.entries(m.recipe).map(([id, n]) => ({ id, n })));
  m.lab = lab(m.rgb);
});

// Error margins for elementary-school eyes (CIEDE2000 units).
const MATCH = 6, CLOSE = 12;
const MAX_N = 6, MAX_TUBES = 4;

/* ================= state ================= */
const state = { view: 'home', mode: 'free', mission: null, tubes: [] };
const DONE_KEY = 'color-lab-done';
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]')); } catch (e) {}
const saveDone = () => { try { localStorage.setItem(DONE_KEY, JSON.stringify([...done])); } catch (e) {} };

/* ================= icons ================= */
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  mix: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 12c0-2 2-3 3.5-2s1.5 4-1 5.5-6.5.5-7.5-3S9 4.5 13 4.5s8 3 8 7.5-4 8.5-9 8.5"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
};

/* ================= test tube =================
   One drawing used everywhere: while choosing amounts and in the recipe,
   so the notches a child counts are the same in both places. */
const TUBE = { w: 64, h: 204, top: 22, bottom: 196, inX: 12, inW: 40 };
const STEP = (TUBE.bottom - 26) / MAX_N;          // height of one notch
let uid = 0;
function tubeSVG(color, n, height) {
  const id = 'tc' + (++uid);
  const { w, h, top, bottom, inX, inW } = TUBE;
  const r = inW / 2;
  const inner = `M${inX} ${top} V${bottom - r} A${r} ${r} 0 0 0 ${inX + inW} ${bottom - r} V${top} Z`;
  const fillY = bottom - n * STEP;
  let ticks = '';
  for (let i = 1; i <= MAX_N; i++) {
    const y = bottom - i * STEP;
    ticks += `<path d="M${inX} ${y}h${i % 2 ? 14 : 22}" stroke="#1d2431" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>`;
  }
  return `<svg width="${Math.round(w * height / h)}" height="${height}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <defs><clipPath id="${id}"><path d="${inner}"/></clipPath></defs>
    <path d="${inner}" fill="#e3e8ef"/>
    ${n > 0 ? `<g clip-path="url(#${id})"><rect class="liquid" x="0" y="${fillY}" width="${w}" height="${h - fillY}" fill="${color}"/><rect x="0" y="${fillY}" width="${w}" height="3.5" fill="#1d2431" fill-opacity=".3"/></g>` : ''}
    ${ticks}
    <path d="${inner}" fill="none" stroke="#97a3b6" stroke-width="3"/>
    <rect x="${inX - 6}" y="${top - 8}" width="${inW + 12}" height="9" rx="4.5" fill="#ffffff" stroke="#97a3b6" stroke-width="3"/>
  </svg>`;
}
function emptyTubeSVG(height) {
  const { w, h, top, bottom, inX, inW } = TUBE, r = inW / 2;
  const inner = `M${inX} ${top} V${bottom - r} A${r} ${r} 0 0 0 ${inX + inW} ${bottom - r} V${top} Z`;
  return `<svg width="${Math.round(w * height / h)}" height="${height}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${inner}" fill="none" stroke="#97a3b6" stroke-width="2.5" stroke-dasharray="7 7"/></svg>`;
}

/* ================= rendering ================= */
const app = document.getElementById('app');
const small = () => window.matchMedia('(max-width: 420px)').matches;

function render() {
  const focusKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  uid = 0;
  app.innerHTML = ({ home: homeView, missions: missionsView, lab: labView, result: resultView })[state.view]();
  if (focusKey) {
    const el = app.querySelector(`[data-key="${focusKey}"]`);
    if (el && !el.disabled) el.focus();
  }
}

function homeView() {
  const logo = ['red', 'yellow', 'blue'].map((id, i) => tubeSVG(css(PAINT[id].rgb), [4, 3, 5][i], 120)).join('');
  return `<div class="home">
    <div class="logo">${logo}</div>
    <h1>מַעְבֶּדֶת צְבָעִים</h1>
    <div class="modes">
      <button class="mode" data-act="free" data-key="free">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="22" cy="26" r="14" fill="${css(PAINT.red.rgb)}"/>
          <circle cx="42" cy="26" r="14" fill="${css(PAINT.yellow.rgb)}" fill-opacity=".9"/>
          <circle cx="32" cy="43" r="14" fill="${css(PAINT.blue.rgb)}" fill-opacity=".85"/>
        </svg>
        מִשְׂחָק חָפְשִׁי
      </button>
      <button class="mode" data-act="missions" data-key="missions">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="26" fill="none" stroke="#1d2431" stroke-width="4"/>
          <circle cx="32" cy="32" r="16" fill="${css(MISSIONS[2].rgb)}"/>
          <circle cx="32" cy="32" r="6" fill="#ffffff"/>
        </svg>
        מְשִׂימוֹת
      </button>
      <a class="mode" href="story.html">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M8 14h20a4 4 0 0 1 4 4v34a4 4 0 0 0-4-4H8z" fill="#ffffff" stroke="#1d2431" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M56 14H36a4 4 0 0 0-4 4v34a4 4 0 0 1 4-4h20z" fill="#ffffff" stroke="#1d2431" stroke-width="3.5" stroke-linejoin="round"/>
          <circle cx="20" cy="30" r="7" fill="${css(PAINT.red.rgb)}"/>
          <circle cx="44" cy="30" r="7" fill="${css(PAINT.blue.rgb)}"/>
        </svg>
        סִפּוּרִים
      </a>
    </div>
  </div>`;
}

function missionsView() {
  return `<div class="bar">
      <button class="icon-btn" data-act="home" data-key="home" aria-label="הַבַּיְתָה">${I.back}</button>
      <h2>מְשִׂימוֹת</h2>
    </div>
    <div class="missions">
      ${MISSIONS.map((m, i) => `<button class="mission" data-act="pick" data-i="${i}" data-key="m${i}">
        ${done.has(i) ? `<span class="done" style="color:var(--good)" aria-label="הַצְלָחָה">${I.star}</span>` : ''}
        <span class="dot" style="background:${css(m.rgb)}"></span>
        <span>${m.name}</span>
      </button>`).join('')}
    </div>`;
}

function targetCard() {
  const m = MISSIONS[state.mission];
  return `<div class="target">
    <span class="dot" style="background:${css(m.rgb)}"></span>
    <div><small>נַסּוּ לְהָכִין</small><strong>${m.name}</strong></div>
  </div>`;
}

function labView() {
  const isMission = state.mode === 'mission';
  const used = new Set(state.tubes.map(t => t.id));
  const full = state.tubes.length >= MAX_TUBES;
  const th = small() ? 150 : 186;

  const bank = PAINTS.map(p => {
    const on = used.has(p.id);
    return `<button class="pot${on ? ' on' : ''}" data-act="toggle" data-id="${p.id}" data-key="pot-${p.id}"
      aria-pressed="${on}" ${!on && full ? 'disabled' : ''}>
      <span class="paint" style="background:${css(p.rgb)}"></span>${p.name}</button>`;
  }).join('');

  let slots = '';
  for (let i = 0; i < MAX_TUBES; i++) {
    const t = state.tubes[i];
    if (!t) {
      slots += `<div class="slot ghost"><span class="step"></span>${emptyTubeSVG(th)}<span class="count"></span><span class="step"></span></div>`;
      continue;
    }
    const p = PAINT[t.id];
    slots += `<div class="slot">
      <button class="step" data-act="more" data-i="${i}" data-key="more-${t.id}" aria-label="עוֹד ${p.name}" ${t.n >= MAX_N ? 'disabled' : ''}>${I.plus}</button>
      <button class="remove" data-act="remove" data-i="${i}" data-key="rm-${t.id}" aria-label="לְהוֹצִיא ${p.name}">${I.x}</button>
      <button class="tube-btn" data-act="level" data-i="${i}" data-key="tube-${t.id}" aria-label="${p.name} ${t.n}">${tubeSVG(css(p.rgb), t.n, th)}</button>
      <span class="count">${t.n}</span>
      <button class="step" data-act="less" data-i="${i}" data-key="less-${t.id}" aria-label="פָּחוֹת ${p.name}" ${t.n <= 1 ? 'disabled' : ''}>${I.minus}</button>
    </div>`;
  }

  return `<div class="bar">
      <button class="icon-btn" data-act="${isMission ? 'missions' : 'home'}" data-key="back" aria-label="חֲזָרָה">${I.back}</button>
      ${isMission ? targetCard() : ''}
    </div>
    <div class="lab">
      <div class="bank${state.tubes.length ? '' : ' empty'}">${bank}</div>
      <div class="bench">${slots}</div>
      <button class="mix" data-act="mix" data-key="mix" ${state.tubes.length < 2 ? 'disabled' : ''}>${I.mix}לְעַרְבֵּב</button>
    </div>`;
}

function nearestName(l) {
  let best = null, bd = Infinity;
  PAINTS.forEach(p => { const d = deltaE(l, lab(p.rgb)); if (d < bd) { bd = d; best = p.name; } });
  MISSIONS.forEach(m => { const d = deltaE(l, m.lab); if (d < bd) { bd = d; best = m.name; } });
  return bd <= MATCH ? best : '';
}

// The single change (one notch more or less, or one paint added/removed)
// that brings the mix closest to the target.
function findHint(tubes, target) {
  const dist = ts => deltaE(lab(mixRGB(ts)), target);
  let best = null, bestD = dist(tubes);
  const consider = (ts, h) => { const d = dist(ts); if (d < bestD - 0.5) { bestD = d; best = h; } };
  tubes.forEach((t, i) => {
    if (t.n < MAX_N) consider(tubes.map((u, j) => j === i ? { ...u, n: u.n + 1 } : u), { id: t.id, kind: 'more' });
    if (t.n > 1) consider(tubes.map((u, j) => j === i ? { ...u, n: u.n - 1 } : u), { id: t.id, kind: 'less' });
    else if (tubes.length > 1) consider(tubes.filter((_, j) => j !== i), { id: t.id, kind: 'without' });
  });
  if (tubes.length < MAX_TUBES) {
    PAINTS.filter(p => !tubes.some(t => t.id === p.id))
      .forEach(p => consider([...tubes, { id: p.id, n: 1 }], { id: p.id, kind: 'add' }));
  }
  return best;
}

function resultView() {
  const isMission = state.mode === 'mission';
  const rgb = mixRGB(state.tubes);
  const l = lab(rgb);
  const th = small() ? 104 : 128;
  const total = state.tubes.reduce((s, t) => s + t.n, 0);

  // swirl: each paint gets a slice proportional to its notches
  let acc = 0;
  const stops = state.tubes.map(t => {
    const a = acc, b = acc + t.n / total * 360; acc = b;
    return `${css(PAINT[t.id].rgb)} ${a}deg ${b}deg`;
  }).join(', ');

  const formula = state.tubes.map((t, i) =>
    `${i ? '<span class="op">+</span>' : ''}<div class="item">${tubeSVG(css(PAINT[t.id].rgb), t.n, th)}<span class="count">${t.n}</span></div>`
  ).join('') + `<span class="op">=</span><div class="item"><span class="blob" style="background:${css(rgb)}"></span><span class="count">&nbsp;</span></div>`;

  let verdict = '', actions = '';
  if (isMission) {
    const m = MISSIONS[state.mission];
    const d = deltaE(l, m.lab);
    if (d <= MATCH) {
      verdict = `<div class="verdict good"><div class="say">${I.star}כָּל הַכָּבוֹד!</div></div>`;
      actions = (state.mission < MISSIONS.length - 1
        ? `<button class="act primary" data-act="nextMission" data-key="next">מְשִׂימָה הַבָּאָה${I.next}</button>` : '')
        + `<button class="act" data-act="missions" data-key="list">${I.target}כָּל הַמְּשִׂימוֹת</button>`;
    } else {
      const h = findHint(state.tubes, m.lab);
      let hint = '';
      if (h) {
        const p = PAINT[h.id];
        const words = { more: `עוֹד קְצָת ${p.name}`, add: `לְהוֹסִיף קְצָת ${p.name}`, less: `פָּחוֹת ${p.name}`, without: `בְּלִי ${p.name}` }[h.kind];
        hint = `<div class="hint"><span class="chip" style="background:${css(p.rgb)}"></span>${words}</div>`;
      }
      verdict = `<div class="verdict ${d <= CLOSE ? 'near' : ''}"><div class="say">${d <= CLOSE ? 'קָרוֹב מְאוֹד!' : 'נַסּוּ שׁוּב'}</div>${hint}</div>`;
      actions = `<button class="act primary" data-act="edit" data-key="edit">${I.redo}לְנַסּוֹת שׁוּב</button>`;
    }
  } else {
    actions = `<button class="act primary" data-act="edit" data-key="edit">${I.back}לְשַׁנּוֹת</button>
      <button class="act" data-act="fresh" data-key="fresh">${I.plus}חָדָשׁ</button>`;
  }

  const target = isMission
    ? `<div class="vs"><span class="dot" style="background:${css(MISSIONS[state.mission].rgb)}"></span>${I.target}</div>` : '';

  return `<div class="bar">
      <button class="icon-btn" data-act="${isMission ? 'missions' : 'home'}" data-key="back" aria-label="חֲזָרָה">${I.back}</button>
      ${isMission ? targetCard() : ''}
    </div>
    <div class="result">
      <div class="bowl-row">
        <div class="bowl" role="img" aria-label="הַצֶּבַע שֶׁיָּצָא">
          <div class="swirl" style="background:conic-gradient(${stops})"></div>
          <div class="final" style="background:${css(rgb)}"></div>
        </div>
        ${target}
      </div>
      ${isMission ? verdict : `<div class="name">${nearestName(l)}</div>`}
      <section class="recipe" aria-label="מַתְכּוֹן">
        <h2>הַמַּתְכּוֹן</h2>
        <div class="formula">${formula}</div>
      </section>
      <div class="actions">${actions}</div>
    </div>`;
}

/* ================= actions ================= */
function go(view) { state.view = view; render(); window.scrollTo(0, 0); }

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const i = +b.dataset.i;
  switch (b.dataset.act) {
    case 'home': go('home'); break;
    case 'free': state.mode = 'free'; state.mission = null; state.tubes = []; go('lab'); break;
    case 'missions': state.mode = 'mission'; go('missions'); break;
    case 'pick': state.mode = 'mission'; state.mission = i; state.tubes = []; go('lab'); break;
    case 'nextMission': state.mission = Math.min(MISSIONS.length - 1, state.mission + 1); state.tubes = []; go('lab'); break;
    case 'toggle': {
      const at = state.tubes.findIndex(t => t.id === b.dataset.id);
      if (at >= 0) state.tubes.splice(at, 1);
      else if (state.tubes.length < MAX_TUBES) state.tubes.push({ id: b.dataset.id, n: 1 });
      render(); break;
    }
    case 'remove': state.tubes.splice(i, 1); render(); break;
    case 'more': state.tubes[i].n = Math.min(MAX_N, state.tubes[i].n + 1); render(); break;
    case 'less': state.tubes[i].n = Math.max(1, state.tubes[i].n - 1); render(); break;
    case 'level': {
      // tap on the tube: fill up to the notch that was touched
      const svg = b.querySelector('svg');
      const box = svg.getBoundingClientRect();
      let n;
      if (e.detail === 0) n = state.tubes[i].n % MAX_N + 1;   // keyboard: step up, wrap around
      else {
        const y = (e.clientY - box.top) / box.height * TUBE.h;
        n = Math.ceil((TUBE.bottom - y) / STEP);
      }
      state.tubes[i].n = Math.max(1, Math.min(MAX_N, n));
      render(); break;
    }
    case 'mix': {
      if (state.tubes.length < 2) return;
      if (state.mode === 'mission' && deltaE(lab(mixRGB(state.tubes)), MISSIONS[state.mission].lab) <= MATCH) {
        done.add(state.mission); saveDone();
      }
      go('result'); break;
    }
    case 'edit': go('lab'); break;
    case 'fresh': state.tubes = []; go('lab'); break;
  }
});

let lastSmall = small();
window.addEventListener('resize', () => { if (small() !== lastSmall) { lastSmall = small(); render(); } });

render();
})();
</script>
</body>
