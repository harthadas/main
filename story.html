async function showBook() {
  const token = Symbol();
  showBook.token = token;
  try {
    const pages = await buildBook();
    if (showBook.token !== token || view !== 'book') return;
    bookPages = pages;
    const el = document.getElementById('pages');
    el.innerHTML = pages.map((src, i) => `<figure class="page"><img src="${src}" alt="${i ? `עַמּוּד ${i + 1}` : 'כְּרִיכָה'}"></figure>`).join('');
    app.querySelectorAll('[data-act="pdf"], [data-act="print"]').forEach(b => { b.disabled = false; });
    bookStatus(`${pages.length} עַמּוּדִים`);
  } catch (e) {
    if (view === 'book') bookStatus('לֹא הִצְלַחְנוּ לְהָכִין אֶת הַסֵּפֶר. נַסּוּ שׁוּב.');
  }
}

// Live update of the story while typing, without rebuilding the inputs.
function refreshStory() {
  stopReading();
  const el = document.getElementById('story');
  if (el && view === 'step') el.innerHTML = storyHTML(false);
  const next = app.querySelector('[data-act="next"]');
  if (next) next.disabled = !chosen(M().steps[st.step].key);
  const stage = app.querySelector('.stage');
  if (stage) stage.innerHTML = M().stage();
  save();
}

/* ================= actions ================= */
let advanceTimer = null;
function go(nextView, step) {
  if (step !== undefined) st.step = step;
  view = nextView;
  if (st) st.screen = view === 'final' || view === 'book' ? 'final' : 'step';
  render();
  window.scrollTo(0, 0);
  if (view === 'book') showBook();
}
function forward() {
  if (!chosen(M().steps[st.step].key)) return;
  if (st.step < M().steps.length - 1) { sfx('tap'); go('step', st.step + 1); }
  else { sfx('done'); go('final'); }
}
function choose(key, id) {
  st[key] = id;
  if (st.own[key] !== undefined) st.own[key] = '';
  M().chose(key, id);
  sfx('pick');
  render();
  // one tap is enough: move on after the child has seen the choice
  advanceTimer = setTimeout(forward, 700);
}
let spinning = false;
function surprise() {
  if (spinning) return;
  const s = M().steps[st.step];
  const ids = M().options(s), pool = ids.filter(id => id !== st[s.key]);
  const winner = pool[Math.floor(Math.random() * pool.length)];
  const cards = [...app.querySelectorAll(`.card[data-k="${s.key}"]`)];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  sfx('magic');
  if (reduce || !cards.length) { choose(s.key, winner); return; }
  spinning = true;
  let n = 0;
  const spin = () => {
    cards.forEach(c => c.classList.remove('flash'));
    if (n >= 7) { spinning = false; choose(s.key, winner); return; }
    cards[(n * 3 + 1) % cards.length].classList.add('flash');
    n++;
    setTimeout(spin, 95);
  };
  spin();
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || spinning) return;
  clearTimeout(advanceTimer);
  if (quizClick(b)) return;
  switch (b.dataset.act) {
    case 'new': st = newStory(b.dataset.mode); lastSeen = new Set(); sfx('tap'); go('step', 0); break;
    case 'resume': {
      st = Object.assign(newStory(b.dataset.mode), store.drafts[b.dataset.mode]);
      lastSeen = new Set(); sfx('tap');
      go(st.screen === 'final' ? 'final' : 'step');
      break;
    }
    case 'home': sfx('tap'); view = 'start'; render(); window.scrollTo(0, 0); break;
    case 'sound': store.sound = !store.sound; render(); sfx('tap'); break;
    case 'choose': choose(b.dataset.k, b.dataset.id); break;
    case 'surprise': surprise(); break;
    case 'next': forward(); break;
    case 'back':
      sfx('back');
      if (view === 'book') go('final');
      else if (view === 'final') go('step', M().steps.length - 1);
      else if (st.step > 0) go('step', st.step - 1);
      else { view = 'start'; render(); }
      break;
    case 'goto': sfx('tap'); go('step', +b.dataset.i); break;
    case 'readOne': {
      const sid = b.dataset.sid;
      if (sid === 'title') { read([{ id: 'title', text: titleText() }]); break; }
      const s = story().flat().find(x => x.id === sid);
      if (s) read([s]);
      break;
    }
    case 'readAll': readAll(b); break;
    case 'addExtra': addExtra(); break;
    case 'delExtra': st.extra.splice(+b.dataset.i, 1); sfx('back'); render(); break;
    case 'book': sfx('tap'); go('book'); break;
    case 'pdf': savePdf(b); break;
    case 'print': window.print(); break;
  }
});

function addExtra() {
  const input = document.getElementById('extra');
  const t = input && input.value.trim();
  if (!t) { if (input) input.focus(); return; }
  st.extra.push(t);
  sfx('pick');
  render();
  const again = document.getElementById('extra');
  if (again) again.focus();
}

app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.own) {
    const key = t.dataset.own;
    st.own[key] = t.value;
    if (t.value.trim()) st[key] = 'own';
    else if (st[key] === 'own') st[key] = null;
    t.classList.toggle('filled', st[key] === 'own');
    app.querySelectorAll(`.card[data-k="${key}"]`).forEach(c => {
      const on = st[key] === c.dataset.id;
      c.classList.toggle('on', on); c.setAttribute('aria-pressed', on);
    });
    clearTimeout(advanceTimer);
    refreshStory();
  } else if (t.id === 'title') { st.title = t.value; save(); }
  else if (t.id === 'author') { st.author = t.value; save(); }
});
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'extra') { e.preventDefault(); addExtra(); }
  else if (e.target.dataset.own && chosen(e.target.dataset.own)) { e.preventDefault(); forward(); }
});

if (canSpeak) speechSynthesis.getVoices();   // some browsers load voices lazily
render();
})();
</script>
